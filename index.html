<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReTrends — Coastal Karnataka Property Explorer</title>
    <meta
      name="description"
      content="ReTrends is a curated, early-access property explorer for coastal Karnataka. Explore Udupi and Manipal listings on an interactive map with real market trends."
    />
    <meta name="author" content="ReTrends" />

    <meta property="og:title" content="ReTrends — Coastal Karnataka Property Explorer" />
    <meta
      property="og:description"
      content="Explore curated property listings and real market trends across Udupi, Manipal and coastal Karnataka."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://propertysignal.in/" />
    <!-- Social scrapers (WhatsApp/Facebook/X) require an absolute raster URL at 1200x630. -->
    <meta
      property="og:image"
      content="https://propertysignal.in/og-card.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ReTrends — Coastal Karnataka homes, honestly curated"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReTrends — Coastal Karnataka Property Explorer" />
    <meta
      name="twitter:description"
      content="Explore curated property listings and real market trends across Udupi, Manipal and coastal Karnataka."
    />
    <meta
      name="twitter:image"
      content="https://propertysignal.in/og-card.png"
    />

    <!-- ReTrends school-discovery mock fonts: Fraunces (serif headline) + Geist Mono
         (data numerals). Scoped to the selected-school summary band only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
