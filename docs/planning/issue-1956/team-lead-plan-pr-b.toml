count_copy = "'N areas with matches'"
zero_match_literal = "'No matches with current filters' — RESTORED AND LOCKED"
plus_n_form = "NEVER used at structural levels"
restoration_note = "Revision 4.1 withdrew this literal on the strength of a browser observation. That observation ('No matching listings in your 3 selected areas' / 'Your search is kept exactly as it is...') was made on the storyboard's Zero results tab, which is the MULTI-AREA / AREA_SET recovery state owned by #2018 — the walk explicitly could not reach a structural Direction/Local-Destination zero-match because filters exist only at the area/listings level. Conflating the two states was the error."

[locked_contracts.cluster_copy]
