identity = "ephemeral — not expected to survive zoom, viewport, filter or membership changes"
arithmetic = "hiddenCount = visibleMemberCount - displayedRepresentativeCount"
gt_zero = "'+N areas with matches'"
eq_zero = "'N areas with matches'"
never = "'+0' is never emitted"
examples = ["visible 5 / displayed 2 -> '+3 areas with matches'", "visible 2 / displayed 2 -> '2 areas with matches'"]

[locked_contracts.count_filter_parity]
decision = "ALL counts displayed as 'matches' use EVERY currently active applicable property filter."
rejected_alternative = "labelling hierarchy counts as purpose/property-type-only counts that do not claim to reflect bedrooms/verification/other filters"
rationale = "DiscoverListingPredicateBuilder already supports the wider filter surface for cards and markers, so the predicate logic exists; AreaCountQuery simply carries a narrower field set and extending it is modest and well-bounded. The alternative would mean a count captioned 'matches' that does not reflect the shopper's active filters — exactly the quietly-wrong number this plan exists to prevent."
consequence = "AreaCountQuery is extended to carry the same normalised filter model cards and markers use, for the applicable subset. A count labelled 'matches' must never overstate relative to the results it advertises. Where a filter is not applicable at a level it is simply absent from that level's query, never silently ignored while still claiming 'matches'."
owner = "PR 1 AC1.16 and the count-endpoint contract"

[locked_contracts.school_count]
definition = "schoolCount = the number of DISTINCT schools PHYSICALLY LOCATED INSIDE the represented canonical area, or inside the represented member areas."
dedup = "stable school identity; aggregate DISTINCT schools across member areas"
not_adopted = "'serving an area'; radius, catchment, travel-time, admission or quality semantics"
filters = "no school board/level filters on the #1956 navigation-count endpoint unless Phase 0 finds an existing in-scope consumer that already requires them"
status = "secondary metadata only; the full Schools-first radius journey is outside #1956 (owned by #1954)"
levels_exhaustive = ["Direction", "Local Destination", "visual AREA cluster", "individual AREA", "the selected shared-marker variants of those"]
withdrawn = "the 'school serving two areas' fixture and radius-based dedup wording are DELETED from PR 1 tests, PR 3 risk 3.4 and the dependency diagram — they described a data model the contract does not adopt"
display_ordering_areas_first = "listing count PRIMARY; schoolCount OPTIONAL SECONDARY metadata"
display_ordering_schools_first = "PRESERVE the already-delivered #1954 behaviour and the current #2014 marker contract; #1956 does NOT redesign field ordering there"
mock_ordering_rejected = "the mock's school-count-PRIMARY marker ordering is explicitly NOT adopted by #1956 — see [forward_ownership].school_primary_marker"
ruling_url = "https://github.com/gautirao/udupi-property-explorer/issues/1956#issuecomment-5094909370"

[locked_contracts.cache_tolerance]
accepted_discrepancy_window = "60 s worst case — 30 s application count cache plus 30 s shared HTTP cache, additive. PROVISIONAL_MVP_BUDGET_REQUIRES_USER_APPROVAL"
forces_fresh_count_on_area_transition = "NO — and it does not need to. The AREA listing view's total is owned by the LISTING-QUERY result identity, never by the hierarchy count cache. The two numbers are never displayed side by side for the same scope, so the inconsistency is removed structurally rather than by cache-busting."
freshness_rule = "DIRECTIONAL: count freshness <= listing freshness, so a count is never staler than the results it advertises. Already satisfied — counts max-age=30, public listings max-age=60 per #1248. Any future change must preserve the inequality."
divergence_response = "cannot arise for one scope by construction; if it ever does, the listing-query total wins and the count is not re-displayed in that view"
gate_3_cache_states = "tests run WARM and COLD, both, explicitly (PR 6 AC6.15)"

[locked_contracts.performance_budget_rule]
rule = "A breached performance budget causes optimisation, a budget review, or a blocking verdict. It NEVER authorises truncation or altered shopper semantics."
never_justifies = ["truncating canonical children", "dropping AREA markers", "omitting counts", "replacing real destinations with a 'top N'", "changing the hierarchy to fit a payload size", "delaying or hiding a feature to hit a request-count budget"]
principle = "If a budget cannot be met without changing what the shopper sees, the budget is wrong or the implementation needs optimising — the product contract does not bend."
request_budget_split_by_state = "hierarchy navigation view <=2; AREA listing view <=3; mobile preview/detail transition <=1 additional. All PROVISIONAL_MVP_BUDGET_REQUIRES_USER_APPROVAL. One number across three different state types was ambiguous."

