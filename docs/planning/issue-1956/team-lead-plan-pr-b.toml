rule = "OpenSearch and caching must NEVER change what the shopper sees — only how quickly it is produced."
before_go_live = "parity tests must guarantee IDENTICAL AREA membership, Buy/Rent semantics, filter semantics, counts, markers, public exposure and sorting versus the Postgres path"
principle = "A faster path that returns a different set is a correctness regression, not an optimisation."

