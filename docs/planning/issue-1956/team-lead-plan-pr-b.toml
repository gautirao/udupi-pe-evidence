[corrections.c5_count_architecture]
backend_owns = "one bounded/batched request keyed by the direct AREA keys plus active filters; per-area eligible listing counts; optional per-area eligible school counts; authoritative aggregate totals computed server-side with the c4 dedup identity; NO N+1."
frontend_owns = "visibility predicate application, representative-name selection, +N arithmetic, visual clustering."
live_measurement_status = "NOT AVAILABLE and NOT ASSUMED. No backend is reachable from this environment (curl to localhost:8080/api/discover/cities/bangalore/navigation/resolve?node=root fails, connection refused). No direct-child maximum is asserted."
static_finding_1 = "src/features/discover/navigation/navigationModel.ts:26-33 — listingAreaKeys() returns [areaKey] for an AREA leaf and otherwise node.descendantAreaKeys. The current request is keyed by DESCENDANTS, not direct children. This is precisely why the 156-descendant node breached a 100 cap, and it is a pre-contract shape."
static_finding_2 = "navigationModel.ts:36-56 — the real ceiling is NOT the number 100. Keys serialise as repeated ?areaKeys= values at ~40-50 encoded chars each, and past ~8KB embedded Tomcat's default max-http-header-size answers 400/431. That puts the hard ceiling near 160-200 keys. 100 was chosen as an already-shipped, user-visibly-documented value, not a measured maximum."
static_finding_3 = "On overflow the MARKER feed fails 400/431 with NO error surface, while the listings half of the same screen truncates cleanly with a banner. Asymmetric and partly silent, and no test covers >100 keys."
static_finding_4 = "The contract caps Directions at 5 and Local Destinations at 6 but places NO cap on direct AREA children — #2014 s4 expects the panel to list and search ALL direct AREA children and to solve density visually. A conformant final parent may legitimately have many direct AREA children, so the frontend must NOT rely on any cap."
decision = "Do not attempt to prove that direct-child counts fit inside a request-line-encoded list. DEFINE SAFE BATCHING NOW: move keys off the request line into a request body or equivalent non-request-line channel so the ~8KB ceiling stops binding; if batching is retained it is DETERMINISTIC and aggregate totals are computed SERVER-SIDE across all batches (never client-side summed, per c4); any surviving truncation must be observable in BOTH the marker and listing feeds, never silent in the marker feed."
phase_0_role = "Phase 0 measures the real maximum direct-AREA-child count under every valid final parent in order to SIZE the batch and produce the regression fixture — it sizes the design, it does not gate it. A measured maximum above roughly 150 makes the body-carried design mandatory rather than merely preferred."

