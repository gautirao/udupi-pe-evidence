[ci_investigation]
note = "STATIC narrative disclosure (PR-review rework, not a per-run computed value) — this section exists so a reader CANNOT come away thinking the CI failures below are resolved. They are NOT resolved. Treat every field below as a plain factual account of the investigation, not a claim of a fix."
ci_run_flagged_new_failures = true
ci_run_id = 31080294040
ci_run_head = "dada3322314b855c381d95baed0d7148a0e141f1"
ci_flagged_test_1 = "AdminCityLaunchControllerIT.case9_errorBodies_sanitized_noInternalDetail (expected 409, got 202)"
ci_flagged_test_2 = "CityLaunchPromotionServiceIT.sequentialDoubleLaunch"
ci_totals = "Tests run: 4006, Failures: 3, Errors: 16"
known_baseline_totals = "Tests run: 4005, Failures: 2, Errors: 15"
local_reproduction_attempted = true
local_reproduction_succeeded = false
local_reproduction_detail = "Full-suite `mvn -o test` runs on BOTH the unfixed head dada3322 AND the @DirtiesContext-hardened code produced IDENTICAL results: 'Tests run: 4006, Failures: 2, Errors: 15, Skipped: 0' — exactly the 5 known pre-existing baseline classes (AdminListingApprovePilotIT, BuyerAreaIntelligenceSeededMedianIT, CityActivationStructuralAntiDriftTest, DiscoverSummaryServiceIT, ResolveAreaIT) and no others, in both runs. AdminCityLaunchControllerIT passed 9/0/0 and CityLaunchPromotionServiceIT passed 16/0/0 — including case9 and sequentialDoubleLaunch specifically — in BOTH local runs. The two CI-flagged failures could not be reproduced locally, on either version of the code."
shared_database_hypothesis_status = "REFUTED"
shared_database_hypothesis_detail = "Investigated and ruled out: every IT class in this suite, including this one, has its own dedicated per-class @Container Postgres instance. There is no shared/singleton-container base class anywhere in the repo, and no testcontainers.reuse.enable setting exists. No DB-row-level leakage mechanism between test classes is possible."
confirmed_defect = "A DIFFERENT, real defect was directly observed locally (NOT the shared-DB hypothesis): a Spring @Scheduled thread (IngestionJobRunner.pollUnprocessedPosts) outlived its own Testcontainers container teardown and hung for a full 30-second HikariCP connection-acquisition timeout before throwing a connection-refused error. This happens because the Spring ApplicationContext and its scheduler thread pool remain alive in the TestContext ContextCache after a test class finishes (no context is closed by default), while subsequent test classes continue executing in the same Surefire JVM (reuseForks=true)."
fix_applied = "@DirtiesContext(classMode = AFTER_CLASS) was added to this IT as DEFENSIVE HARDENING for that confirmed defect. This is EXPLICITLY NOT a verified root-cause fix for the two CI failures — no causal link between this defect and those two specific failures was ever established."
fix_measured_suite_level_effect = "NONE MEASURABLE. The lingering-thread signature was essentially unchanged between the unfixed and @DirtiesContext-hardened full-suite runs: 'pollUnprocessedPosts' log occurrences 79 -> 82, 'Connection to localhost' (refused) occurrences 228 -> 231, 'Shutdown completed' occurrences 60 -> 60 (unchanged). This pattern is endemic to this suite's IT classes generally (none of the ~40+ other Testcontainers-backed IT classes use @DirtiesContext either) — it was not introduced by this issue, and hardening only this one class did not visibly change it. The fix was verified effective ONLY IN ISOLATION (mvn -o test -Dtest=BangaloreCandidateEvidenceIT): the lingering-thread error disappeared from that single class's own log when run alone."
real_verification_pending = "The fix commit's own CI run on its new head is the real verification. If AdminCityLaunchControllerIT.case9 or CityLaunchPromotionServiceIT.sequentialDoubleLaunch fail again on that CI run, that must be treated as a LIVE SIGNAL requiring further investigation — explicitly NOT explained away by this packet or by the @DirtiesContext change."
related_latent_finding_not_fixed_here = "spring.task.scheduling.enabled=false, which this IT and roughly 9 sibling city-launch IT classes set via @TestPropertySource, has ZERO references anywhere in backend/src/main — it is a dead property that gates nothing; no @Scheduled bean actually checks it. This predates this issue, is out of this issue's allowed_file_globs, and is disclosed here as a finding only — NOT fixed in this change. A proper fix belongs in a separate follow-up issue."

