              <button type="button" onClick={t.onRemove} style={s(t.removeStyle)}>×</button>
              {t.isCover && <span style={s(t.coverBadgeStyle)}>Cover</span>}
              {t.notCover && <button type="button" onClick={t.onSelect} style={s(t.setCoverStyle)}>Set cover</button>}
            </div>
          ) : (
            <button key={t.key} type="button" onClick={t.onAdd} style={s(t.emptyStyle)}>+</button>
          ))}
        </div>
        <span style={s('display:block;font-size:12px;color:var(--text-muted);')}>Add clear photos — frontage, interiors, and access matter most for commercial.</span>

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>

        <span style={s(FLD)}>Video link (optional)</span>
        <input type="url" placeholder="Paste a YouTube or Instagram walkthrough link" value={R.vv.videoUrl} onChange={R.h.videoUrl} style={s(TXT)} />
        <span style={s(HINT)}>Optional: a walkthrough helps tenants assess the space remotely.</span>
        {R.hasVideo && (
          <div style={s('margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--trust-verified-fg);background:var(--trust-verified-bg);padding:5px 11px;border-radius:8px;')}><Ico inner={I.play} fill="currentColor" stroke="none" size={13}/>Video added · {R.videoHost}</div>
        )}

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>

        <span style={s(FLDt)}>Map pin</span>

        {R.pinDisabled && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px 20px;text-align:center;background:var(--canvas-100);')}>
            <span style={s('width:34px;height:34px;border-radius:9px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;')}><Ico inner={I.pin} size={17} stroke="var(--grey-400)"/></span>
            <p style={s('margin:0;font-size:13px;color:var(--text-muted);line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto;')}>Add or confirm the address above to enable map pinning.</p>
          </div>
        )}

        {R.pinEnabled && (
          <div style={s('position:relative;height:184px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background-color:#E8EBE6;background-image:linear-gradient(rgba(27,42,69,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,69,0.06) 1px,transparent 1px);background-size:26px 26px;')}>
            <div style={s('position:absolute;top:40%;left:0;right:0;height:14px;background:rgba(255,255,255,0.6);transform:rotate(-4deg);')}></div>
            <div style={s('position:absolute;top:0;bottom:0;left:58%;width:11px;background:rgba(255,255,255,0.6);transform:rotate(3deg);')}></div>
            <div style={s('position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);opacity:0.4;')}><Ico inner={I.pin} stroke="var(--navy-700)" size={30}/></div>
            <div style={s('position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(246,245,242,0) 40%,rgba(246,245,242,0.7));')}>
              <span style={s('font-size:12px;font-weight:600;color:var(--navy-800);background:rgba(255,255,255,0.92);padding:5px 12px;border-radius:8px;box-shadow:var(--shadow-xs);')}>Map centred near {R.resPublic}</span>
              <button type="button" onClick={R.openPicker} style={s('display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 18px;border-radius:8px;border:none;background:var(--navy-800);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm);')}><Ico inner={I.pin} size={15}/>Pin location on map</button>
            </div>
          </div>
        )}

        {R.pinConfirmed && (
          <div>
            <div style={s('position:relative;height:170px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background-color:#E8EBE6;background-image:linear-gradient(rgba(27,42,69,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,69,0.06) 1px,transparent 1px);background-size:26px 26px;')}>
              <div style={s('position:absolute;top:40%;left:0;right:0;height:14px;background:rgba(255,255,255,0.6);transform:rotate(-4deg);')}></div>
              <div style={s('position:absolute;top:0;bottom:0;left:58%;width:11px;background:rgba(255,255,255,0.6);transform:rotate(3deg);')}></div>
              <div style={s('position:absolute;left:'+R.pinPos.x+'%;top:'+R.pinPos.y+'%;transform:translate(-50%,-100%);')}><Ico inner={I.pinFill} fill="var(--copper-500)" stroke="#fff" sw={1.5} size={34}/></div>
            </div>
            <div style={s('margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--trust-verified-bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;')}>
              <div style={s('display:flex;align-items:center;gap:10px;min-width:0;')}>
                <span style={s('width:28px;height:28px;border-radius:50%;background:var(--evergreen-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.check} stroke="#fff" sw={2.6} size={15}/></span>
                <div style={s('min-width:0;')}><div style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Map pin confirmed</div><div style={s('font-size:12px;color:var(--text-muted);')}>Near {R.resPublic}</div></div>
              </div>
              <button type="button" onClick={R.adjustPin} style={s('flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--navy-800);background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;padding:7px 13px;cursor:pointer;')}><Ico inner={I.pin} size={13}/>Adjust pin</button>
            </div>
          </div>
        )}

        {R.pinned && (
          <div style={s('margin-top:18px;background:var(--canvas-100);border:1px solid var(--border);border-radius:12px;padding:16px 18px;')}>
            <div style={s('display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;')}>
              <span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Nearby places</span>
              <button type="button" onClick={R.movePin} style={s('display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy-800);background:var(--paper);border:1px solid var(--border-strong);border-radius:7px;padding:5px 10px;cursor:pointer;')}><Ico inner={I.pin} size={13}/>Move pin</button>
            </div>
            <p style={s('margin:0 0 6px;font-size:12px;color:var(--text-muted);line-height:1.5;')}>Derived from the map after location is pinned. Transport, arterial roads and footfall matter most for commercial — hide anything that looks wrong.</p>
            <div>
              {R.nearbyRows.map(n=>(
                <div key={n.key} style={s(n.rowStyle)}>
                  <span style={s('width:28px;height:28px;border-radius:8px;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.pin} size={15}/></span>
                  <div style={s('flex:1;min-width:0;')}>
                    <div style={s('display:flex;align-items:center;gap:7px;')}><span style={s(n.nameStyle)}>{n.name}</span>{n.manual && <span style={s('font-size:9.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ochre-600);background:var(--ochre-50);padding:1px 6px;border-radius:4px;')}>Added by broker</span>}</div>
                    <div style={s('font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:1px;')}>{n.meta}</div>
                  </div>
                  <button type="button" onClick={n.onToggle} style={s('font-size:12px;font-weight:600;color:var(--text-muted);background:transparent;border:none;cursor:pointer;flex:none;')}>{n.toggleLabel}</button>
                </div>
              ))}
            </div>
            <div style={s('border-top:1px solid var(--border);margin-top:6px;padding-top:14px;')}>
              <span style={s('display:block;font-size:12px;font-weight:600;color:var(--text-strong);margin-bottom:9px;')}>Add a local landmark (optional)</span>
              <div style={s('display:flex;gap:8px;flex-wrap:wrap;align-items:center;')}>
                <input type="text" placeholder="Place name" value={R.poiVals.name} onChange={R.hPoi.name} style={s('flex:2;min-width:140px;height:38px;padding:0 12px;background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-sans);font-size:13px;color:var(--text-strong);')} />
                <div style={s('flex:1.4;min-width:130px;')}><Select options={R.poiCatOpts} value={R.poiVals.cat} onChange={R.hPoi.cat} /></div>
                <input type="text" placeholder="Distance / note" value={R.poiVals.note} onChange={R.hPoi.note} style={s('flex:1;min-width:110px;height:38px;padding:0 12px;background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-sans);font-size:13px;color:var(--text-strong);')} />
                <Button variant="outline" size="sm" onClick={R.addPoi}>Add place</Button>
              </div>
              <span style={s('display:block;font-size:11.5px;color:var(--text-muted);margin-top:9px;')}>Manually added places are shown as added by broker, not platform-verified.</span>
            </div>
          </div>
        )}
      </div>

      {/* 9. Description + AI */}
      <div style={s(CARD)}>
        {this.secHead('9','Description')}
        {R.aiIdle && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:26px 24px;text-align:center;background:var(--canvas-100);')}>
            <div style={s('width:38px;height:38px;border-radius:10px;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;')}><Ico inner={I.sparkle} stroke="var(--copper-500)" size={20}/></div>
            <p style={s('margin:0 0 16px;font-size:14px;color:var(--text-body);line-height:1.55;max-width:400px;margin-left:auto;margin-right:auto;')}>Draft a commercial description from the facts you've already entered. Every word stays editable — nothing is invented, and no approvals, footfall or returns are ever claimed.</p>
            <div style={s('display:flex;gap:10px;justify-content:center;')}>
              <Button variant="accent" onClick={R.doGenerate}>Generate description</Button>
              <Button variant="ghost" onClick={R.editManual}>Write it myself</Button>
            </div>
          </div>
        )}
        {R.aiGenerating && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:38px 24px;text-align:center;background:var(--canvas-100);display:flex;flex-direction:column;align-items:center;gap:14px;')}>
            <span style={s('width:26px;height:26px;border:3px solid var(--navy-100);border-top-color:var(--navy-800);border-radius:50%;animation:spin .7s linear infinite;display:block;')}></span>
            <span style={s('font-size:14px;color:var(--text-muted);')}>Writing from your details…</span>
          </div>
        )}
        {R.aiReady && (
          <div>
            <textarea value={R.desc} onChange={R.onDesc} placeholder="Write a short, factual description…" style={s('width:100%;min-height:148px;padding:14px 16px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:10px;font-size:14.5px;line-height:1.6;color:var(--text-strong);resize:vertical;')}></textarea>
            <div style={s('display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;')}>
              <Button variant="outline" size="sm" onClick={R.doRegen}>Regenerate</Button>
              <Button variant="outline" size="sm" onClick={R.doShorter}>Make shorter</Button>
              <Button variant="outline" size="sm" onClick={R.doFactual}>More factual</Button>
              <Button variant="outline" size="sm" onClick={R.doBusiness}>More business-like</Button>
              <span style={s('flex:1;')}></span>
              <Button variant="primary" size="sm" onClick={R.useDesc}>{R.useDescLabel}</Button>
            </div>
            <p style={s('margin:12px 0 0;font-size:12px;color:var(--text-muted);line-height:1.5;display:flex;align-items:flex-start;gap:6px;')}><Ico inner={I.check} stroke="var(--evergreen-600)" sw={2.2} size={14} style={{marginTop:'1px'}}/>Generated only from details you entered. ReTrends never invents facts, approvals, footfall or guaranteed returns.</p>
          </div>
        )}
      </div>
    </div>
  ); }

  /* ---------------- edit: preview rail ---------------- */
  editRail(R){ return (
    <div style={s('position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;')}>
      <div>
        <div style={s('font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:10px;')}>Buyer / tenant preview</div>
        <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);')}>
          {R.hasPhotos && (
            <div style={s('height:150px;background:linear-gradient(135deg,var(--navy-700),var(--navy-600));position:relative;display:flex;align-items:flex-end;padding:12px;')}>
              <span style={s('font-size:11px;color:rgba(255,255,255,0.85);background:rgba(14,22,38,0.45);backdrop-filter:blur(4px);padding:4px 9px;border-radius:6px;font-weight:600;')}>{R.photoCountLabel}</span>
            </div>
          )}
          {R.noPhotos && (
            <div style={s('height:150px;background:var(--canvas-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);')}>
              <Ico inner={I.camera} size={26} sw={1.8}/><span style={s('font-size:12px;')}>Add photos to preview</span>
            </div>
          )}
          <div style={s('padding:16px;')}>
            <div style={s('display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;')}>
              <span style={s('display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--trust-trusted-fg);background:var(--trust-trusted-bg);padding:3px 8px;border-radius:6px;')}><Ico inner={I.shield} sw={2.4} size={12}/>Listed by verified broker</span>
              <span style={s('font-size:11px;font-weight:600;color:var(--navy-800);background:var(--navy-100);padding:3px 8px;border-radius:6px;')}>{R.kindLabel}</span>
              {R.hasStatus && <span style={s('font-size:11px;font-weight:600;color:var(--copper-600);background:var(--accent-tint);padding:3px 8px;border-radius:6px;')}>{R.statusText}</span>}
            </div>
            <div style={s('font-size:16px;font-weight:700;color:var(--text-strong);line-height:1.3;margin-bottom:4px;')}>{R.previewTitle}</div>
            <div style={s('display:flex;align-items:center;gap:5px;font-size:13px;color:'+R.previewLocColor+';margin-bottom:'+(R.previewLocConfirmed?'8px':'12px')+';')}><Ico inner={I.pin} size={13} stroke="var(--grey-400)"/>{R.previewLocMain}</div>
            {R.previewLocConfirmed && <div style={s('margin-bottom:12px;')}><span style={s('display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--trust-verified-fg);background:var(--trust-verified-bg);padding:3px 8px;border-radius:6px;')}><Ico inner={I.check} sw={2.6} size={11}/>Location confirmed</span></div>}
            <div style={s('display:flex;align-items:baseline;gap:8px;margin-bottom:14px;')}>
              <span style={s('font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--navy-900);')}>{R.priceDisplay}</span>
              {R.hasPerSqft && <span style={s('font-family:var(--font-mono);font-size:12px;color:var(--text-muted);')}>{R.perSqft}</span>}
            </div>
            {R.hasSpecs && (
              <div style={s('display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--border);')}>
                {R.specs.map((x,i)=>(<span key={i} style={s('font-size:12px;color:var(--text-body);background:var(--grey-100);padding:4px 9px;border-radius:6px;font-weight:500;')}>{x}</span>))}
              </div>
            )}
            {R.noSpecs && <div style={s('padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);')}>Add details to fill out the preview.</div>}
          </div>
        </div>
      </div>
      {R.showStrength && (
        <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);')}>
          <div style={s('display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;')}>
            <span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Listing strength</span>
            <span style={s('font-size:13px;font-weight:700;font-family:var(--font-mono);color:'+R.strengthColor+';')}>{R.strengthLabel}</span>
          </div>
          <div style={s('height:7px;border-radius:99px;background:var(--grey-200);overflow:hidden;')}><div style={s('height:100%;width:'+R.strengthWidth+';background:'+R.strengthColor+';border-radius:99px;transition:width .3s ease,background .3s ease;')}></div></div>
          <div style={s('margin-top:12px;display:flex;flex-direction:column;gap:8px;')}>
            {R.confirmChips.map(c=>(<div key={c.key} style={s('display:flex;align-items:center;gap:8px;')}><span style={s(c.dot)}>{c.check}</span><span style={s('font-size:12.5px;color:'+c.textColor+';')}>{c.label}</span></div>))}
          </div>
        </div>
      )}
      <div style={s('font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:5px;')}><Ico inner={I.info} size={12}/>{R.derivedNote}</div>
    </div>
  ); }

  /* ---------------- review: listing-detail style ---------------- */
  reviewView(R){ return (
    <React.Fragment>
      {R.notPublished && (
        <React.Fragment>
          <div style={s('display:flex;align-items:center;gap:10px;background:var(--navy-100);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:18px;')}>
            <Ico inner={I.eye} stroke="var(--navy-700)" size={17}/>
            <span style={s('font-size:13px;color:var(--navy-800);font-weight:500;line-height:1.45;')}>A preview of your public listing — this is how buyers and tenants will see it once it's approved. Nothing here is publicly verified; it shows what you entered.</span>
          </div>
          <div className="cl-rev-grid" style={s('display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:28px;align-items:start;')}>
            <div style={s('display:flex;flex-direction:column;gap:18px;min-width:0;')}>

              {/* Gallery */}
              <div style={s('display:flex;flex-direction:column;gap:12px;')}>
                <div style={s('position:relative;height:380px;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);')}>
                  {R.hasPhotos && (
                    <div style={s('position:absolute;inset:0;background:linear-gradient(150deg,var(--navy-700),var(--navy-600) 55%,var(--navy-800));display:flex;align-items:center;justify-content:center;')}>
                      <span style={s('width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;')}><Ico inner={I.camera} stroke="rgba(255,255,255,0.85)" sw={1.8} size={24}/></span>
                    </div>
                  )}
                  {R.noPhotos && (
                    <div style={s('position:absolute;inset:0;background:linear-gradient(160deg,var(--canvas-100),var(--canvas-200));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 24px;')}>
                      <span style={s('width:54px;height:54px;border-radius:16px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;')}><Ico inner={I.camera} stroke="var(--grey-400)" sw={1.8} size={24}/></span>
                      <div style={s('font-size:15px;font-weight:700;color:var(--text-strong);')}>No photos added yet</div>
                      <button type="button" onClick={R.backToEdit} style={s('font-size:13px;font-weight:600;color:var(--navy-800);background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;padding:7px 14px;cursor:pointer;')}>Add photos</button>
                    </div>
                  )}
                  <div style={s('position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--navy-800);background:rgba(255,255,255,0.92);padding:5px 11px;border-radius:9999px;box-shadow:var(--shadow-xs);')}><Ico inner={I.shield} sw={2.2} size={13}/>Listed by verified broker</div>
                  <button type="button" onClick={R.backToEdit} style={s('position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy-800);background:rgba(255,255,255,0.92);border:none;padding:7px 12px;border-radius:9999px;cursor:pointer;box-shadow:var(--shadow-xs);')}><Ico inner={I.pencil} size={13}/>Edit media</button>
                  {R.hasVideo && <div style={s('position:absolute;bottom:14px;left:16px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;background:rgba(14,22,38,0.6);backdrop-filter:blur(4px);padding:5px 11px;border-radius:9999px;font-weight:600;')}><Ico inner={I.play} fill="#fff" stroke="none" size={12}/>Video · {R.videoHost}</div>}
                  {R.hasPhotos && <div style={s('position:absolute;bottom:14px;right:16px;padding:4px 11px;border-radius:9999px;background:rgba(14,22,38,0.72);color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:500;')}>{R.photoCountLabel}</div>}
                </div>
                {R.hasPhotos && (
                  <div style={s('display:flex;gap:10px;flex-wrap:wrap;')}>
                    {R.reviewThumbs.map(th=>(<div key={th.key} style={s(th.style)}>{th.isCover && <span style={s('position:absolute;bottom:4px;left:4px;font-size:8.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;background:var(--copper-500);color:#fff;padding:1px 5px;border-radius:4px;')}>Cover</span>}</div>))}
                    {R.hasVideo && <div style={s('width:92px;height:66px;flex:none;border-radius:8px;border:1px solid var(--border);background:var(--navy-900);display:flex;align-items:center;justify-content:center;')}><Ico inner={I.play} fill="#fff" stroke="none" size={22}/></div>}
                  </div>
                )}
              </div>

              {/* Summary */}
              <div style={s(CARD)}>
                <div style={s('display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;')}>
                  <div style={s('flex:1 1 320px;min-width:0;')}>
                    <div style={s('display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;')}>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--navy-800);background:var(--navy-100);padding:4px 10px;border-radius:9999px;')}>{R.kindLabel}</span>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--copper-600);background:var(--accent-tint);padding:4px 10px;border-radius:9999px;')}>{R.purposeLabel}</span>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--text-body);background:var(--grey-100);padding:4px 10px;border-radius:9999px;')}>Listed by verified broker</span>
                    </div>
                    <div style={s('display:flex;align-items:flex-start;justify-content:space-between;gap:12px;')}>
                      <h1 style={s('margin:0;font-family:var(--font-serif);font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;color:var(--text-strong);')}>{R.previewTitle}</h1>
                      <button type="button" onClick={R.backToEdit} style={s(EDITLINK+'flex:none;padding-top:6px;')}>Edit</button>
                    </div>
                    <div style={s('font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin:6px 0 10px;')}>{R.refNo}</div>
                    {R.hasSpecs && (
                      <div style={s('display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;')}>
                        {R.specs.map((x,i)=>(<span key={i} style={s('font-size:13px;font-weight:600;color:var(--text-body);')}>{x}</span>))}
                      </div>
                    )}
                    <div style={s('display:flex;align-items:center;gap:7px;color:var(--text-body);font-size:14px;')}><Ico inner={I.pin} stroke="var(--grey-400)" size={15}/>{R.previewLocText}</div>
                  </div>
                  <div style={s('flex:none;text-align:right;')}>
                    <div style={s('font-family:var(--font-mono);font-size:28px;font-weight:600;color:var(--text-strong);line-height:1.1;white-space:nowrap;')}>{R.priceDisplay}</div>
                    {R.hasPerSqft && <div style={s('font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:5px;')}>{R.perSqft}</div>}
                    {R.hasGrossYield && <div style={s('margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ochre-600);background:var(--ochre-50);padding:3px 9px;border-radius:6px;font-weight:600;')}>Gross yield {R.grossYieldStr} · derived</div>}
                  </div>
                </div>
              </div>

              {/* Commercial details */}
              <div style={s(CARD)}>
                {this.sectionTitle(I.building,'Commercial details',R)}
                <p style={s('margin:-4px 0 18px;font-size:13px;color:var(--text-muted);')}>Fields that don't apply to this commercial type stay hidden.</p>
                {R.hasReviewTiles && (
                  <div style={s('display:grid;grid-template-columns:'+R.reviewTileGrid+';gap:12px;margin-bottom:18px;')}>
                    {R.reviewTiles.map(t=>(
                      <div key={t.key} style={s('display:flex;flex-direction:column;gap:7px;padding:16px;background:var(--surface-subtle);border:1px solid var(--border);border-radius:10px;')}>
                        <Ico inner={ICON[t.icon]||I.maximize} size={18} stroke="var(--navy-700)"/>
                        <span style={s('font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--text-strong);line-height:1.2;')}>{t.value}</span>
                        <span style={s('font-size:12px;color:var(--text-muted);')}>{t.label}</span>
                      </div>
                    ))}
                  </div>
                )}
                {R.hasReviewRows && (
                  <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:10px;')}>
                    {R.reviewRows.map(r=>(
                      <div key={r.key} style={s('display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:8px;border:1px solid var(--border);')}>
                        <span style={s('font-size:13px;color:var(--text-muted);flex:none;')}>{r.label}</span>
                        <span style={s('flex:1;height:1px;background:var(--border);')}></span>
                        <span style={s('font-size:13.5px;font-weight:600;color:var(--text-strong);text-align:right;')}>{r.value}</span>
                      </div>
                    ))}
                  </div>
                )}
                {R.noDetails && <p style={s('margin:0;font-size:13.5px;color:var(--text-muted);')}>Add commercial details and they'll appear here.</p>}
              </div>

              {/* About */}
              <div style={s(CARD)}>
                {this.sectionTitle(I.fileCheck,'About this property',R)}
                {R.hasDesc && <p style={s('margin:0;font-size:15px;line-height:1.7;color:var(--text-body);max-width:70ch;')}>{R.descForReview}</p>}
                {R.noDesc && <p style={s('margin:0;font-size:14px;color:var(--text-muted);font-style:italic;')}>No description yet. Add one so buyers and tenants understand what the space offers.</p>}
              </div>

              {/* Location & essentials */}
              <div style={s(CARD)}>
                {this.sectionTitle(I.pin,'Location & access',R)}
                <div style={s('position:relative;height:200px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background-color:#E8EBE6;background-image:linear-gradient(rgba(27,42,69,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,69,0.06) 1px,transparent 1px);background-size:26px 26px;margin-bottom:10px;')}>
                  <div style={s('position:absolute;top:40%;left:0;right:0;height:13px;background:rgba(255,255,255,0.6);transform:rotate(-4deg);')}></div>
                  <div style={s('position:absolute;top:0;bottom:0;left:56%;width:10px;background:rgba(255,255,255,0.6);transform:rotate(3deg);')}></div>
                  {R.pinned && <div style={s('position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);')}><Ico inner={I.pinFill} fill="var(--copper-500)" stroke="#fff" sw={1.5} size={32}/></div>}
                </div>
                <div style={s('display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);margin-bottom:18px;')}><Ico inner={I.pin} stroke="var(--grey-400)" size={14}/>{R.mapPinnedText}</div>
                {R.reviewHasNearby && (
                  <React.Fragment>
                    <h3 style={s('margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--text-strong);')}><Ico inner={I.route} stroke="var(--navy-700)" size={16}/>Nearby places</h3>
                    <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:0 28px;')}>
                      {R.reviewNearby.map(n=>(
                        <div key={n.key} style={s('display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);')}>
                          <Ico inner={I.pin} stroke="var(--grey-400)" size={14}/>
                          <span style={s('font-size:13.5px;color:var(--text-body);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;')}>{n.name}</span>
                          {n.manual && <span style={s('font-size:9px;font-weight:700;text-transform:uppercase;color:var(--ochre-600);background:var(--ochre-50);padding:1px 5px;border-radius:4px;flex:none;')}>Added by broker</span>}
                          <span style={s('font-family:var(--font-mono);font-size:12px;color:var(--text-muted);flex:none;')}>{n.meta}</span>
                        </div>
                      ))}
                    </div>
                    <p style={s('margin:12px 0 0;font-size:11.5px;color:var(--text-muted);')}>Derived from the map. Manually added places are shown as added by broker, not platform-verified.</p>
                  </React.Fragment>
                )}
                {R.reviewNoNearby && <p style={s('margin:0;font-size:13px;color:var(--text-muted);')}>Pin the location to show nearby transport, roads and footfall.</p>}
              </div>

              {/* What's on this listing */}
              <div style={s(CARD)}>
                <h2 style={s('margin:0 0 4px;display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;color:var(--text-strong);')}><Ico inner={I.shield} stroke="var(--navy-700)" size={18}/>What's on this listing</h2>
                <p style={s('margin:0 0 18px;font-size:13px;color:var(--text-muted);')}>What you've added so far. ReTrends doesn't verify ownership, approvals or documents — buyers see only these honest signals.</p>
                <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin-bottom:16px;')}>
                  {R.trustChecks.map(c=>(
                    <div key={c.key} style={s('display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--text-body);')}>
                      {c.ok && <Ico inner={I.check} stroke="var(--positive)" sw={2.4} size={16} style={{marginTop:'1px'}}/>}
                      {c.pending && <Ico inner={I.alert} stroke="var(--caution)" size={16} style={{marginTop:'1px'}}/>}
                      {c.label}
                    </div>
                  ))}
                </div>
                <div style={s('display:flex;gap:18px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);')}>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.calendar} size={13}/>Last updated just now</span>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.users} size={13}/>Listed by verified broker</span>
                </div>
              </div>
            </div>

            {/* Right rail */}
            <div style={s('position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;')}>
              <div style={s('font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;')}>Editor view · only you see this</div>
              {R.showStrength && (
                <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);')}>
                  <div style={s('display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;')}><span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Listing strength</span><span style={s('font-size:13px;font-weight:700;font-family:var(--font-mono);color:'+R.strengthColor+';')}>{R.strengthLabel}</span></div>
                  <div style={s('height:7px;border-radius:99px;background:var(--grey-200);overflow:hidden;')}><div style={s('height:100%;width:'+R.strengthWidth+';background:'+R.strengthColor+';border-radius:99px;transition:width .3s ease;')}></div></div>
                  <div style={s('margin-top:12px;display:flex;flex-direction:column;gap:8px;')}>{R.confirmChips.map(c=>(<div key={c.key} style={s('display:flex;align-items:center;gap:8px;')}><span style={s(c.dot)}>{c.check}</span><span style={s('font-size:12.5px;color:'+c.textColor+';')}>{c.label}</span></div>))}</div>
                </div>
              )}
              <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);')}>
                <span style={s('display:block;font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:12px;')}>Before you submit</span>
                {R.reviewMissingNone && <div style={s('display:flex;align-items:center;gap:9px;font-size:13px;color:var(--trust-verified-fg);')}><span style={s('width:18px;height:18px;border-radius:50%;background:var(--evergreen-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;')}>✓</span>Everything useful is filled in.</div>}
                {R.reviewHasMissing && (
                  <div style={s('display:flex;flex-direction:column;gap:10px;')}>
                    {R.reviewMissing.map((m,i)=>(<div key={i} style={s('display:flex;align-items:center;gap:9px;')}><span style={s('width:16px;height:16px;border-radius:50%;background:var(--ochre-50);color:var(--ochre-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.warn} stroke="currentColor" sw={2.6} size={11}/></span><span style={s('font-size:13px;color:var(--text-body);')}>{m}</span></div>))}
                    <button type="button" onClick={R.backToEdit} style={s('margin-top:4px;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--navy-800);background:transparent;border:none;cursor:pointer;padding:0;')}>Go back and complete →</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </React.Fragment>
      )}

      {R.published && (
        <div style={s('max-width:560px;margin:30px auto;text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:44px 36px;box-shadow:var(--shadow-md);')}>
          <div style={s('width:56px;height:56px;border-radius:50%;background:var(--trust-verified-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;')}><Ico inner={I.check} stroke="var(--evergreen-600)" sw={2.4} size={28}/></div>
          <h2 style={s('font-family:var(--font-serif);font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 8px;')}>Submitted for review</h2>
          <p style={s('margin:0 0 22px;font-size:14.5px;color:var(--text-muted);line-height:1.55;')}>Your commercial listing has been submitted and is pending admin approval. We'll let you know once it's approved and live. You can keep editing it any time from your dashboard.</p>
          <div style={s('display:flex;gap:10px;justify-content:center;')}>
            <Button variant="primary">View listing</Button>
            <Button variant="outline" onClick={R.backToEdit}>Back to editing</Button>
          </div>
        </div>
      )}
    </React.Fragment>
  ); }

  /* ---------------- footer ---------------- */
  footer(R){ return (
    <div style={s('position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--paper);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(14,22,38,0.05);display:flex;align-items:center;z-index:15;')}>
      <div style={s('max-width:1180px;margin:0 auto;width:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;')}>
        <span style={s('font-size:13px;color:var(--text-muted);')}>{R.footerStatus}</span>
        <div>
          {R.editMode && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost">Save draft</Button>
              <Button variant="primary" onClick={R.goReview}>Review &amp; submit</Button>
            </div>
          )}
          {R.reviewNotPublished && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost" onClick={R.backToEdit}>Back to editing</Button>
              <Button variant="outline">Save draft</Button>
              <Button variant="accent" onClick={R.publish}>Submit for review</Button>
            </div>
          )}
          {R.published && <Button variant="primary" onClick={R.backToEdit}>Back to dashboard</Button>}
        </div>
      </div>
    </div>
  ); }

  /* ---------------- map picker modal ---------------- */
  picker(R){ if(!R.pickerOpen) return null; return (
    <div style={s('position:fixed;inset:0;z-index:60;background:rgba(14,22,38,0.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;')}>
      <div style={s('background:var(--paper);border-radius:18px;box-shadow:var(--shadow-xl);width:100%;max-width:640px;overflow:hidden;')}>
        <div style={s('padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;')}>
          <div>
            <h3 style={s('margin:0 0 3px;font-size:16px;font-weight:700;color:var(--text-strong);')}>Pin the exact location</h3>
            <p style={s('margin:0;font-size:12.5px;color:var(--text-muted);')}>Drag the pin to the exact property. Centred near {R.resPublic}.</p>
          </div>
          <button type="button" onClick={R.cancelPicker} style={s('width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--paper);color:var(--text-muted);font-size:16px;line-height:1;cursor:pointer;flex:none;')}>×</button>
        </div>
        <div onMouseDown={R.onMapDown} onMouseMove={R.onMapMove} onMouseUp={R.onMapUp} onMouseLeave={R.onMapUp} style={s('position:relative;height:340px;cursor:grab;user-select:none;background-color:#E8EBE6;background-image:linear-gradient(rgba(27,42,69,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,69,0.06) 1px,transparent 1px);background-size:30px 30px;')}>
          <div style={s('position:absolute;top:44%;left:0;right:0;height:16px;background:rgba(255,255,255,0.65);transform:rotate(-3deg);pointer-events:none;')}></div>
          <div style={s('position:absolute;top:0;bottom:0;left:60%;width:13px;background:rgba(255,255,255,0.65);transform:rotate(2deg);pointer-events:none;')}></div>
          <div style={s('position:absolute;top:0;bottom:0;left:28%;width:9px;background:rgba(255,255,255,0.5);pointer-events:none;')}></div>
          <div style={s('position:absolute;left:'+R.pinPos.x+'%;top:'+R.pinPos.y+'%;transform:translate(-50%,-100%);pointer-events:none;')}><Ico inner={I.pinFill} fill="var(--copper-500)" stroke="#fff" sw={1.5} size={40}/></div>
          <div style={s('position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.92);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--navy-800);box-shadow:var(--shadow-xs);display:inline-flex;align-items:center;gap:6px;pointer-events:none;')}><Ico inner={I.pin} size={13}/>Drag or tap to move the pin</div>
        </div>
        <div style={s('padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--border);flex-wrap:wrap;')}>
          <span style={s('font-size:11.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.shield} size={13} stroke="var(--grey-500)"/>Exact pin stays private — buyers see only {R.resPublic}.</span>
          <div style={s('display:flex;gap:10px;')}>
            <Button variant="ghost" onClick={R.cancelPicker}>Cancel</Button>
            <Button variant="accent" onClick={R.confirmPin}>Confirm pin</Button>
          </div>
        </div>
      </div>
    </div>
  ); }

  render(){
    const R = this.rv();
    return (
      <div style={s('min-height:100vh;background:var(--canvas-100);font-family:var(--font-sans);color:var(--text-body);')}>
        {this.header()}
        <div style={s('max-width:1180px;margin:0 auto;padding:34px 24px 130px;')}>
          <div style={s('margin-bottom:28px;')}>
            {R.reviewMode && <button type="button" onClick={R.backToEdit} style={s('display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--navy-800);background:transparent;border:none;cursor:pointer;padding:0;margin-bottom:14px;')}><Ico inner={I.chevLeft} size={16}/>Back to editing</button>}
            <div style={s('font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--copper-500);font-weight:700;margin-bottom:8px;')}>Commercial listing</div>
            <h1 style={s('font-family:var(--font-serif);font-size:34px;font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 8px;')}>{R.pageTitle}</h1>
            <p style={s('margin:0;font-size:15px;color:var(--text-muted);max-width:620px;line-height:1.5;')}>{R.pageSub}</p>
          </div>
          {R.editMode && (
            <div className="cl-edit-grid" style={s('display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:28px;align-items:start;')}>
              {this.formCol(R)}
              {this.editRail(R)}
            </div>
          )}
          {R.reviewMode && this.reviewView(R)}
        </div>
        {this.footer(R)}
        {this.picker(R)}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<CreateCommercialListing />);
</script>
</body>
</html>
