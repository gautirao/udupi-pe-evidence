                        <span style={s('font-size:13.5px;font-weight:600;color:var(--text-strong);text-align:right;')}>{r.value}</span>
                      </div>

                {R.noDetails && <p style={s('margin:0;font-size:13.5px;color:var(--text-muted);')}>Add commercial details and they'll appear here.</p>}

              {/* About */}
              <div style={s(CARD)}>

              {/* Location & essentials */}
              <div style={s(CARD)}>
                {this.sectionTitle(I.pin,'Location & access',R)}

                  <React.Fragment>

                      {c.label}
                    </div>
                  ))}
                </div>
                <div style={s('display:flex;gap:18px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);')}>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.calendar} size={13}/>Last updated just now</span>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.users} size={13}/>Listed by verified broker</span>
                </div>
              </div>
            </div>

            {/* Right rail */}
            <div style={s('position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;')}>
              <div style={s('font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;')}>Editor view · only you see this</div>
              {R.showStrength && (

                  <div style={s('margin-top:12px;display:flex;flex-direction:column;gap:8px;')}>{R.confirmChips.map(c=>(<div key={c.key} style={s('display:flex;align-items:center;gap:8px;')}><span style={s(c.dot)}>{c.check}</span><span style={s('font-size:12.5px;color:'+c.textColor+';')}>{c.label}</span></div>))}</div>

              <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);')}>

                {R.reviewHasMissing && (
                  <div style={s('display:flex;flex-direction:column;gap:10px;')}>
                    {R.reviewMissing.map((m,i)=>(<div key={i} style={s('display:flex;align-items:center;gap:9px;')}><span style={s('width:16px;height:16px;border-radius:50%;background:var(--ochre-50);color:var(--ochre-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.warn} stroke="currentColor" sw={2.6} size={11}/></span><span style={s('font-size:13px;color:var(--text-body);')}>{m}</span></div>))}
                    <button type="button" onClick={R.backToEdit} style={s('margin-top:4px;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--navy-800);background:transparent;border:none;cursor:pointer;padding:0;')}>Go back and complete →</button>

            </div>
          </div>
        </React.Fragment>
      )}

      {R.published && (
        <div style={s('max-width:560px;margin:30px auto;text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:44px 36px;box-shadow:var(--shadow-md);')}>
          <div style={s('width:56px;height:56px;border-radius:50%;background:var(--trust-verified-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;')}><Ico inner={I.check} stroke="var(--evergreen-600)" sw={2.4} size={28}/></div>

          <p style={s('margin:0 0 22px;font-size:14.5px;color:var(--text-muted);line-height:1.55;')}>Your listing is now live for buyers and tenants to discover. You can keep editing it any time from your dashboard.</p>
          <div style={s('display:flex;gap:10px;justify-content:center;')}>
            <Button variant="primary">View listing</Button>
            <Button variant="outline" onClick={R.backToEdit}>Back to editing</Button>
          </div>
        </div>
      )}
    </React.Fragment>
  ); }

  /* ---------------- footer ---------------- */
  footer(R){ return (
    <div style={s('position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--paper);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(14,22,38,0.05);display:flex;align-items:center;z-index:15;')}>
      <div style={s('max-width:1180px;margin:0 auto;width:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;')}>
        <span style={s('font-size:13px;color:var(--text-muted);')}>{R.footerStatus}</span>
        <div>
          {R.editMode && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost">Save draft</Button>
              <Button variant="primary" onClick={R.goReview}>Review &amp; publish</Button>
            </div>
          )}
          {R.reviewNotPublished && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost" onClick={R.backToEdit}>Back to editing</Button>
              <Button variant="outline">Save draft</Button>
              <Button variant="accent" onClick={R.publish}>Publish listing</Button>
            </div>
          )}
          {R.published && <Button variant="primary" onClick={R.backToEdit}>Back to dashboard</Button>}
        </div>
      </div>
    </div>
  ); }

  render(){
    const R = this.rv();
    return (
      <div style={s('min-height:100vh;background:var(--canvas-100);font-family:var(--font-sans);color:var(--text-body);')}>
        {this.header()}
        <div style={s('max-width:1180px;margin:0 auto;padding:34px 24px 130px;')}>
          <div style={s('margin-bottom:28px;')}>
            {R.reviewMode && <button type="button" onClick={R.backToEdit} style={s('display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--navy-800);background:transparent;border:none;cursor:pointer;padding:0;margin-bottom:14px;')}><Ico inner={I.chevLeft} size={16}/>Back to editing</button>}
            <div style={s('font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--copper-500);font-weight:700;margin-bottom:8px;')}>Commercial listing</div>
            <h1 style={s('font-family:var(--font-serif);font-size:34px;font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 8px;')}>{R.pageTitle}</h1>
            <p style={s('margin:0;font-size:15px;color:var(--text-muted);max-width:620px;line-height:1.5;')}>{R.pageSub}</p>
          </div>
          {R.editMode && (
            <div style={s('display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:28px;align-items:start;')}>
              {this.formCol(R)}
              {this.editRail(R)}
            </div>
          )}
          {R.reviewMode && this.reviewView(R)}
        </div>
        {this.footer(R)}
      </div>
    );
  }
}

<script>
(async () => {
  if (!document.title || !document.title.trim()) document.title = "create-commercial-listing";
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    print-color-adjust: exact; -webkit-print-color-adjust: exact;\n    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
