<!-- @dsCard group="Broker" viewport="1280x1400" name="Broker prototype (wired)" subtitle="Navigable broker walkthrough — Dashboard ⇄ Listing Quality ⇄ Area Intelligence ⇄ Demand Gaps ⇄ My Listings ⇄ Add Listing, hash-routed with shared nav and filtered states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReTrends — Broker Prototype</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }

  /* shared grids used across the broker pages */
  .rt-kpi    { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .rt-cards4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .rt-cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }

  /* listing-quality layout */
  .rt-lq-health { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .rt-lq-grid   { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .rt-lq-panel  { position: sticky; top: 96px; }

  @media (max-width: 1080px) {
    .rt-kpi    { grid-template-columns: repeat(3, 1fr); }
    .rt-cards4 { grid-template-columns: repeat(2, 1fr); }
    .rt-cards3 { grid-template-columns: repeat(3, 1fr); }
    .rt-nav-links { display: none !important; }
  }
  @media (max-width: 1040px) {
    .rt-lq-grid  { grid-template-columns: 1fr; }
    .rt-lq-panel { position: static; }
  }
  @media (max-width: 760px) {
    .rt-kpi    { grid-template-columns: repeat(2, 1fr); }
    .rt-cards4 { grid-template-columns: 1fr; }
    .rt-cards3 { grid-template-columns: 1fr; }
    .rt-lq-health { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<!-- shared data + the four wired broker pages (each self-scoped via IIFE) -->
<script src="data.js"></script>
<script src="listing-quality-data.js"></script>
<script type="text/babel" src="BrokerDashboard.jsx"></script>
<script type="text/babel" src="ListingQuality.jsx"></script>
<script type="text/babel" src="AreaInsights.jsx"></script>
<script type="text/babel" src="DemandGaps.jsx"></script>

<script type="text/babel">
  const { Icon, Button } = window.ReTrendsDesignSystem_f37966;

  /* ---------------------------------------------------- hash routing --- */
  function parseHash() {
    let h = (location.hash || "").replace(/^#/, "");
    if (!h) h = "/broker/dashboard";
    const qi = h.indexOf("?");
    const path = (qi === -1 ? h : h.slice(0, qi)).replace(/\/+$/, "") || "/broker/dashboard";
    const query = {};
    if (qi !== -1) {
      h.slice(qi + 1).split("&").forEach((p) => {
        if (!p) return;
        const [k, v] = p.split("=");
        query[k] = decodeURIComponent(v || "");
      });
    }
    return { path, query, raw: h };
  }
  function go(href) { location.hash = "#" + href; }

  /* Intercept every conceptual-route link so the static mocks navigate the
     prototype instead of the browser. Out-of-scope public routes stay inert. */
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    const href = a.getAttribute("href");
    if (!href) return;
    if (href === "#") { e.preventDefault(); return; }
    if (href.charAt(0) === "/") {
      e.preventDefault();
      if (href === "/") { go("/broker/dashboard"); return; }
      if (href.indexOf("/trends") === 0 || href.indexOf("/signin") === 0) return; // public / out of scope
      go(href);
    }
  });

  /* ---------------------------------------------------- shared top nav -- */
  function NavItem({ icon, label, href, selected, chevron, inert }) {
    const [hover, setHover] = React.useState(false);
    return (
      <a
        href={inert ? "#" : href}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display: "inline-flex", alignItems: "center", gap: "7px",
          height: "38px", padding: selected ? "0 16px" : "0 12px",
          borderRadius: "var(--radius-full)", textDecoration: "none",
          fontSize: "14.5px", fontWeight: 600, whiteSpace: "nowrap",
          color: selected ? "#fff" : (inert ? "var(--text-muted)" : "var(--text-body)"),
          background: selected ? "var(--navy-800)" : (hover && !inert ? "var(--grey-100)" : "transparent"),
          cursor: inert ? "default" : "pointer",
          opacity: inert ? 0.7 : 1,
          transition: "background var(--dur-fast) var(--ease-standard)",
        }}
      >
        <Icon name={icon} size={17} color={selected ? "#fff" : "var(--text-muted)"} />
        {label}
        {chevron && <Icon name="chevron-down" size={15} color={selected ? "#fff" : "var(--text-muted)"} />}
      </a>
    );
  }

  function TopNav({ path }) {
    const addActive = path.indexOf("/broker/listings/new") === 0;
    return (
      <header style={{ position: "sticky", top: 0, zIndex: 60, background: "var(--paper)", borderBottom: "1px solid var(--border)" }}>
        <div style={{ maxWidth: "1280px", margin: "0 auto", padding: "0 24px", height: "76px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "20px" }}>
          <a href="/broker/dashboard" style={{ display: "flex", alignItems: "center", gap: "12px", textDecoration: "none", flex: "none" }}>
            <span style={{ width: "42px", height: "42px", borderRadius: "11px", background: "var(--navy-800)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="map-pin" size={22} color="#fff" />
            </span>
            <span style={{ display: "flex", flexDirection: "column", lineHeight: 1.1 }}>
              <span style={{ fontSize: "19px", fontWeight: 700, letterSpacing: "-0.02em" }}>
                <span style={{ color: "var(--copper-500)" }}>Re</span><span style={{ color: "var(--navy-800)" }}>Trends</span>
              </span>
              <span style={{ fontSize: "11px", fontWeight: 500, color: "var(--text-muted)" }}>Real estate trends</span>
            </span>
          </a>
          <nav className="rt-nav-links" style={{ display: "flex", alignItems: "center", gap: "4px" }}>
            <NavItem icon="map-pin" label="Discover" inert />
            <NavItem icon="map-pin" label="Areas" chevron inert />
            <NavItem icon="building" label="Broker" href="/broker/dashboard" selected chevron />
            <NavItem icon="heart" label="Saved" inert />
            <NavItem icon="plus" label="Add listing" href="/broker/listings/new" selected={addActive} />
          </nav>
          <a href="/signin" style={{ textDecoration: "none", flex: "none" }}>
            <span style={{
              display: "inline-flex", alignItems: "center", height: "40px", padding: "0 20px",
              borderRadius: "var(--radius-md)", border: "1px solid var(--border-strong)",
              fontSize: "14px", fontWeight: 600, color: "var(--text-strong)", background: "var(--paper)",
            }}>Sign in</span>
          </a>
        </div>
      </header>
    );
  }

  /* ------------------------------------------------ placeholder header -- */
  function PlaceholderHeader({ crumbs, title, sub, action }) {
    return (
      <section style={{ background: "var(--navy-800)" }}>
        <div style={{ maxWidth: "1200px", margin: "0 auto", padding: "16px 24px 30px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "14px" }}>
            {crumbs.map((c, i) => {
              const last = i === crumbs.length - 1;
              const txt = <span style={{ fontSize: "12px", fontWeight: last ? 600 : 500, color: last ? "#fff" : "rgba(255,255,255,0.55)" }}>{c.label}</span>;
              return (
                <React.Fragment key={i}>
                  {c.href && !last ? <a href={c.href} style={{ textDecoration: "none" }}>{txt}</a> : txt}
                  {!last && <Icon name="chevron-right" size={12} color="rgba(255,255,255,0.35)" />}
                </React.Fragment>
              );
            })}
          </div>
          <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: "20px", flexWrap: "wrap" }}>
            <div>
              <h1 style={{ margin: "0 0 6px", fontFamily: "var(--font-serif)", fontSize: "28px", fontWeight: 600, letterSpacing: "-0.01em", color: "#fff", lineHeight: 1.12 }}>{title}</h1>
              <p style={{ margin: 0, fontSize: "15px", color: "rgba(255,255,255,0.82)", maxWidth: "600px", lineHeight: 1.45 }}>{sub}</p>
            </div>
            {action}
          </div>
        </div>
      </section>
    );
  }

  function PlaceholderTag() {
    return (
      <span style={{ display: "inline-flex", alignItems: "center", gap: "6px", fontFamily: "var(--font-mono)", fontSize: "10.5px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-muted)", background: "var(--surface-subtle)", border: "1px dashed var(--border-strong)", borderRadius: "var(--radius-full)", padding: "4px 11px" }}>
        <Icon name="layers" size={12} color="var(--grey-400)" />Placeholder screen
      </span>
    );
  }

  /* --------------------------------------------------- My Listings ------ */
  function ListingGroup({ icon, tone, count, title, desc, active }) {
    const [hover, setHover] = React.useState(false);
    return (
      <div style={{
        display: "flex", flexDirection: "column",
        background: "var(--surface-card)",
        border: active ? "1.5px solid var(--accent)" : "1px solid var(--border)",
        borderRadius: "var(--radius-lg)", padding: "20px",
        boxShadow: active ? "0 0 0 4px var(--accent-tint), var(--shadow-md)" : (hover ? "var(--shadow-md)" : "var(--shadow-xs)"),
        transition: "box-shadow var(--dur-normal) var(--ease-standard)",
      }}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ width: "40px", height: "40px", borderRadius: "var(--radius-md)", background: tone.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name={icon} size={20} color={tone.fg} />
          </div>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: "30px", fontWeight: 600, color: "var(--text-strong)", lineHeight: 1 }}>{count}</span>
        </div>
        <div style={{ fontSize: "16px", fontWeight: 700, color: "var(--text-strong)", marginTop: "16px" }}>{title}</div>
        <div style={{ fontSize: "13px", color: "var(--text-muted)", lineHeight: 1.5, marginTop: "5px", flex: 1 }}>{desc}</div>
        {active && (
          <span style={{ display: "inline-flex", alignItems: "center", gap: "6px", marginTop: "14px", fontSize: "11px", fontWeight: 700, letterSpacing: "var(--tracking-caps)", textTransform: "uppercase", color: "var(--accent)" }}>
            <Icon name="arrow-right" size={13} color="var(--accent)" />Filtered from dashboard
          </span>
        )}
      </div>
    );
  }

  function MyListings({ initialFilter }) {
    const incomplete = initialFilter === "incomplete";
    return (
      <div style={{ background: "var(--background)", minHeight: "100vh", paddingBottom: "48px" }}>
        <PlaceholderHeader
          crumbs={[{ label: "Broker dashboard", href: "/broker/dashboard" }, { label: "My listings" }]}
          title="My listings"
          sub="Manage active, draft and incomplete listings."
          action={<a href="/broker/listings/new" style={{ textDecoration: "none" }}><Button variant="accent"><Icon name="plus" size={16} />Add listing</Button></a>}
        />
        <div style={{ maxWidth: "1200px", margin: "0 auto", padding: "28px 24px 0" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px", flexWrap: "wrap", marginBottom: "18px" }}>
            <PlaceholderTag />
            <span style={{ fontSize: "12.5px", color: "var(--text-muted)" }}>Full listing-management table is not designed yet — this is a routing placeholder.</span>
          </div>
          <div className="rt-cards3">
            <ListingGroup icon="building" tone={{ bg: "var(--evergreen-50)", fg: "var(--positive)" }} count="31" title="Active listings" desc="Live and visible to buyers on ReTrends." />
            <ListingGroup icon="file-check" tone={{ bg: "var(--surface-navy-tint)", fg: "var(--navy-700)" }} count="7" title="Draft listings" desc="Saved but not yet published." />
            <ListingGroup icon="alert-triangle" tone={{ bg: "var(--ochre-50)", fg: "var(--caution)" }} count="5" title="Incomplete listings" desc="Need photos or location before buyers can see them." active={incomplete} />
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "16px", flexWrap: "wrap", marginTop: "28px", padding: "18px 22px", background: "var(--surface-subtle)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)" }}>
            <span style={{ fontSize: "13.5px", color: "var(--text-body)", lineHeight: 1.5 }}>Want to improve weak listings instead? Open the fix-first worklist.</span>
            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
              <a href="/broker/listing-quality" style={{ textDecoration: "none" }}><Button variant="outline" size="sm"><Icon name="file-check" size={15} />Open listing quality</Button></a>
              <a href="/broker/listings/new" style={{ textDecoration: "none" }}><Button variant="accent" size="sm"><Icon name="plus" size={15} />Add new listing</Button></a>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* --------------------------------------------------- Add Listing ------ */
  const TYPES = ["Plot", "Agricultural land", "Apartment", "Villa", "Commercial"];
  function AddListing({ need, area }) {
    const NEED_LABEL = { "agri-land": "Agricultural land" };
    const ctx = need || area;
    const areaName = area ? area.charAt(0).toUpperCase() + area.slice(1) : null;
    return (
      <div style={{ background: "var(--background)", minHeight: "100vh", paddingBottom: "48px" }}>
        <PlaceholderHeader
          crumbs={[{ label: "Broker dashboard", href: "/broker/dashboard" }, { label: "My listings", href: "/broker/listings" }, { label: "Add listing" }]}
          title="Add a new listing"
          sub="Start a new listing. The full creation flow is not designed yet."
        />
        <div style={{ maxWidth: "760px", margin: "0 auto", padding: "28px 24px 0" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px", flexWrap: "wrap", marginBottom: "18px" }}>
            <PlaceholderTag />
          </div>

          {ctx && (
            <div style={{ display: "flex", alignItems: "flex-start", gap: "12px", background: "var(--accent-tint)", border: "1px solid var(--copper-400)", borderRadius: "var(--radius-lg)", padding: "16px 18px", marginBottom: "20px" }}>
              <Icon name="trending-up" size={18} color="var(--accent)" style={{ flex: "none", marginTop: "1px" }} />
              <div>
                <div style={{ fontSize: "11px", fontWeight: 700, letterSpacing: "var(--tracking-caps)", textTransform: "uppercase", color: "var(--accent-hover)", marginBottom: "3px" }}>Starting from a demand gap</div>
                <p style={{ margin: 0, fontSize: "13.5px", color: "var(--text-body)", lineHeight: 1.5 }}>
                  Pre-filling {need ? <strong>{NEED_LABEL[need] || need}</strong> : "a new listing"}{areaName ? <> in <strong>{areaName}</strong></> : null}, based on the gap you came from.
                </p>
              </div>
            </div>
          )}

          <div style={{ background: "var(--surface-card)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", padding: "24px" }}>
            <div style={{ fontSize: "11px", fontWeight: 700, letterSpacing: "var(--tracking-caps)", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: "10px" }}>Property type</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "24px" }}>
              {TYPES.map((t) => {
                const on = need === "agri-land" && t === "Agricultural land";
                return (
                  <span key={t} style={{
                    fontSize: "13px", fontWeight: 600, padding: "8px 14px", borderRadius: "var(--radius-full)",
                    border: on ? "1px solid var(--navy-800)" : "1px solid var(--border-strong)",
                    background: on ? "var(--navy-800)" : "var(--surface-card)",
                    color: on ? "#fff" : "var(--text-body)",
                  }}>{t}</span>
                );
              })}
            </div>
            {[
              ["Location", areaName ? areaName + ", Udupi" : "Add area, city and exact pin"],
              ["Price", "Add asking price"],
              ["Photos", "Upload at least 4 photos"],
              ["Key details", "Size, facing, road access, water source"],
            ].map(([label, hint], i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "16px" }}>
                <span style={{ fontSize: "12.5px", fontWeight: 600, color: "var(--text-strong)" }}>{label}</span>
                <div style={{ display: "flex", alignItems: "center", height: "44px", padding: "0 14px", borderRadius: "var(--radius-md)", border: "1px dashed var(--border-strong)", background: "var(--surface-subtle)", fontSize: "13px", color: "var(--text-muted)" }}>{hint}</div>
              </div>
            ))}
            <div style={{ display: "flex", gap: "10px", marginTop: "24px", flexWrap: "wrap" }}>
              <Button variant="accent" size="lg"><Icon name="check" size={16} />Publish listing</Button>
              <a href="/broker/listings" style={{ textDecoration: "none" }}><Button variant="outline" size="lg">Save as draft</Button></a>
            </div>
            <p style={{ margin: "16px 0 0", fontSize: "12px", color: "var(--text-muted)" }}>Controls are non-functional in this prototype.</p>
          </div>
        </div>
      </div>
    );
  }

  /* ------------------------------------------------- area screen wrap --- */
  function AreaScreen({ cityKey, areaKey }) {
    const onCity = (ck) => {
      const list = window.RT_AREAS[ck] || [["malpe"]];
      go("/broker/areas/" + ck + "/" + list[0][0]);
    };
    const onArea = (ak) => go("/broker/areas/" + cityKey + "/" + ak);
    return <window.RTAreaInsights cityKey={cityKey} areaKey={areaKey} onCity={onCity} onArea={onArea} />;
  }

  /* ------------------------------------------------------- app router --- */
  function App() {
    const [route, setRoute] = React.useState(parseHash());
    React.useEffect(() => {
      const on = () => setRoute(parseHash());
      window.addEventListener("hashchange", on);
      return () => window.removeEventListener("hashchange", on);
    }, []);
    React.useEffect(() => { window.scrollTo(0, 0); }, [route.raw]);

    const { path, query, raw } = route;
    let screen;
    if (path === "/broker/listing-quality") {
      screen = <window.RTListingQuality key={raw} initialFilter={query.filter} initialArea={query.area} />;
    } else if (path.indexOf("/broker/areas/") === 0) {
      const parts = path.split("/");
      screen = <AreaScreen key={raw} cityKey={parts[3] || "udupi"} areaKey={parts[4] || "malpe"} />;
    } else if (path === "/broker/demand-gaps") {
      screen = <window.RTDemandGaps key={raw} highlightId={query.gap} />;
    } else if (path === "/broker/listings/new") {
      screen = <AddListing key={raw} need={query.need} area={query.area} />;
    } else if (path === "/broker/listings") {
      screen = <MyListings key={raw} initialFilter={query.filter} />;
    } else {
      screen = <window.RTBrokerDashboard key={raw} />;
    }
    return (
      <div>
        <TopNav path={path} />
        {screen}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
