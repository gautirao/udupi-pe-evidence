<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }
  /* Plum — the school-journey accent only (not in the base system) */
  :root {
    --plum-600: #5E5286; --plum-500: #7E6BA8; --plum-100: #DED7EC; --plum-tint: #F1EDF7;
    --evergreen-100: #CFE6D9; --evergreen-700: #1F694A;
  }
  .upt-pin { background: transparent !important; border: none !important; }
  .leaflet-container { font-family: var(--font-sans); background: #EDEBE6; }
  .leaflet-bar a { color: var(--navy-800); }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,0.7) !important; }
  .upt-scroll::-webkit-scrollbar { width: 10px; }
  .upt-scroll::-webkit-scrollbar-thumb { background: var(--stone-400); border-radius: 999px; border: 3px solid var(--background); }
  /* Cluster affordance */
  .dp-cluster:hover .dp-cluster-disc { transform: scale(1.08); }
  /* PR-B — guided-picker affordances */
  .dp-nav { cursor: pointer; }
  .dp-nav:hover .dp-navcore { transform: scale(1.08) !important; }
  .dp-hint-cap { display: none; }
  body[data-dp-hint] .dp-hint-cap { display: inline-block; }
  @keyframes dpPulse {
    0% { box-shadow: 0 0 0 0 rgba(30,42,68,0.35); }
    70% { box-shadow: 0 0 0 12px rgba(30,42,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(30,42,68,0); }
  }
  body[data-dp-hint] .dp-pulse { animation: dpPulse 2.4s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { body[data-dp-hint] .dp-pulse { animation: none; } }
  /* Region-overview guidance (issue #1808) — one-shot ring on the panel journey cards
     after a map/panel region pick. Copper matches the map guidance card's accent. */
  @keyframes dpRing {
    0%   { box-shadow: 0 0 0 0 rgba(176,92,58,0.0), 0 0 0 0 rgba(176,92,58,0.40); }
    30%  { box-shadow: 0 0 0 3px rgba(176,92,58,0.55), 0 0 0 11px rgba(176,92,58,0.13); }
    100% { box-shadow: 0 0 0 0 rgba(176,92,58,0.0), 0 0 0 0 rgba(176,92,58,0.0); }
  }
  .dp-attn-target { transition: box-shadow 200ms cubic-bezier(0.4,0,0.2,1); }
  .dp-attn-on { animation: dpRing 1.5s cubic-bezier(0.4,0,0.2,1) 2; }
  .dp-guide-arr { display: inline-block; animation: dpNudge 1.4s ease-in-out infinite; }
  .dp-guide-arr-down { animation-name: dpNudgeY; }
  @keyframes dpNudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  @keyframes dpNudgeY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) {
    .dp-attn-on { animation: none; box-shadow: 0 0 0 2px rgba(176,92,58,0.5); }
    .dp-guide-arr, .dp-guide-arr-down { animation: none; }
  }
  .dp-acluster:hover .dp-acluster-chip { transform: scale(1.06); }
  /* Wide fixed-width marker boxes must not eat map clicks — only the visible chip is interactive */
  .upt-pin .dp-nav, .upt-pin .dp-acluster { pointer-events: none; }
  .upt-pin .dp-navcore, .upt-pin .dp-acluster-chip { pointer-events: auto; }
  /* Listing-cluster action caption: only on the largest cluster (.on) or on hover */
  .dp-cluster .dp-cluster-cap { display: none; }
  .dp-cluster:hover .dp-cluster-cap, .dp-cluster .dp-cluster-cap.on { display: inline-block; }
  @media (max-width: 760px) { .dp-legend { display: none; } }
  /* Infographic popup — matches the card system */
  .leaflet-popup-content-wrapper { border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; width: 232px !important; }
  .leaflet-popup-tip { box-shadow: var(--shadow-md); }
  .leaflet-popup-close-button { color: #fff !important; top: 8px !important; right: 8px !important; z-index: 3; width: 22px; height: 22px; line-height: 20px !important; background: rgba(20,26,40,0.5); border-radius: var(--radius-full); }
  .dp-pop { font-family: var(--font-sans); }
  .dp-pop-img { position: relative; height: 118px; background-size: cover; background-position: center; background-color: var(--surface-muted); }
  .dp-pop-tier { position: absolute; top: 9px; left: 9px; padding: 3px 8px; border-radius: var(--radius-full); font-size: 10.5px; font-weight: 700; color: #fff; background: var(--navy-800); box-shadow: var(--shadow-sm); }
  .dp-tier-verified { background: var(--evergreen-600); }
  .dp-tier-trusted { background: var(--navy-800); }
  .dp-tier-listed { background: var(--grey-500); }
  .dp-pop-tag { position: absolute; bottom: 9px; left: 9px; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 700; color: #fff; background: var(--navy-900); }
  .dp-pop-tag-agri { background: rgba(31,105,74,0.94); font-family: var(--font-mono); }
  .dp-pop-body { padding: 12px 13px 13px; }
  .dp-pop-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .dp-pop-price { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--text-strong); }
  .dp-pop-type { font-size: 10.5px; font-weight: 700; color: var(--text-muted); padding: 2px 8px; border-radius: var(--radius-full); background: var(--surface-subtle); border: 1px solid var(--border); white-space: nowrap; }
  .dp-pop-title { margin: 7px 0 3px; font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--text-strong); }
  .dp-pop-loc { font-size: 11.5px; color: var(--text-muted); }
  .dp-pop-meta { margin-top: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .dp-pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); }
  .dp-pop-step { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .dp-pp { width: 24px; height: 24px; border-radius: var(--radius-full); border: 1px solid var(--border-strong); background: var(--paper); color: var(--text-strong); font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background var(--dur-fast), border-color var(--dur-fast); }
  .dp-pp:hover { background: var(--grey-50); border-color: var(--navy-800); }
  .dp-pp-show { border: none; background: var(--accent); color: #fff; font-family: var(--font-sans); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
  .dp-pp-show:hover { background: var(--accent-hover); }
  .dp-pop-agri .dp-pp-show { background: var(--evergreen-600); }
</style>
