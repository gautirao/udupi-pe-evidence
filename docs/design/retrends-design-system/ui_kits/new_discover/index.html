<style>
  html, body { margin: 0; height: 100%; background: var(--background); }

  /* directional nav markers — hover/focus reveal caption + emphasis (class-driven so panel↔map sync never recreates the icon) */
  .nd-nav { cursor: pointer; }

  .nd-cap { opacity: 0; transform: translateY(-3px); transition: opacity .16s ease, transform .16s ease; pointer-events: none; }
  .nd-nav:hover .nd-cap, .nd-nav.nd-nav-on .nd-cap { opacity: 1; transform: translateY(0); }
  .nd-cluster:hover .nd-cluster-disc { transform: scale(1.08); }
  .upt-pin:focus { outline: none; }

  .dp-pop-tier { position: absolute; top: 9px; left: 9px; padding: 3px 8px; border-radius: var(--radius-full); font-size: 10.5px; font-weight: 700; color: #fff; background: var(--navy-800); box-shadow: var(--shadow-sm); }
  .dp-tier-verified { background: var(--evergreen-600); }
  .dp-tier-trusted { background: var(--navy-800); }
  .dp-tier-listed { background: var(--grey-500); }
  .dp-pop-tag { position: absolute; bottom: 9px; left: 9px; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 700; color: #fff; background: var(--navy-900); }
  .dp-pop-tag-agri { background: rgba(31,105,74,0.94); font-family: var(--font-mono); }
  .dp-pop-body { padding: 12px 13px 13px; }
  .dp-pop-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .dp-pop-price { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--text-strong); }
  .dp-pop-type { font-size: 10.5px; font-weight: 700; color: var(--text-muted); padding: 2px 8px; border-radius: var(--radius-full); background: var(--surface-subtle); border: 1px solid var(--border); white-space: nowrap; }
  .dp-pop-title { margin: 7px 0 3px; font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--text-strong); }
  .dp-pop-loc { font-size: 11.5px; color: var(--text-muted); }
  .dp-pop-meta { margin-top: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .dp-pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); }
  .dp-pop-step { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .dp-pp { width: 24px; height: 24px; border-radius: var(--radius-full); border: 1px solid var(--border-strong); background: var(--paper); color: var(--text-strong); font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background var(--dur-fast), border-color var(--dur-fast); }
  .dp-pp:hover { background: var(--grey-50); border-color: var(--navy-800); }
  .dp-pp-show { border: none; background: var(--accent); color: #fff; font-family: var(--font-sans); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
  .dp-pp-show:hover { background: var(--accent-hover); }
  .dp-pop-agri .dp-pp-show { background: var(--evergreen-600); }
</style>
