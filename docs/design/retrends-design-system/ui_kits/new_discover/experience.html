  .nd-nav.am-leaf:hover .am-action, .nd-nav.am-leaf.nd-nav-on .am-action { filter: brightness(1.15); }
  .nd-nav.am-leaf:active .am-shell { transform: scale(0.97) !important; transition: transform .08s ease; }
  .nd-nav.am-leaf:focus-visible { outline: none; }
  .nd-nav.am-leaf.am-leaf-home:focus-visible .am-shell { box-shadow: 0 0 0 3px var(--navy-800), var(--shadow-lg) !important; }

  .nd-nav:focus-visible .nd-navcore { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lg) !important; transform: scale(1.05) !important; }

  .upt-scroll::-webkit-scrollbar { width: 10px; }

  /* Map info dock — ONE card for guidance · count · recenter.
     Desktop: bottom-left of the map, width min(288px, 50% − 92px) so it never meets the bottom-centre
     "Search this area" or the bottom-right zoom/attribution. Mobile: the first block INSIDE the bottom
     sheet (no extra floating layer; zoom lives top-right, Filters top-left). Rows toggle inside the card; the anchor never moves.
     The dock never repositions markers or alters the camera fit; labels wrap (max 2 lines), never truncating the node name.
     Recenter always targets the CURRENT node — never two. */
  .exp-recenter:hover { background: var(--surface-subtle) !important; }
  .exp-recenter:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @keyframes expFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .nd-cap, .leaflet-tile-pane { transition: none; } .upt-scroll { animation: none !important; } }

<!-- Container is #app, not #root, on purpose: the design-system compiler also bundles
     src/Experience.jsx into _ds_bundle.js and runs it before the data modules load. If
     that copy ever mounts, its getElementById("root") returns null and it bails
     harmlessly instead of claiming this container and clearing it on error. -->
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/ExpSchools.jsx?v=e89"></script>
<script type="text/babel" src="src/ExpAgri.jsx?v=e89"></script>
<script type="text/babel" src="src/ExpPanel.jsx?v=e89"></script>
<script type="text/babel" src="src/ExpMapFilters.jsx?v=e89"></script>
<script type="text/babel" src="src/Experience.jsx?v=e89"></script>
<!-- The mount lives HERE, not inside Experience.jsx: the design-system compiler also
     bundles src/*.jsx into _ds_bundle.js, which loads before the data modules, so a
     mount inside a bundled file runs once with its dependencies missing. A plain
     inline script is never bundled, and polling for the dependencies removes the
     script-ordering race that Babel's async src loading would otherwise create. -->
<script>
  (function () {
    var tries = 0;
    function attempt() {
      // Wait for window.ExperienceReady, NOT window.Experience: the design-system
      // bundle defines Experience (and ExpPanel/ExpMap/…) early, before the data
      // modules load, so those globals are not evidence that the app can render.
      // src/Experience.jsx sets ExperienceReady only when its dependencies are real.
      if (!window.ExperienceReady || !window.React || !window.ReactDOM) {
        if (++tries > 600) { console.error("Discover: Experience never became ready"); return; }
        return setTimeout(attempt, 25);
      }
      var el = document.getElementById("app");
      if (!el || el.__expRoot) return;
      el.__expRoot = ReactDOM.createRoot(el);
      el.__expRoot.render(React.createElement(window.ExperienceReady));
    }
    // Mount once the document has finished loading and one task has been yielded, so
    // layout has settled before Leaflet reads its container geometry. Deliberately a
    // timer, NOT requestAnimationFrame: rAF does not fire in an iframe that is not
    // painting, which would leave the artifact permanently blank.
    function start() { setTimeout(attempt, 0); }
    if (document.readyState === "complete") start();
    else window.addEventListener("load", start);
    // Belt and braces: if `load` never arrives (throttled or already dispatched
    // before this script parsed), poll anyway rather than never mounting.
    setTimeout(attempt, 400);
  })();
</script>
