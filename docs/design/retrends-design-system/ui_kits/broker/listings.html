<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Listings — ReTrends Broker</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }

  /* ---- Layout grid ---- */
  .listings-page {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto 1fr;
    min-height: 100vh;
  }

  /* ---- Header ---- */
  .listings-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px;
  }

  .listings-header-top {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
  }

  .listings-header-content h1 {
    font-size: var(--text-3xl);
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
    margin: 0 0 8px 0;
    color: var(--text-strong);
  }

  .listings-header-content p {
    font-size: var(--text-sm);
    color: var(--text-muted);
    margin: 0;
    line-height: var(--leading-normal);
  }

  .listings-header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 20px;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: var(--text-on-navy);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
    text-decoration: none;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 16px;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-body);
    border: 1px solid var(--border-strong);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-standard);
    text-decoration: none;
  }

  .btn-secondary:hover {
    background: var(--grey-50);
  }

  /* ---- Stats strip ---- */
  .stats-strip {
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }

  .stats-container {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    gap: 28px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    cursor: pointer;
    padding: 8px 0;
    transition: opacity var(--dur-fast) var(--ease-standard);
  }

  .stat-item:hover {
    opacity: 0.75;
  }

  .stat-label {
    font-size: var(--text-xs);
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: var(--tracking-caps);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-strong);
  }

  /* ---- Filters bar ---- */
  .filters-bar {
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: var(--header-h);
    z-index: 20;
  }

  .filters-container {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--input-bg);
    font-size: 14px;
    color: var(--text-strong);
    font-family: var(--font-sans);
  }

  .search-box::placeholder {
    color: var(--text-muted);
  }

  .search-box:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--ring-color);
  }

  .filter-select {
    height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--paper);
    font-size: 14px;
    color: var(--text-body);
    cursor: pointer;
    font-family: var(--font-sans);
    font-weight: 500;
    transition: all var(--dur-fast) var(--ease-standard);
  }

  .filter-select:hover {
    border-color: var(--border);
    background: var(--grey-50);
  }

  .filter-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--ring-color);
  }

  /* ---- Content area ---- */
  .listings-content {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    width: 100%;
  }

  .listings-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  /* ---- Listing card ---- */
  .listing-card {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 16px;
    padding: 16px;
    background: var(--surface-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    transition: all var(--dur-fast) var(--ease-standard);
  }

  .listing-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
  }

  .listing-thumbnail {
    width: 140px;
    height: 140px;
    border-radius: var(--radius-md);
    background: var(--surface-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-xs);
    color: var(--text-muted);
    text-align: center;
    padding: 12px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .listing-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .listing-thumbnail-placeholder {
    font-weight: 500;
    line-height: var(--leading-snug);
  }

  .listing-main {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .listing-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .listing-title {
    font-size: var(--text-lg);
    font-weight: 600;
    color: var(--text-strong);
    margin: 0;
    line-height: var(--leading-snug);
  }

  .listing-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-live {
    background: var(--positive-bg);
    color: var(--positive);
  }

  .badge-draft {
    background: var(--grey-100);
    color: var(--text-muted);
  }

  .badge-review {
    background: var(--secondary);
    color: var(--secondary-foreground);
  }

  .badge-archived {
    background: var(--grey-100);
    color: var(--grey-500);
  }

  .badge-quality-good {
    background: var(--positive-bg);
    color: var(--positive);
  }

  .badge-quality-needs {
    background: var(--caution-bg);
    color: var(--caution);
  }

  .badge-quality-incomplete {
    background: var(--brick-50);
    color: var(--brick-600);
  }

  .listing-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: var(--text-sm);
    color: var(--text-muted);
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .listing-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .listing-price {
    font-size: var(--text-lg);
    font-weight: 700;
    color: var(--text-strong);
  }

  .listing-quality-issue {
    font-size: var(--text-sm);
    color: var(--caution);
    font-weight: 500;
  }

  .listing-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-action {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-body);
    border: 1px solid var(--border-strong);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-standard);
    white-space: nowrap;
  }

  .btn-action:hover {
    background: var(--grey-50);
    border-color: var(--border);
  }

  .btn-action-primary {
    background: var(--primary);
    color: var(--text-on-navy);
    border-color: var(--primary);
  }

  .btn-action-primary:hover {
    background: var(--primary-hover);
  }

  /* ---- Enquiry indicator ---- */
  .enquiry-badge {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: 600;
    background: var(--navy-100);
    color: var(--navy-800);
  }

  /* ---- Empty state ---- */
  .empty-state {
    grid-column: 1;
    padding: 80px 24px;
    text-align: center;
  }

  .empty-state-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: var(--surface-muted);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .empty-state h2 {
    font-size: var(--text-2xl);
    font-weight: 700;
    margin: 0 0 8px 0;
    color: var(--text-strong);
  }

  .empty-state p {
    font-size: var(--text-base);
    color: var(--text-muted);
    margin: 0 0 24px 0;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Responsive ---- */
  @media (max-width: 900px) {
    .listing-card {
      grid-template-columns: 100px 1fr;
      gap: 12px;
    }

    .listing-thumbnail {
      width: 100px;
      height: 100px;
    }

    .filters-container {
      gap: 8px;
    }

    .filter-select {
      font-size: 13px;
      padding: 0 10px;
    }
  }

  @media (max-width: 640px) {
    .listings-header-top {
      flex-direction: column;
      align-items: stretch;
    }

    .listings-header-actions {
      flex-direction: column;
    }

    .btn-primary, .btn-secondary {
      width: 100%;
      justify-content: center;
    }

    .listings-content {
      padding: 16px;
    }

    .listing-card {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .listing-thumbnail {
      width: 100%;
      height: 200px;
    }

    .filters-container {
      flex-direction: column;
    }

    .search-box, .filter-select {
      width: 100%;
    }

    .stats-container {
      flex-direction: column;
      gap: 16px;
    }

    .listing-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .listing-badges {
      align-self: stretch;
    }

    .listing-bottom {
      flex-direction: column;
      align-items: stretch;
    }

    .listing-actions {
      justify-content: flex-start;
    }

    .btn-action {
      flex: 1;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
  // ---- Mock data ----
  const mockListings = [
    {
      id: 1,
      title: "Luxury 3BHK with Sunlit Courtyard",
      area: "Balmatta, Udupi",
      price: "₹78,50,000",
      type: "Apartment",
      saleRent: "Sale",
      status: "live",
      quality: "good",
      thumbnail: null,
      lastUpdated: "2 days ago",
      enquiries: 3,
      viewingRequests: 1,
      topIssue: null,
    },
    {
      id: 2,
      title: "Cozy 2BHK Near Beach Road",
      area: "Manipal Road, Udupi",
      price: "₹42,00,000",
      type: "Apartment",
      saleRent: "Sale",
      status: "live",
      quality: "needs-work",
      thumbnail: null,
      lastUpdated: "5 days ago",
      enquiries: 0,
      viewingRequests: 0,
      topIssue: "Add 3 more photos",
    },
    {
      id: 3,
      title: "Independent House with Garden",
      area: "Adarsh Nagar, Udupi",
      price: "₹1,05,00,000",
      type: "House",
      saleRent: "Sale",
      status: "review",
      quality: "incomplete",
      thumbnail: null,
      lastUpdated: "1 day ago",
      enquiries: 0,
      viewingRequests: 0,
      topIssue: "Missing property age & transaction details",
    },
    {
      id: 4,
      title: "1BHK Flat in Modern Complex",
      area: "Indiranagar, Udupi",
      price: "₹28,50,000",
      type: "Apartment",
      saleRent: "Sale",
      status: "draft",
      quality: null,
      thumbnail: null,
      lastUpdated: "7 days ago",
      enquiries: 0,
      viewingRequests: 0,
      topIssue: null,
    },
    {
      id: 5,
      title: "Premium 4BHK Villa with Pool",
      area: "Ashok Nagar, Udupi",
      price: "₹1,25,00,000",
      type: "Villa",
      saleRent: "Sale",
      status: "live",
      quality: "good",
      thumbnail: null,
      lastUpdated: "Today",
      enquiries: 5,
      viewingRequests: 2,
      topIssue: null,
    },
    {
      id: 6,
      title: "Cozy Studio for Rent",
      area: "City Center, Udupi",
      price: "₹15,000/month",
      type: "Apartment",
      saleRent: "Rent",
      status: "live",
      quality: "needs-work",
      thumbnail: null,
      lastUpdated: "3 days ago",
      enquiries: 2,
      viewingRequests: 0,
      topIssue: "Improve property description",
    },
    {
      id: 7,
      title: "Spacious Commercial Space",
      area: "Balmatta, Udupi",
      price: "₹12,00,000",
      type: "Commercial",
      saleRent: "Sale",
      status: "archived",
      quality: "good",
      thumbnail: null,
      lastUpdated: "30 days ago",
      enquiries: 0,
      viewingRequests: 0,
      topIssue: null,
    },
  ];

  function BrokerListingsPage() {
    const [searchTerm, setSearchTerm] = React.useState("");
    const [statusFilter, setStatusFilter] = React.useState("all");
    const [typeFilter, setTypeFilter] = React.useState("all");
    const [saleRentFilter, setSaleRentFilter] = React.useState("all");
    const [qualityFilter, setQualityFilter] = React.useState("all");

    // Filter listings
    const filteredListings = mockListings.filter((listing) => {
      const matchesSearch =
        listing.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
        listing.area.toLowerCase().includes(searchTerm.toLowerCase()) ||
        listing.id.toString().includes(searchTerm);

      const matchesStatus = statusFilter === "all" || listing.status === statusFilter;
      const matchesType = typeFilter === "all" || listing.type === typeFilter;
      const matchesSaleRent = saleRentFilter === "all" || listing.saleRent === saleRentFilter;
      const matchesQuality = qualityFilter === "all" || listing.quality === qualityFilter;

      return matchesSearch && matchesStatus && matchesType && matchesSaleRent && matchesQuality;
    });

    // Calculate stats
    const stats = {
      total: mockListings.length,
      live: mockListings.filter((l) => l.status === "live").length,
      draft: mockListings.filter((l) => l.status === "draft").length,
      review: mockListings.filter((l) => l.status === "review").length,
      needsQuality: mockListings.filter((l) => l.quality === "needs-work" || l.quality === "incomplete").length,
      hasEnquiries: mockListings.filter((l) => l.enquiries > 0 || l.viewingRequests > 0).length,
    };

    return (
      <div className="listings-page">
        {/* Header */}
        <div className="listings-header">
          <div className="listings-header-top">
            <div className="listings-header-content">
              <h1>My Listings</h1>
              <p>Manage your live, draft and under-review properties.</p>
            </div>
            <div className="listings-header-actions">
              <button className="btn-primary">+ Create new listing</button>
              <a href="#" className="btn-secondary" title="Back to broker dashboard">
                ← Dashboard
              </a>
            </div>
          </div>
        </div>

        {/* Stats strip */}
        <div className="stats-strip">
          <div className="stats-container">
            <div className="stat-item" title="Total listings">
              <span className="stat-label">Total</span>
              <span className="stat-value">{stats.total}</span>
            </div>
            <div className="stat-item" title="Live listings">
              <span className="stat-label">Live</span>
              <span className="stat-value">{stats.live}</span>
            </div>
            <div className="stat-item" title="Under review">
              <span className="stat-label">Review</span>
              <span className="stat-value">{stats.review}</span>
            </div>
            <div className="stat-item" title="Draft listings">
              <span className="stat-label">Drafts</span>
              <span className="stat-value">{stats.draft}</span>
            </div>
            <div className="stat-item" title="Needs quality fixes">
              <span className="stat-label">Quality Issues</span>
              <span className="stat-value">{stats.needsQuality}</span>
            </div>
            <div className="stat-item" title="Has enquiries or viewing requests">
              <span className="stat-label">With Enquiries</span>
              <span className="stat-value">{stats.hasEnquiries}</span>
            </div>
          </div>
        </div>

        {/* Filters */}
        <div className="filters-bar">
          <div className="filters-container">
            <input
              type="text"
              className="search-box"
              placeholder="Search by title, area, or listing ID..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
            <select
              className="filter-select"
              value={statusFilter}
              onChange={(e) => setStatusFilter(e.target.value)}
            >
              <option value="all">All Status</option>
              <option value="live">Live</option>
              <option value="draft">Draft</option>
              <option value="review">Under review</option>
              <option value="archived">Archived</option>
            </select>
            <select
              className="filter-select"
              value={typeFilter}
              onChange={(e) => setTypeFilter(e.target.value)}
            >
              <option value="all">All Types</option>
              <option value="Apartment">Apartment</option>
              <option value="House">House</option>
              <option value="Villa">Villa</option>
              <option value="Commercial">Commercial</option>
            </select>
            <select
              className="filter-select"
              value={saleRentFilter}
              onChange={(e) => setSaleRentFilter(e.target.value)}
            >
              <option value="all">Sale / Rent</option>
              <option value="Sale">Sale</option>
              <option value="Rent">Rent</option>
            </select>
            <select
              className="filter-select"
              value={qualityFilter}
              onChange={(e) => setQualityFilter(e.target.value)}
            >
              <option value="all">Quality Status</option>
              <option value="good">Good</option>
              <option value="needs-work">Needs work</option>
              <option value="incomplete">Incomplete</option>
            </select>
          </div>
        </div>

        {/* Content */}
        <div className="listings-content">
          {filteredListings.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">📋</div>
              <h2>No listings found</h2>
              <p>
                {searchTerm || statusFilter !== "all"
                  ? "Try adjusting your filters or search terms."
                  : "You haven't created any listings yet. Create your first listing to get started."}
              </p>
              <button className="btn-primary">+ Create new listing</button>
            </div>
          ) : (
            <div className="listings-grid">
              {filteredListings.map((listing) => (
                <div key={listing.id} className="listing-card">
                  {/* Thumbnail */}
                  <div className="listing-thumbnail">
                    {listing.thumbnail ? (
                      <img src={listing.thumbnail} alt={listing.title} />
                    ) : (
                      <div className="listing-thumbnail-placeholder">No photo</div>
                    )}
                  </div>

                  {/* Main content */}
                  <div className="listing-main">
                    {/* Header with title and badges */}
                    <div className="listing-header">
                      <h3 className="listing-title">{listing.title}</h3>
                      <div className="listing-badges">
                        {/* Status badge */}
                        {listing.status === "live" && <span className="badge badge-live">Live</span>}
                        {listing.status === "draft" && <span className="badge badge-draft">Draft</span>}
                        {listing.status === "review" && <span className="badge badge-review">Under Review</span>}
                        {listing.status === "archived" && <span className="badge badge-archived">Archived</span>}

                        {/* Quality badge */}
                        {listing.quality === "good" && (
                          <span className="badge badge-quality-good">✓ Good</span>
                        )}
                        {listing.quality === "needs-work" && (
                          <span className="badge badge-quality-needs">Needs work</span>
                        )}
                        {listing.quality === "incomplete" && (
                          <span className="badge badge-quality-incomplete">Incomplete</span>
                        )}
                      </div>
                    </div>

                    {/* Metadata row */}
                    <div className="listing-meta">
                      <div className="meta-item">
                        <span>📍</span>
                        <span>{listing.area}</span>
                      </div>
                      <div className="meta-item">
                        <span>{listing.type}</span>
                      </div>
                      <div className="meta-item">
                        <span>{listing.saleRent}</span>
                      </div>
                      <div className="meta-item">
                        <span>Updated {listing.lastUpdated}</span>
                      </div>
                    </div>

                    {/* Bottom row: price, issues, actions */}
                    <div className="listing-bottom">
                      <div>
                        <div className="listing-price">{listing.price}</div>
                        {listing.topIssue && <div className="listing-quality-issue">⚠ {listing.topIssue}</div>}
                        {(listing.enquiries > 0 || listing.viewingRequests > 0) && (
                          <div style={{ marginTop: "8px", display: "flex", gap: "8px", flexWrap: "wrap" }}>
                            {listing.enquiries > 0 && (
                              <span className="enquiry-badge">💬 {listing.enquiries} message{listing.enquiries > 1 ? "s" : ""}</span>
                            )}
                            {listing.viewingRequests > 0 && (
                              <span className="enquiry-badge">👁 {listing.viewingRequests} viewing request{listing.viewingRequests > 1 ? "s" : ""}</span>
                            )}
                          </div>
                        )}
                      </div>
                      <div className="listing-actions">
                        <button className="btn-action">Preview</button>
                        {listing.status !== "archived" && <button className="btn-action">Edit</button>}
                        {listing.quality && listing.quality !== "good" && (
                          <button className="btn-action btn-action-primary">Improve</button>
                        )}
                        <button className="btn-action">Area insights</button>
                        {listing.status !== "archived" && <button className="btn-action">More</button>}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<BrokerListingsPage />);
</script>

</body>
</html>
