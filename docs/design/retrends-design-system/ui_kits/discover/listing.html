<!-- @dsCard group="Discover" viewport="1200x2200" name="Listing detail (buyer)" subtitle="Buyer-facing property detail — adapts to apartment / house / villa / plot / commercial · save, contact, book viewing, area trends" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udupi Property Tracker — Listing detail</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }

  @keyframes upt-spin { to { transform: rotate(360deg); } }
  .upt-skel {
    background: linear-gradient(100deg, var(--surface-subtle) 30%, var(--stone-300) 50%, var(--surface-subtle) 70%);
    background-size: 200% 100%; animation: upt-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes upt-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Responsive */
  @media (max-width: 1000px) {
    .upt-grid { grid-template-columns: 1fr !important; }
    .upt-grid > div:last-child { position: static !important; }
  }
  @media (max-width: 720px) {
    .upt-main { padding: 18px 16px 110px !important; }
    .upt-nav { display: none !important; }
    .upt-tiles { grid-template-columns: 1fr 1fr !important; }
    .upt-rows, .upt-schools, .upt-ess, .upt-trust, .upt-similar { grid-template-columns: 1fr !important; }
    .upt-mobilebar { display: flex !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="listing-data.js"></script>
<script type="text/babel" src="ListingActions.jsx"></script>
<script type="text/babel" src="ListingDetail.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<window.UPTListing kind="apartment" state="default" />);
</script>
</body>
</html>
