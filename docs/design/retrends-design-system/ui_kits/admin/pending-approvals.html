<style>
  html, body { margin: 0; height: 100%; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }
  button { font-family: inherit; }
  table { table-layout: fixed; }
  .upt-scroll::-webkit-scrollbar { width: 10px; }

  .pa-row:hover { background: var(--surface-subtle); }
  .pa-row:last-child { border-bottom: none !important; }
  @keyframes uptShimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .upt-shimmer { background-image: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%); background-size: 420px 100%; background-repeat: no-repeat; animation: uptShimmer 1.25s ease-in-out infinite; }
  @media (max-width: 1180px) { .pa-col-broker, .pa-col-type { display: none; } .pa-c-broker, .pa-c-type { width: 0% !important; } .pa-c-listing { width: 29% !important; } .pa-c-status { width: 24% !important; } .pa-c-review { width: 15% !important; } }
