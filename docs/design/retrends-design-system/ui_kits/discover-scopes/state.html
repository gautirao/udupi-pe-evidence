<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — Result Scopes and Multi-Area Search · state player</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;height:100%;background:var(--background)}
body{font-family:var(--font-sans);color:var(--text-strong)}
*{box-sizing:border-box}
::selection{background:var(--accent);color:#fff}
:root{--plum-600:#5E5286;--plum-500:#7E6BA8;--plum-100:#DED7EC;--plum-tint:#F1EDF7;--evergreen-100:#CFE6D9;--evergreen-700:#1F694A;--ochre-50:#FBF3E2;--ochre-600:#A8791F;--ochre-700:#7A5714;--brick-600:#A33A2A}
a{color:var(--copper-600);text-decoration:none}
a:hover{color:var(--navy-800);text-decoration:underline}
.rs-pin{background:transparent !important;border:none !important}
.leaflet-container{font-family:var(--font-sans);background:#EDEBE6}
.leaflet-bar a{color:var(--navy-800)}
.leaflet-control-attribution{font-size:9.5px;background:rgba(255,255,255,0.7) !important}
.leaflet-control-zoom{margin-bottom:26px !important}
.rs-scroll::-webkit-scrollbar{width:9px}
.rs-scroll::-webkit-scrollbar-thumb{background:var(--stone-400,#C9C4B8);border-radius:999px;border:3px solid var(--background)}
.rs-navmode .leaflet-tile-pane{opacity:.62;filter:saturate(.72)}
.rs-mk .rs-core{transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1)}
.rs-mk:hover .rs-core{transform:scale(1.06)}
.rs-mk{cursor:pointer}
@keyframes rsShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rsSpin{to{transform:rotate(360deg)}}
.rs-spin{animation:rsSpin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.rs-spin{animation:none}.rs-mk .rs-core{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="src/scope-data.js?v=rs1"></script>
<script src="src/states-a.js?v=rs1"></script>
<script src="src/states-b.js?v=rs1"></script>
<script type="text/babel" src="src/ScopeBits.jsx?v=rs1"></script>
<script type="text/babel" src="src/ScopeMap.jsx?v=rs1"></script>
<script type="text/babel" src="src/ScopePanel.jsx?v=rs1"></script>
<script type="text/babel" src="src/ScopeApp.jsx?v=rs2"></script>
<script type="text/babel">
  const RSApp = () => React.createElement(window.RSStateApp);
  ReactDOM.createRoot(document.getElementById("root")).render(<RSApp />);
</script>
</body>
</html>
