class CreateAgriListing extends React.Component {
  constructor(props){
    super(props);
    this.state = { v:{ areaUnit:'Acre' }, waterOpen:false, recordsOpen:false, photos:0, coverPhoto:0, boundaryDrawn:false, nearby:[], poiDraft:{}, mode:'edit', published:false, desc:'', descTouched:false, aiState:'idle', tone:null, descUsed:false,
      /* staged location model */
      locQuery:'', locStatus:'empty', locResults:[], resolved:null, locSource:null, geo:'idle', pinDone:false, pickerOpen:false, pinPos:{x:50,y:48} };
  }

  set(n,val){ this.setState(s=>({ v:{...s.v,[n]:val} })); }
  toggleVal(n){ this.setState(s=>({ v:{...s.v,[n]:!s.v[n]} })); }
  toggleMulti(n,item){ this.setState(s=>{ const a=s.v[n]||[]; const has=a.includes(item); return { v:{...s.v,[n]: has?a.filter(x=>x!==item):[...a,item]} }; }); }

  accent(){ return (this.props.accentTheme||'Evergreen')==='Navy'
    ? { line:'var(--navy-800)', bg:'var(--navy-100)', fg:'var(--navy-800)' }
    : { line:'var(--evergreen-600)', bg:'var(--evergreen-50)', fg:'var(--evergreen-600)' }; }

  chipStyle(sel){ const a=this.accent(); return `display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;cursor:pointer;transition:all .12s;white-space:nowrap;border:1px solid ${sel?a.line:'var(--border-strong)'};background:${sel?a.bg:'var(--paper)'};color:${sel?a.fg:'var(--text-body)'};font-weight:${sel?'600':'500'};`; }
  segStyle(sel){ const a=this.accent(); return `flex:1;text-align:center;padding:9px 14px;border-radius:8px;font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;background:${sel?'var(--paper)':'transparent'};color:${sel?a.fg:'var(--text-muted)'};box-shadow:${sel?'var(--shadow-xs)':'none'};`; }
  toggle(n){ const on=!!this.state.v[n]; const a=this.accent(); return { on, onClick:()=>this.toggleVal(n), track:`width:42px;height:24px;border-radius:9999px;border:none;cursor:pointer;padding:0;position:relative;flex:none;transition:background .15s;background:${on?a.line:'var(--stone-400)'};`, knob:`position:absolute;top:3px;left:${on?'21px':'3px'};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s;` }; }

  chips(n,vals,fmt){ const cur=this.state.v[n]; return vals.map(val=>({ key:val, label:fmt?fmt(val):val, onClick:()=>this.set(n, cur===val?undefined:val), style:this.chipStyle(cur===val) })); }
  multi(n,vals){ const cur=this.state.v[n]||[]; return vals.map(val=>({ key:val, label:val, onClick:()=>this.toggleMulti(n,val), style:this.chipStyle(cur.includes(val)) })); }

  num(x){ return parseFloat(String(x==null?'':x).replace(/[^0-9.]/g,''))||0; }
  fmtINR(n){ n=Math.round(n); if(!n) return ''; if(n>=1e7) return '₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' Cr'; if(n>=1e5) return '₹'+(n/1e5).toFixed(2).replace(/\.?0+$/,'')+' L'; return '₹'+n.toLocaleString('en-IN'); }
  areaSqft(){ const v=this.state.v; return this.num(v.area) * (UNIT_SQFT[v.areaUnit||'Acre']||1); }
  priceTotal(){ return this.num(this.state.v.price); }
  perAcre(){ const a=this.areaSqft(), p=this.priceTotal(); return (a&&p)? p/(a/43560) : 0; }
  perCent(){ const a=this.areaSqft(), p=this.priceTotal(); return (a&&p)? p/(a/435.6) : 0; }
  perSqft(){ const a=this.areaSqft(), p=this.priceTotal(); return (a&&p)? p/a : 0; }
  cap(x){ return x ? x.charAt(0).toUpperCase()+x.slice(1) : x; }
  clean(x){ return (x && !/not sure/i.test(x)) ? x : ''; }

  buildDesc(tone){
    const v=this.state.v;
    const loc = v.locality ? ('in '+v.locality) : '';
    const unit = (v.areaUnit||'Acre').toLowerCase();
    const areaTxt = this.num(v.area) ? (v.area+' '+(this.num(v.area)===1?unit.replace(/s$/,''):unit)+(/sq\.ft/i.test(v.areaUnit)?'':'s').replace('acres','acres')) : '';
    const S=[];
    let lead = ('A parcel of agricultural land '+loc).trim();
    if(this.num(v.area)) lead = (this.num(v.area)+' '+(/sq\.ft/i.test(v.areaUnit)?'sq.ft of agricultural land':(v.areaUnit.toLowerCase()+'s of agricultural land'))+' '+loc).trim();
    if(tone==='factual') lead = ('Agricultural land '+loc+(this.num(v.area)?(', '+v.area+' '+v.areaUnit.toLowerCase()+(/sq\.ft/i.test(v.areaUnit)?'':'s')):'')).trim();
    S.push(this.cap(lead)+(this.priceTotal()?(', available for '+this.fmtINR(this.priceTotal())):'')+'.');

    /* land facts */
    const f=[];
    if(this.clean(v.facing)) f.push(v.facing+'-facing');
    if(this.clean(v.roadAccess)) f.push((v.roadAccess.toLowerCase())+' access');
    if(v.length && v.width) f.push(v.length+' × '+v.width+' ft');
    if(v.corner) f.push('corner plot');
    if(this.clean(v.fencing)) f.push(v.fencing.toLowerCase());
    if(this.clean(v.terrain)) f.push(v.terrain.toLowerCase()+' terrain');
    if(f.length && tone!=='short') S.push(this.cap('The land is '+f.slice(0,5).join(', '))+'.');

    /* water + cultivation — only what's confirmed */
    if(tone!=='short'){
      const w=[];
      if(this.clean(v.water)) w.push((v.water.toLowerCase())+' water source');
      if(v.irrigation==='Yes') w.push('irrigation available');
      if(v.electricity==='Yes') w.push('electricity connection');
      if(this.clean(v.soil)) w.push(v.soil.toLowerCase()+' soil');
      if(w.length) S.push(this.cap(w.join(', '))+'.');
      const cult = this.clean(v.cultivation);
      const crops = (v.crops||[]).filter(Boolean);
      if(cult) S.push('Currently '+cult.toLowerCase()+'.');
      else if(crops.length && tone!=='factual') S.push('Suitable for '+crops.slice(0,4).join(', ').toLowerCase()+'.');
      if(v.farmhouse) S.push('A farmhouse is present on the land.');
    }

    /* broker-declared location features — never asserted as verified */
    const feats=(v.features||[]).filter(Boolean);
    if(feats.length && tone!=='short' && tone!=='factual') S.push('Broker notes it as '+feats.slice(0,3).map(x=>x.toLowerCase()).join(', ')+'.');

    /* possession */
    if(this.clean(v.possession) && tone!=='short') S.push(/immediate/i.test(v.possession)?'Available immediately.':('Available '+v.possession.toLowerCase()+'.'));

    if(tone==='factual') S.push('Survey and land-record details are seller/broker-provided and not verified by the platform.');

    let out=S.join(' ');
    if(tone==='short') out=S.slice(0,2).join(' ');

      mapPinnedText: pinned ? (boundaryDrawn?'Location confirmed · approximate outline sketched':'Location confirmed') : (resolved?'Pin confirmation pending':'Location not confirmed yet'),
      hasDesc:(desc||'').length>0, noDesc:(desc||'').length===0, descForReview: desc||'',
      refNo: 'RT-AGRI-'+String((priceTotal||1284)%10000|0).padStart(4,'0'),
      reviewTiles, reviewRows, hasReviewTiles, hasReviewRows, noDetails, reviewTileGrid, reviewThumbs, trustChecks, reviewNoNearby: !reviewHasNearby
    };
  }

              <span style={s('text-align:left;line-height:1.3;')}><span style={s('display:block;font-size:13px;font-weight:600;color:var(--evergreen-600);')}>Use my current location</span><span style={s('display:block;font-size:11.5px;color:var(--text-muted);font-weight:500;')}>Standing on the land? Start the pin nearby.</span></span>
            </button>

        {R.geoPrompt && (

              <div style={s('flex:1;min-width:0;')}>
                <div style={s('font-size:11px;font-weight:700;letter-spacing:0.04em;color:var(--evergreen-600);text-transform:uppercase;margin-bottom:3px;')}>{R.resSourceBrowser?'Using your current location':'Search result selected'}</div>
                <div style={s('font-size:15px;font-weight:700;color:var(--text-strong);')}>{R.resLine}</div>
                <div style={s('margin-top:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;')}>
                  <button type="button" onClick={R.changeLocation} style={s('font-size:12.5px;font-weight:600;color:var(--evergreen-600);background:transparent;border:none;cursor:pointer;padding:0;')}>Change</button>
                  <span style={s('font-size:11.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;')}><Ico inner={I.shield} size={13} stroke="var(--grey-500)"/>Buyers see only {R.resPublic}</span>

              <span style={s('width:34px;height:34px;border-radius:9px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;')}><Ico inner={I.pin} size={17} stroke="var(--grey-400)"/></span>
              <p style={s('margin:0;font-size:13px;color:var(--text-muted);line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto;')}>Choose a matched place above to confirm the exact land pin on the map.</p>

          {R.pinEnabled && (
            <div style={s('position:relative;height:190px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background-color:#E5EAE0;background-image:linear-gradient(rgba(31,122,92,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,122,92,0.07) 1px,transparent 1px);background-size:26px 26px;')}>

                <span style={s('font-size:12px;font-weight:600;color:var(--evergreen-600);background:rgba(255,255,255,0.92);padding:5px 12px;border-radius:8px;box-shadow:var(--shadow-xs);')}>Map centred near {R.resPublic}</span>

                  <span style={s('font-size:11.5px;color:var(--text-muted);line-height:1.45;max-width:340px;')}>Optional: sketch the land outline. This is an approximate guide only — not a legal boundary or survey.</span>
                  <button type="button" onClick={R.toggleBoundary} style={s('display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--navy-800);background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;padding:7px 13px;cursor:pointer;flex:none;')}><Ico inner={I.pentagon} size={13}/>{R.boundaryBtnLabel}</button>

                {R.boundaryDrawn && R.computedAcresStr && (

                )}
              </div>
            </div>
          )}
        </div>

        {/* nearby context — gated behind confirmed location */}
        {R.pinConfirmed ? (
          <div style={s('background:var(--canvas-100);border:1px solid var(--border);border-radius:12px;padding:16px 18px;')}>
            <div style={s('display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;')}>
              <span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Nearby context</span>

            </div>
          </div>
        ) : (
          <div style={s('border:1.5px dashed var(--border);border-radius:12px;padding:18px 20px;background:var(--canvas-100);display:flex;align-items:center;gap:12px;')}>
            <span style={s('width:30px;height:30px;border-radius:8px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.route} size={16} stroke="var(--grey-400)"/></span>
            <div><div style={s('font-size:13px;font-weight:600;color:var(--text-strong);')}>Nearby context is locked</div><p style={s('margin:2px 0 0;font-size:12.5px;color:var(--text-muted);line-height:1.45;')}>Confirm the land location to add nearby context — roads, village, market and transport access.</p></div>
          </div>
        )}

        <div style={s('height:1px;background:var(--border);')}></div>
        <Input label="Short title" hint="Buyers see this first. Lead with size, village and what stands out." placeholder="e.g. 2.5 acres roadside agricultural land, Hejamadi" size="lg" value={R.vv.title} onChange={R.h.title} />
      </div>
    </div>
  ); }

  /* ---------------- land-pin confirmation modal ---------------- */
  picker(R){ if(!R.pickerOpen) return null; return (
    <div style={s('position:fixed;inset:0;z-index:60;background:rgba(14,22,38,0.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;')}>
      <div style={s('background:var(--paper);border-radius:18px;box-shadow:var(--shadow-xl);width:100%;max-width:640px;overflow:hidden;')}>
        <div style={s('padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;')}>
          <div>
            <h3 style={s('margin:0 0 3px;font-size:16px;font-weight:700;color:var(--text-strong);')}>Confirm the exact land location</h3>
            <p style={s('margin:0;font-size:12.5px;color:var(--text-muted);')}>Move the pin to the farm entrance or land centre. Centred near {R.resPublic}.</p>
          </div>
          <button type="button" onClick={R.cancelPicker} style={s('width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--paper);color:var(--text-muted);font-size:16px;line-height:1;cursor:pointer;flex:none;')}>×</button>
        </div>
        <div onMouseDown={R.onMapDown} onMouseMove={R.onMapMove} onMouseUp={R.onMapUp} onMouseLeave={R.onMapUp} style={s('position:relative;height:340px;cursor:grab;user-select:none;background-color:#E5EAE0;background-image:linear-gradient(rgba(31,122,92,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,122,92,0.08) 1px,transparent 1px);background-size:30px 30px;')}>
          <div style={s('position:absolute;top:44%;left:0;right:0;height:16px;background:rgba(255,255,255,0.6);transform:rotate(-3deg);pointer-events:none;')}></div>
          <div style={s('position:absolute;top:0;bottom:0;left:30%;width:11px;background:rgba(255,255,255,0.55);transform:rotate(2deg);pointer-events:none;')}></div>
          <div style={s('position:absolute;top:0;bottom:0;left:64%;width:8px;background:rgba(255,255,255,0.45);pointer-events:none;')}></div>
          <div style={s('position:absolute;left:'+R.pinPos.x+'%;top:'+R.pinPos.y+'%;transform:translate(-50%,-100%);pointer-events:none;')}><Ico inner={I.pinFill} fill="var(--copper-500)" stroke="#fff" sw={1.5} size={40}/></div>
          <div style={s('position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.92);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--evergreen-600);box-shadow:var(--shadow-xs);display:inline-flex;align-items:center;gap:6px;pointer-events:none;')}><Ico inner={I.pin} size={13}/>Drag or tap to move the pin to the land</div>
        </div>
        <div style={s('padding:14px 22px;background:var(--ochre-50);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;')}>
          <Ico inner={I.warn} stroke="var(--ochre-600)" sw={2.4} size={16} style={{marginTop:'1px',flex:'none'}}/>
          <span style={s('font-size:12px;color:var(--text-body);line-height:1.5;')}>Getting this right helps buyers understand access, nearby roads and land context. This is an <strong style={s('color:var(--text-strong);')}>approximate pin</strong> — not a legal land boundary or survey.</span>
        </div>
        <div style={s('padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--border);flex-wrap:wrap;')}>
          <span style={s('font-size:11.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.shield} size={13} stroke="var(--grey-500)"/>Exact pin stays private — buyers see only {R.resPublic}.</span>
          <div style={s('display:flex;gap:10px;')}>
            <Button variant="ghost" onClick={R.cancelPicker}>Cancel</Button>
            <Button variant="accent" onClick={R.confirmPin}>Confirm land location</Button>
          </div>
        </div>
      </div>
    </div>
  ); }

  ynBlock(R, n, label){ const cur=this.state.v[n]; return (
    <div><span style={s(FLD)}>{label}</span>
      <div style={s(SEGWRAP+'width:100%;')}>{YN.map(val=>(<button key={val} type="button" onClick={()=>this.set(n,val)} style={s(this.segStyle(cur===val))}>{val}</button>))}</div>
    </div>
  ); }

  /* ---------------- edit: form column ---------------- */
  formCol(R){ return (
    <div style={s('display:flex;flex-direction:column;gap:18px;')}>

      {/* 0. context banner */}
      <div style={s('display:flex;align-items:center;gap:12px;background:var(--evergreen-50);border:1px solid rgba(31,122,92,0.18);border-radius:12px;padding:13px 16px;')}>
        <Ico inner={I.sprout} stroke="var(--evergreen-600)" size={20}/>
        <span style={s('font-size:13px;color:var(--text-body);line-height:1.45;')}>You're listing <strong style={s('color:var(--evergreen-600);')}>agricultural land</strong>. Only land-relevant fields are shown — no BHK, furnishing or commercial fields. Residential and commercial listings use a separate flow.</span>
      </div>

      {/* 1. Where is the land? (staged location + pin confirmation) */}
      {this.locationCard(R)}

      {/* 2. Land basics + price */}
      <div style={s(CARD)}>
        {this.secHead('2','Land area & price', 'The two facts every buyer asks first.')}
        <div style={s('display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start;margin-bottom:20px;')}>
          <div>
            <span style={s(FLD)}>Land area</span>
            <div style={s('display:flex;gap:10px;')}>
              <input type="text" inputMode="decimal" placeholder="e.g. 2.5" value={R.vv.area} onChange={R.h.area} style={s('flex:1;'+NUM)} />
              <div style={s('width:118px;flex:none;')}><Select options={R.areaUnitOpts} value={R.areaUnit} onChange={R.h.areaUnit} /></div>
            </div>
            <span style={s(HINT)}>Acre, cent, gunta or sq.ft — whichever you measure in.</span>
          </div>
          <div>
            <span style={s(FLD)}>Total price (₹)</span>
            <input type="text" inputMode="numeric" placeholder="e.g. 7800000" value={R.vv.price} onChange={R.h.price} style={s(BIG)} />
            <div style={s('display:flex;align-items:center;justify-content:space-between;margin-top:8px;')}>
              <span style={s('font-size:13px;color:var(--copper-600);font-weight:600;font-family:var(--font-mono);')}>{R.priceEcho}</span>
              <label style={s('display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-body);cursor:pointer;')}>{this.tgl(R.tg.negotiable)}Negotiable</label>
            </div>
          </div>
        </div>

        {/* derived price helper */}
        <div style={s('background:var(--canvas-100);border:1px solid var(--border);border-radius:12px;padding:16px 18px;')}>
          <div style={s('display:flex;align-items:center;gap:8px;margin-bottom:12px;')}><Ico inner={I.layers} size={15} stroke="var(--evergreen-600)"/><span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Price breakdown</span><span style={s('font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ochre-600);background:var(--ochre-50);padding:1px 6px;border-radius:4px;')}>Derived</span></div>
          {R.hasDerived ? (
            <React.Fragment>
              <div style={s('display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--border);margin-bottom:14px;')}>
                <span style={s('font-size:12.5px;color:var(--text-muted);')}>Total price</span>
                <span style={s('font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--text-strong);line-height:1;')}>{R.priceTotalStr}</span>
              </div>
              <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:12px;')}>
                {[['Per acre',R.perAcreStr],['Per cent',R.perCentStr]].map(([l,val])=>(
                  <div key={l} style={s('background:var(--paper);border:1px solid var(--border);border-radius:9px;padding:12px 14px;')}>
                    <div style={s('font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--text-strong);line-height:1.1;')}>{val}</div>
                    <div style={s('font-size:11.5px;color:var(--text-muted);margin-top:4px;')}>{l}</div>
                  </div>
                ))}
              </div>
              <div style={s('margin-top:11px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);')}>Secondary: {R.perSqftStr} / sq.ft</div>
            </React.Fragment>
          ) : (
            <p style={s('margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.5;')}>Enter total price and land area — we'll work out the price per acre, cent and sq.ft automatically. You never type these in.</p>
          )}
        </div>

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>
        <span style={s(FLDt)}>Availability</span>
        <div style={s(CHIPWRAP)}>{this.chipRow(R.possessionChips)}</div>
        <span style={s(FLDt+'margin-top:20px;')}>Land facing</span>
        <div style={s(CHIPWRAP)}>{this.chipRow(R.facingChips)}</div>
      </div>

      {/* 3. Shape, access & boundary */}
      <div style={s(CARD)}>
        {this.secHead('3','Shape, access & boundary', 'Practical land details — not a legal form. Skip anything you don\u2019t know.')}
        <div style={s('display:flex;flex-direction:column;gap:20px;')}>
          <div style={s('display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;')}>
            <div><span style={s(FLD)}>Length (optional)</span><input type="text" inputMode="numeric" placeholder="ft" value={R.vv.length} onChange={R.h.length} style={s(NUM)} /></div>
            <div><span style={s(FLD)}>Width (optional)</span><input type="text" inputMode="numeric" placeholder="ft" value={R.vv.width} onChange={R.h.width} style={s(NUM)} /></div>
            <div><span style={s(FLD)}>Road width (optional)</span><input type="text" inputMode="numeric" placeholder="ft" value={R.vv.roadWidth} onChange={R.h.roadWidth} style={s(NUM)} /></div>
          </div>
          <div><span style={s(FLDt)}>Road access</span><div style={s(CHIPWRAP)}>{this.chipRow(R.roadChips)}</div></div>
          <div><span style={s(FLDt)}>Boundary / fencing</span><div style={s(CHIPWRAP)}>{this.chipRow(R.fencingChips)}</div></div>
          <div><span style={s(FLDt)}>Terrain</span><div style={s(CHIPWRAP)}>{this.chipRow(R.terrainChips)}</div></div>
          <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;')}>
            <div><span style={s(FLD)}>Number of open sides (optional)</span>
              <div style={s(SEGWRAP+'width:100%;')}>{['1','2','3','4'].map(val=>(<button key={val} type="button" onClick={()=>this.set('openSides',this.state.v.openSides===val?undefined:val)} style={s(this.segStyle(this.state.v.openSides===val))}>{val}</button>))}</div>
            </div>
            <div style={s('display:flex;flex-direction:column;gap:10px;')}>
              {this.togRow('corner','Corner plot')}
              {this.togRow('vehicle','Vehicle access to plot')}
            </div>
          </div>
        </div>
      </div>

      {/* 4. Water, cultivation & suitability (optional, collapsed) */}
      <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;')}>
        <button type="button" onClick={R.onWater} style={s('width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;background:transparent;border:none;cursor:pointer;text-align:left;')}>
          <div style={s('display:flex;align-items:center;gap:12px;')}>
            <div style={s('width:28px;height:28px;border-radius:50%;background:var(--evergreen-50);color:var(--evergreen-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.droplet} size={16}/></div>
            <div>
              <h2 style={s('font-size:17px;font-weight:700;color:var(--text-strong);margin:0;')}>Water, cultivation &amp; suitability</h2>
              <p style={s('margin:3px 0 0;font-size:12.5px;color:var(--text-muted);')}>All optional. Save without knowing every detail — add what you can.</p>
            </div>
          </div>
          <span style={s('color:var(--text-muted);transition:transform .2s;transform:'+R.waterChevron+';display:flex;')}><Ico inner={I.chevDown} size={20}/></span>
        </button>
        {R.waterOpen && (
          <div style={s('padding:4px 26px 26px;')}>
            <div style={s('height:1px;background:var(--border);margin-bottom:22px;')}></div>
            <div style={s('display:flex;flex-direction:column;gap:20px;')}>
              <div><span style={s(FLDt)}>Water source</span><div style={s(CHIPWRAP)}>{this.chipRow(R.waterChips)}</div></div>
              <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:16px;')}>
                {this.ynBlock(R,'irrigation','Irrigation available')}
                {this.ynBlock(R,'electricity','Electricity connection')}
              </div>
              <div style={s(ROW2)}>
                <div><span style={s(FLD)}>Soil type (optional)</span><Select options={R.soilOpts} value={R.vv.soil} onChange={R.h.soil} /></div>
                <div><span style={s(FLD)}>Current cultivation (optional)</span><input type="text" placeholder="e.g. Paddy + coconut" value={R.vv.cultivation} onChange={R.h.cultivation} style={s(TXT)} /></div>
              </div>
              <div><span style={s(FLDt)}>Suitable crops (optional)</span><div style={s(CHIPWRAP)}>{this.chipRow(R.cropChips)}</div></div>
              <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:10px;')}>
                {this.togRow('farmhouse','Farmhouse on land')}
                {this.togRow('trees','Trees / plantation present')}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* 5. Location features (coastal / regional) */}
      <div style={s(CARD)}>
        {this.secHead('5','Location features', 'Broker-declared. Pick what genuinely applies — shown as broker-noted, not platform-verified.')}
        <div style={s(CHIPWRAP)}>{this.chipRow(R.featureChips)}</div>
        <p style={s('margin:14px 0 0;font-size:12px;color:var(--text-muted);line-height:1.5;display:flex;align-items:flex-start;gap:6px;')}><Ico inner={I.info} size={14} stroke="var(--grey-500)" style={{marginTop:'1px'}}/>These are how you describe the land's setting. ReTrends doesn't confirm proximity claims like "near beach" — keep them honest.</p>
      </div>

      {/* 6. Land-record details (collapsed optional) */}
      <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;')}>
        <button type="button" onClick={R.onRecords} style={s('width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;background:transparent;border:none;cursor:pointer;text-align:left;')}>
          <div style={s('display:flex;align-items:center;gap:12px;')}>
            <div style={s('width:28px;height:28px;border-radius:50%;background:var(--evergreen-50);color:var(--evergreen-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.fileCheck} size={16}/></div>
            <div>
              <h2 style={s('font-size:17px;font-weight:700;color:var(--text-strong);margin:0;')}>Land record details</h2>
              <p style={s('margin:3px 0 0;font-size:12.5px;color:var(--text-muted);')}>Optional — add what you know. Serious buyers may ask for these later.</p>
            </div>
          </div>
          <span style={s('color:var(--text-muted);transition:transform .2s;transform:'+R.recordsChevron+';display:flex;')}><Ico inner={I.chevDown} size={20}/></span>
        </button>
        {R.recordsOpen && (
          <div style={s('padding:4px 26px 26px;')}>
            <div style={s('height:1px;background:var(--border);margin-bottom:18px;')}></div>
            <p style={s('margin:0 0 18px;font-size:13px;color:var(--text-muted);line-height:1.5;background:var(--canvas-200);border-radius:8px;padding:11px 14px;display:flex;align-items:flex-start;gap:8px;')}><Ico inner={I.shield} size={15} stroke="var(--grey-500)" style={{marginTop:'1px'}}/><span><strong style={s('color:var(--text-body);')}>Seller / broker-provided details.</strong> Survey number, RTC and ownership shown here are entered by the seller or broker, displayed exactly as written, and are <strong style={s('color:var(--text-body);')}>not verified by the platform</strong> unless a verification step exists. We never display "title verified" or "records verified".</span></p>
            <div style={s('display:flex;flex-direction:column;gap:18px;')}>
              <div style={s(ROW2)}>
                <div><span style={s(FLD)}>Ownership type</span><Select options={R.ownershipOpts} value={R.ownershipVal} onChange={e=>this.set('ownership',e.target.value)} /></div>
                <div><span style={s(FLD)}>Survey number</span><input type="text" placeholder="e.g. 142/3B" value={R.vv.survey} onChange={R.h.survey} style={s(MONO)} /></div>
              </div>
              <div style={s(ROW2)}>
                <div><span style={s(FLD)}>RTC / land record reference (optional)</span><input type="text" placeholder="Reference number" value={R.vv.rtc} onChange={R.h.rtc} style={s(MONO)} /></div>
                <div><span style={s(FLD)}>Land category (optional)</span><Select options={R.categoryOpts} value={R.vv.landCategory} onChange={R.h.landCategory} /></div>
              </div>
              <div style={s(ROW2)}>
                <div><span style={s(FLD)}>Conversion status (optional)</span><Select options={R.conversionOpts} value={R.vv.conversion} onChange={R.h.conversion} /></div>
                <div><span style={s(FLD)}>Boundary description (optional)</span><input type="text" placeholder="e.g. East: road, West: Kumar's land" value={R.vv.boundaryDesc} onChange={R.h.boundaryDesc} style={s(TXT)} /></div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* 7. Photos & video */}
      <div style={s(CARD)}>
        {this.secHead('7','Photos & video')}
        <div style={s('display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;')}>
          <span style={s('font-size:13px;font-weight:600;color:var(--text-strong);')}>Photos <span style={s('color:var(--text-muted);font-weight:500;')}>· {R.photoCountLabel}</span></span>
          {R.hasPhotos && <span style={s('font-size:12px;color:var(--text-muted);')}>“Set cover” chooses the first photo buyers see</span>}
        </div>
        <div style={s('display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px;')}>
          {R.photoTiles.map(t => t.filled ? (
            <div key={t.key} style={s(t.fillStyle)}>
              <button type="button" onClick={t.onRemove} style={s(t.removeStyle)}>×</button>
              {t.isCover && <span style={s(t.coverBadgeStyle)}>Cover</span>}
              {t.notCover && <button type="button" onClick={t.onSelect} style={s(t.setCoverStyle)}>Set cover</button>}
            </div>
          ) : (
            <button key={t.key} type="button" onClick={t.onAdd} style={s(t.emptyStyle)}>+</button>
          ))}
        </div>
        <span style={s('display:block;font-size:12px;color:var(--text-muted);')}>Land photos buyers value most: road access, a wide land view, water source, boundary / fencing, and the farm entrance.</span>

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>

        <div style={s('margin-top:0;')}>
          <span style={s(FLD)}>Walkthrough video <span style={s('color:var(--text-muted);font-weight:500;')}>· optional</span></span>
          <input type="text" placeholder="Paste a YouTube, Instagram or public video link" value={R.vv.video} onChange={R.h.video} style={s(TXT)} />
          <span style={s(HINT)}>Optional: add a land walkthrough video showing access road, boundary, water source or cultivation. Shown to buyers only if added.</span>
        </div>
      </div>

      {/* 8. Description + AI */}
      <div style={s(CARD)}>
        {this.secHead('8','Description')}
        {R.aiIdle && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:26px 24px;text-align:center;background:var(--canvas-100);')}>
            <div style={s('width:38px;height:38px;border-radius:10px;background:var(--evergreen-50);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;')}><Ico inner={I.sparkle} stroke="var(--evergreen-600)" size={20}/></div>
            <p style={s('margin:0 0 16px;font-size:14px;color:var(--text-body);line-height:1.55;max-width:420px;margin-left:auto;margin-right:auto;')}>Draft a land description from the facts you've already entered. Every word stays editable — nothing is invented. We never claim clear title, converted land, river-facing or guaranteed appreciation unless you've entered it.</p>
            <div style={s('display:flex;gap:10px;justify-content:center;')}>
              <Button variant="accent" onClick={R.doGenerate}>Generate description</Button>
              <Button variant="ghost" onClick={R.editManual}>Write it myself</Button>
            </div>
          </div>
        )}
        {R.aiGenerating && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:38px 24px;text-align:center;background:var(--canvas-100);display:flex;flex-direction:column;align-items:center;gap:14px;')}>
            <span style={s('width:26px;height:26px;border:3px solid var(--evergreen-50);border-top-color:var(--evergreen-600);border-radius:50%;animation:spin .7s linear infinite;display:block;')}></span>
            <span style={s('font-size:14px;color:var(--text-muted);')}>Writing from your land details…</span>
          </div>
        )}
        {R.aiReady && (
          <div>

                <div style={s('display:flex;gap:18px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);')}>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.calendar} size={13}/>Last updated just now</span>
                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.users} size={13}/>Listed by verified broker</span>
                </div>
              </div>
            </div>

            {/* Right rail */}
            <div style={s('position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;')}>
              <div style={s('font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;')}>Editor view · only you see this</div>
              <div style={s('font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:var(--canvas-200);border:1px solid var(--border);border-radius:8px;padding:8px 11px;')}>Internal ref {R.refNo} · not shown to buyers</div>
              {R.showStrength && (
                <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);')}>
                  <div style={s('display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;')}><span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Listing strength</span><span style={s('font-size:13px;font-weight:700;font-family:var(--font-mono);color:'+R.strengthColor+';')}>{R.strengthLabel}</span></div>
                  <div style={s('height:7px;border-radius:99px;background:var(--grey-200);overflow:hidden;')}><div style={s('height:100%;width:'+R.strengthWidth+';background:'+R.strengthColor+';border-radius:99px;transition:width .3s ease;')}></div></div>
                  <div style={s('margin-top:12px;display:flex;flex-direction:column;gap:8px;')}>{R.confirmChips.map(c=>(<div key={c.key} style={s('display:flex;align-items:center;gap:8px;')}><span style={s(c.dot)}>{c.check}</span><span style={s('font-size:12.5px;color:'+c.textColor+';')}>{c.label}</span></div>))}</div>
                </div>
              )}
              <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);')}>
                <span style={s('display:block;font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:12px;')}>Before you submit for review</span>
                {R.reviewMissingNone && <div style={s('display:flex;align-items:center;gap:9px;font-size:13px;color:var(--trust-verified-fg);')}><span style={s('width:18px;height:18px;border-radius:50%;background:var(--evergreen-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;')}>✓</span>Everything useful is filled in.</div>}
                {R.reviewHasMissing && (
                  <div style={s('display:flex;flex-direction:column;gap:10px;')}>
                    {R.reviewMissing.map((m,i)=>(<div key={i} style={s('display:flex;align-items:center;gap:9px;')}><span style={s('width:16px;height:16px;border-radius:50%;background:var(--ochre-50);color:var(--ochre-600);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.warn} stroke="currentColor" sw={2.6} size={11}/></span><span style={s('font-size:13px;color:var(--text-body);')}>{m}</span></div>))}
                    <button type="button" onClick={R.backToEdit} style={s('margin-top:4px;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--evergreen-600);background:transparent;border:none;cursor:pointer;padding:0;')}>Go back and complete →</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </React.Fragment>
      )}

      {R.published && (
        <div style={s('max-width:560px;margin:30px auto;text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:44px 36px;box-shadow:var(--shadow-md);')}>
          <div style={s('width:56px;height:56px;border-radius:50%;background:var(--trust-verified-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;')}><Ico inner={I.fileCheck} stroke="var(--evergreen-600)" sw={2.2} size={26}/></div>
          <span style={s('display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ochre-600);background:var(--ochre-50);padding:4px 11px;border-radius:9999px;margin-bottom:14px;')}>Pending admin approval</span>
          <h2 style={s('font-family:var(--font-serif);font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 8px;')}>Submitted for review</h2>
          <p style={s('margin:0 0 22px;font-size:14.5px;color:var(--text-muted);line-height:1.55;')}>Your agricultural listing has been sent for review. An admin will check it before it goes live to buyers — you can keep editing it from your dashboard in the meantime.</p>
          <div style={s('display:flex;gap:10px;justify-content:center;')}>
            <Button variant="primary" onClick={R.backToEdit}>Back to dashboard</Button>
            <Button variant="outline" onClick={R.backToEdit}>Back to editing</Button>
          </div>
        </div>
      )}
    </React.Fragment>
  ); }

  /* ---------------- footer ---------------- */
  footer(R){ return (
    <div style={s('position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--paper);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(14,22,38,0.05);display:flex;align-items:center;z-index:15;')}>
      <div style={s('max-width:1180px;margin:0 auto;width:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;')}>
        <span style={s('font-size:13px;color:var(--text-muted);')}>{R.footerStatus}</span>
        <div>
          {R.editMode && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost">Save draft</Button>
              <Button variant="primary" onClick={R.goReview}>Review listing</Button>
            </div>
          )}
          {R.reviewNotPublished && (
            <div style={s('display:flex;gap:12px;')}>
              <Button variant="ghost" onClick={R.backToEdit}>Back to editing</Button>
              <Button variant="outline">Save draft</Button>
              <Button variant="accent" onClick={R.publish}>Submit for review</Button>
            </div>
          )}
          {R.published && <Button variant="primary" onClick={R.backToEdit}>Back to dashboard</Button>}
        </div>
      </div>
    </div>
  ); }

  render(){
    const R = this.rv();
    return (
      <div style={s('min-height:100vh;background:var(--canvas-100);font-family:var(--font-sans);color:var(--text-body);')}>
        {this.header()}
        <div style={s('max-width:1180px;margin:0 auto;padding:34px 24px 130px;')}>
          <div style={s('margin-bottom:28px;')}>
            {R.reviewMode && <button type="button" onClick={R.backToEdit} style={s('display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--evergreen-600);background:transparent;border:none;cursor:pointer;padding:0;margin-bottom:14px;')}><Ico inner={I.chevLeft} size={16}/>Back to editing</button>}
            <div style={s('font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--evergreen-600);font-weight:700;margin-bottom:8px;')}>Agricultural land</div>
            <h1 style={s('font-family:var(--font-serif);font-size:34px;font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 8px;')}>{R.pageTitle}</h1>
            <p style={s('margin:0;font-size:15px;color:var(--text-muted);max-width:640px;line-height:1.5;')}>{R.pageSub}</p>
          </div>
          {R.editMode && (
            <div style={s('display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:28px;align-items:start;')}>
              {this.formCol(R)}
              {this.editRail(R)}
            </div>
          )}
          {R.reviewMode && this.reviewView(R)}
        </div>
        {this.footer(R)}
        {this.picker(R)}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<CreateAgriListing />);
</script>
</body>
</html>
