class CreateResidentialListing extends React.Component {
  constructor(props){
    super(props);
    this.state = { ptype:'apartment', purpose:'sale', v:{ areaUnit:'Sq.ft' }, moreOpen:false, photos:0, coverPhoto:0, pinned:false, nearby:[], poiDraft:{}, mode:'edit', published:false, desc:'', descTouched:false, aiState:'idle', tone:null, descUsed:false };
  }

  set(n,val){ this.setState(s=>({ v:{...s.v,[n]:val} })); }
  toggleVal(n){ this.setState(s=>({ v:{...s.v,[n]:!s.v[n]} })); }
  toggleMulti(n,item){ this.setState(s=>{ const a=s.v[n]||[]; const has=a.includes(item); return { v:{...s.v,[n]: has?a.filter(x=>x!==item):[...a,item]} }; }); }

  accent(){ return (this.props.accentTheme||'Navy')==='Copper'
    ? { line:'var(--copper-500)', bg:'var(--copper-100)', fg:'var(--copper-600)' }
    : { line:'var(--navy-800)', bg:'var(--navy-100)', fg:'var(--navy-800)' }; }

  chipStyle(sel){ const a=this.accent(); return `display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;cursor:pointer;transition:all .12s;white-space:nowrap;border:1px solid ${sel?a.line:'var(--border-strong)'};background:${sel?a.bg:'var(--paper)'};color:${sel?a.fg:'var(--text-body)'};font-weight:${sel?'600':'500'};`; }
  segStyle(sel){ const a=this.accent(); return `flex:1;text-align:center;padding:9px 14px;border-radius:8px;font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;background:${sel?'var(--paper)':'transparent'};color:${sel?a.fg:'var(--text-muted)'};box-shadow:${sel?'var(--shadow-xs)':'none'};`; }
  cardStyle(sel){ const a=this.accent(); return `display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px 6px;border-radius:12px;cursor:pointer;background:var(--paper);transition:all .12s;border:1.5px solid ${sel?a.line:'var(--border-strong)'};box-shadow:${sel?'var(--shadow-sm)':'none'};color:${sel?a.fg:'var(--text-body)'};font-family:var(--font-sans);font-size:12.5px;font-weight:600;`; }
  toggle(n){ const on=!!this.state.v[n]; const a=this.accent(); return { on, onClick:()=>this.toggleVal(n), track:`width:42px;height:24px;border-radius:9999px;border:none;cursor:pointer;padding:0;position:relative;flex:none;transition:background .15s;background:${on?a.line:'var(--stone-400)'};`, knob:`position:absolute;top:3px;left:${on?'21px':'3px'};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s;` }; }

  chips(n,vals,fmt){ const cur=this.state.v[n]; return vals.map(val=>({ key:val, label:fmt?fmt(val):val, onClick:()=>this.set(n, cur===val?undefined:val), style:this.chipStyle(cur===val) })); }
  multi(n,vals){ const cur=this.state.v[n]||[]; return vals.map(val=>({ key:val, label:val, onClick:()=>this.toggleMulti(n,val), style:this.chipStyle(cur.includes(val)) })); }
  seg(n,vals){ const cur=this.state.v[n]; return vals.map(val=>({ key:val, label:val, onClick:()=>this.set(n,val), style:this.segStyle(cur===val) })); }

  num(x){ return parseInt(String(x||'').replace(/[^0-9]/g,''))||0; }
  fmtINR(raw){ const n=this.num(raw); if(!n) return ''; if(n>=1e7) return '₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' Cr'; if(n>=1e5) return '₹'+(n/1e5).toFixed(2).replace(/\.?0+$/,'')+' L'; return '₹'+n.toLocaleString('en-IN'); }
  fmtPrice(){ const v=this.state.v; return this.fmtINR(this.state.purpose==='rent'?v.rent:v.price); }
  cap(x){ return x ? x.charAt(0).toUpperCase()+x.slice(1) : x; }

  buildDesc(tone){
    const v=this.state.v, p=this.state.purpose, t=this.state.ptype; const isRent=p==='rent';
    const tn={apartment:'apartment',house:'independent house',villa:'villa',plot:'residential plot'}[t];
    const loc=v.project?('at '+v.project):(v.locality?('in '+v.locality):'');
    const cfg=(t!=='plot'&&v.bhk)?(v.bhk+' BHK '):'';
    const S=[];
    let lead=(cfg+tn+' '+loc).trim()+'.';
    if(tone==='warm') lead='A comfortable '+(cfg+tn+' '+loc).trim()+', ready to welcome its next '+(isRent?'tenant':'owner')+'.';
    S.push(this.cap(lead));
    const f=[];
    const area=t==='plot'?(v.plotarea&&(v.plotarea+' sq.ft plot')):(t==='apartment'?(v.carpet&&(v.carpet+' sq.ft carpet area')):(v.builtup&&(v.builtup+' sq.ft built-up area')));
    if(area) f.push(area);
    if(t!=='plot'){ if(v.bath) f.push(v.bath+' bathroom'+(v.bath==='1'?'':'s')); if(v.furnishing) f.push(v.furnishing.toLowerCase()); if(t==='apartment'&&v.floor) f.push(v.totalfloors?('on floor '+v.floor+' of '+v.totalfloors):('on the '+v.floor+' floor')); }
    else { if(v.facing) f.push(v.facing+'-facing'); if(v.roadwidth) f.push('on a '+v.roadwidth+' ft road'); }
    if(f.length) S.push(this.cap(f.join(', '))+'.');
    if(tone!=='short'&&tone!=='factual'){ const ex=[]; if(v.park4w&&v.park4w!=='0') ex.push('car parking'); if(v.lift) ex.push('a lift'); if(v.power) ex.push('power backup'); if(v.gated||v.gatedLayout) ex.push('a gated community'); if(v.garden) ex.push('a garden'); (v.amenities||[]).slice(0,2).forEach(a=>ex.push(a.toLowerCase())); if(ex.length) S.push(this.cap('Highlights include '+ex.slice(0,4).join(', '))+'.'); }
    else if(tone==='factual'){ const ex=[]; if(v.park2w&&v.park2w!=='0') ex.push(v.park2w+' two-wheeler parking'); if(v.park4w&&v.park4w!=='0') ex.push(v.park4w+' car parking'); if(v.lift) ex.push('lift'); if(v.power) ex.push('power backup'); if(ex.length) S.push(this.cap('Includes '+ex.join(', '))+'.'); }
    if(!isRent&&t!=='plot'&&v.propStatus) S.push(v.propStatus==='Under construction'?('Currently under construction'+(v.possession?(', possession by '+v.possession):'')+'.'):'Ready to move in.');
    if(isRent&&v.availability) S.push('Available '+(/immediate/i.test(v.availability)?'immediately':v.availability.toLowerCase())+'.');
    const pr=this.fmtPrice(); if(pr) S.push(isRent?('Offered at '+pr+' per month'+(v.deposit?(' with a '+this.fmtINR(v.deposit)+' deposit'):'')+'.'):('Priced at '+pr+(v.negotiable?' (negotiable)':'')+'.'));
    if(tone==='warm') S.push('Schedule a visit to see it for yourself.');
    let out=S.join(' '); if(tone==='short') out=S.slice(0,2).join(' '); return out;
  }
  generate(tone){ this.setState({ aiState:'generating' }); clearTimeout(this._t); this._t=setTimeout(()=>{ this.setState({ desc:this.buildDesc(tone), aiState:'ready', tone, descTouched:false, descUsed:false }); }, 650); }

  deriveNearby(){
    const v=this.state.v; const base=[
      {name:'Neighbourhood school', category:'School', dist:'0.8 km'},
      {name:'Multi-speciality hospital', category:'Hospital / clinic', dist:'1.2 km'},
      {name:'Metro / bus stop', category:'Transport', dist:'0.6 km'},
      {name:'Local market', category:'Market / shopping', dist:'0.5 km'},
      {name:'Cafes & restaurants', category:'Restaurant / cafe', dist:'0.4 km'},
      {name:'Temple / landmark', category:'Temple / landmark', dist:'0.9 km'}
    ];
    if((v.views||[]).some(x=>/beach|sea|river/i.test(x))) base.push({name:'Waterfront / coast', category:'Beach / river / coast', dist:'1.6 km'});
    return base.map((b,i)=>({ ...b, id:'d'+i, hidden:false, manual:false }));
  }
  toggleNearbyHide(id){ this.setState(s=>({ nearby:s.nearby.map(n=>n.id===id?{...n,hidden:!n.hidden}:n) })); }
  setPoi(k,val){ this.setState(s=>({ poiDraft:{...(s.poiDraft||{}), [k]:val} })); }
  addPoi(){ const d=this.state.poiDraft||{}; if(!d.name) return; this.setState(s=>({ nearby:[...s.nearby, { id:'m'+Date.now(), name:d.name, category:d.cat||'Other', dist:d.note||'', hidden:false, manual:true }], poiDraft:{} })); }
  movePin(){ this.setState(s=>({ nearby:[ ...this.deriveNearby(), ...s.nearby.filter(n=>n.manual) ] })); }

    <div style={s('display:flex;align-items:center;gap:12px;margin-bottom:20px;')}>
      <div style={s('width:28px;height:28px;border-radius:50%;background:var(--navy-100);color:var(--navy-800);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--font-mono);flex:none;')}>{n}</div>
      <h2 style={s('font-size:17px;font-weight:700;color:var(--text-strong);margin:0;')}>{t}</h2>
    </div>
  ); }
  chipRow(list){ return list.map(o => React.createElement('button',{ key:o.key, type:'button', onClick:o.onClick, style:s(o.style) }, o.label)); }
  tgl(t){ return React.createElement('button',{ type:'button', onClick:t.onClick, style:s(t.track) }, React.createElement('span',{ style:s(t.knob) })); }
  sectionTitle(inner, label, R){ return (
    <div style={s('display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;')}>
      <h2 style={s('margin:0;display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;color:var(--text-strong);')}><Ico inner={inner} size={18} stroke="var(--navy-700)"/>{label}</h2>
      <button type="button" onClick={R.backToEdit} style={s(EDITLINK)}>Edit</button>
    </div>
  ); }

  rv(){
    const v=this.state.v; const { ptype, purpose, photos, pinned, aiState, desc, moreOpen, descUsed, mode, coverPhoto, nearby, poiDraft, published } = this.state;
    const isApt=ptype==='apartment', isHouse=ptype==='house', isVilla=ptype==='villa', isPlot=ptype==='plot';
    const isHV=isHouse||isVilla; const isResidence=isApt||isHV; const isSale=purpose==='sale', isRent=purpose==='rent';

    const ALLF=['locality','project','title','carpet','builtup','superbuiltup','plotarea','plotdim','roadwidth','floor','totalfloors','price','rent','deposit','minterm','lockin','maint','builder','possession','rera','ownAuthority','khata','taxref','surveyref','facing','areaUnit','water','ownership','age','conversion','videoUrl'];
    const h={}, vv={}; ALLF.forEach(n=>{ h[n]=e=>this.set(n,e.target.value); vv[n]=v[n]??''; });
    const areaField = isApt?'carpet':(isHV?'builtup':'plotarea');
    vv.areaPrimary = v[areaField] ?? '';
    h.areaPrimary = e=>this.set(areaField, e.target.value);

    const ts={}; ['apartment','house','villa','plot'].forEach(t=>ts[t]={ onClick:()=>this.setState({ptype:t}), style:this.cardStyle(ptype===t) });
    const ps={ sale:{onClick:()=>this.setState({purpose:'sale'}),style:this.segStyle(isSale)}, rent:{onClick:()=>this.setState({purpose:'rent'}),style:this.segStyle(isRent)} };
    const tg={}; ['lift','power','gated','garden','terrace','compound','servant','corner','boundary','gatedLayout','waterConn','elecConn','drainage','negotiable','negotiableRent','petsAllowed'].forEach(n=>tg[n]=this.toggle(n));
    const featureToggles = isApt
      ? [['lift','Lift'],['power','Power backup'],['gated','Gated community']].map(([n,l])=>({key:n,label:l,...this.toggle(n)}))
      : [['garden','Garden'],['terrace','Terrace'],['compound','Compound wall'],['servant','Servant room'],['gated','Gated community']].map(([n,l])=>({key:n,label:l,...this.toggle(n)}));

    const bhkOpts=this.chips('bhk',['1','2','3','4','5+'],x=>x+' BHK');
    const bathOpts=this.chips('bath',['1','2','3','4+']);
    const balconyOpts=this.chips('balcony',['0','1','2','3+']);
    const floorsOpts=this.chips('floors',['Ground','G+1','G+2','G+3','G+4+']);

            </div>
            <div style={s('width:50%;padding-right:8px;')}>
              <span style={s(FLD)}>Facing</span>
              <Select options={R.facingOpts} value={R.vv.facing} onChange={R.h.facing} />
            </div>
            <div>
              <span style={s(FLDt)}>Plot features</span>

            </div>
            <div>
              <span style={s('display:block;font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:6px;')}>Special location (optional)</span>

              <div style={s(CHIPWRAP)}>{this.chipRow(R.viewOpts)}</div>
            </div>
          </div>
        )}
      </div>

      {/* 4. Sale / Rent terms */}
      <div style={s(CARD)}>
        {this.secHead('4', R.termsTitle)}
        {R.isSale && (
          <div style={s('display:flex;flex-direction:column;gap:20px;')}>
            <div>
              <span style={s(FLD)}>Total price (₹)</span>
              <input type="text" inputMode="numeric" placeholder="e.g. 14200000" value={R.vv.price} onChange={R.h.price} style={s(BIG)} />
              <div style={s('display:flex;align-items:center;justify-content:space-between;margin-top:8px;')}>
                <span style={s('font-size:13px;color:var(--copper-600);font-weight:600;font-family:var(--font-mono);')}>{R.priceEcho}</span>
                <label style={s('display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-body);cursor:pointer;')}>{this.tgl(R.tg.negotiable)}Price negotiable</label>
              </div>
            </div>
            {R.isResidence && (
              <React.Fragment>
                <div>
                  <span style={s(FLD)}>Property status</span>
                  <div style={s(SEGWRAP+'width:320px;max-width:100%;')}>{this.chipRow(R.statusSeg)}</div>
                </div>
                {R.underConstruction && (
                  <div style={s('width:50%;padding-right:8px;')}>
                    <span style={s(FLD)}>Expected possession</span>
                    <input type="text" placeholder="e.g. Dec 2026" value={R.vv.possession} onChange={R.h.possession} style={s(TXT)} />
                  </div>
                )}
                <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;')}>
                  <div><span style={s(FLD)}>Ownership type</span><Select options={R.ownershipOpts} value={R.vv.ownership} onChange={R.h.ownership} /></div>
                  <div><span style={s(FLD)}>RERA ID (optional)</span><input type="text" placeholder="As registered" value={R.vv.rera} onChange={R.h.rera} style={s('width:100%;height:44px;padding:0 14px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-strong);')} /></div>

        {R.isRent && (
          <div style={s('display:flex;flex-direction:column;gap:20px;')}>

            <div>
              <span style={s(FLD)}>Maintenance</span>
              <div style={s(SEGWRAP+'width:260px;')}>{this.chipRow(R.maintSeg)}</div>
            </div>
            <div>
              <span style={s(FLDt)}>Available from</span>
              <div style={s(CHIPWRAP)}>{this.chipRow(R.availOpts)}</div>
            </div>
            <div style={s(ROW2)}>
              <div><span style={s(FLD)}>Minimum term (optional)</span><input type="text" placeholder="e.g. 11 months" value={R.vv.minterm} onChange={R.h.minterm} style={s(TXT)} /></div>

            </div>
            <div>
              <span style={s(FLDt)}>Preferred tenants (optional)</span>
              <div style={s(CHIPWRAP)}>{this.chipRow(R.tenantOpts)}</div>
            </div>
            <label style={s('display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-body);cursor:pointer;')}>{this.tgl(R.tg.petsAllowed)}Pets allowed</label>

      {/* 5. Optional details */}
      <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;')}>
        <button type="button" onClick={R.onMore} style={s('width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;background:transparent;border:none;cursor:pointer;text-align:left;')}>
          <div style={s('display:flex;align-items:center;gap:12px;')}>
            <div style={s('width:28px;height:28px;border-radius:50%;background:var(--navy-100);color:var(--navy-800);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--font-mono);flex:none;')}>5</div>
            <div>
              <h2 style={s('font-size:17px;font-weight:700;color:var(--text-strong);margin:0;')}>{R.optionalTitle}</h2>
              <p style={s('margin:3px 0 0;font-size:12.5px;color:var(--text-muted);')}>{R.optionalSub}</p>
            </div>
          </div>
          <span style={s('color:var(--text-muted);transition:transform .2s;transform:'+R.chevronRotate+';display:flex;')}><Ico inner={I.chevDown} size={20}/></span>
        </button>
        {R.moreOpen && (
          <div style={s('padding:4px 26px 26px;')}>
            <div style={s('height:1px;background:var(--border);margin-bottom:22px;')}></div>
            {R.isResidence && (
              <div style={s('display:flex;flex-direction:column;gap:22px;')}>
                {R.isApt && (
                  <div style={s(ROW2)}>
                    <div><span style={s(FLD)}>Built-up area (optional)</span><input type="text" inputMode="numeric" placeholder="sq.ft" value={R.vv.builtup} onChange={R.h.builtup} style={s(NUM)} /></div>
                    <div><span style={s(FLD)}>Super built-up (optional)</span><input type="text" inputMode="numeric" placeholder="sq.ft" value={R.vv.superbuiltup} onChange={R.h.superbuiltup} style={s(NUM)} /></div>
                  </div>
                )}
                {R.isHV && (
                  <div style={s('width:50%;padding-right:8px;')}><span style={s(FLD)}>Plot area (optional)</span><input type="text" inputMode="numeric" placeholder="sq.ft" value={R.vv.plotarea} onChange={R.h.plotarea} style={s(NUM)} /></div>
                )}
                <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:22px;')}>
                  <div><span style={s(FLDt)}>2-wheeler parking</span><div style={s(CHIPWRAP)}>{this.chipRow(R.park2wOpts)}</div></div>
                  <div><span style={s(FLDt)}>4-wheeler parking</span><div style={s(CHIPWRAP)}>{this.chipRow(R.park4wOpts)}</div></div>
                </div>
                {R.isHV && (
                  <div style={s('width:50%;padding-right:8px;')}><span style={s(FLD)}>Water source</span><Select options={R.waterOpts} value={R.vv.water} onChange={R.h.water} /></div>
                )}
                <div>
                  <span style={s(FLDt)}>Features</span>
                  <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:10px;')}>
                    {R.featureToggles.map(t=>(
                      <div key={t.key} style={s('display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--canvas-100);border:1px solid var(--border);border-radius:10px;')}><span style={s('font-size:14px;color:var(--text-strong);font-weight:500;')}>{t.label}</span>{this.tgl(t)}</div>
                    ))}
                  </div>
                </div>
                <div>
                  <span style={s(FLDt)}>{R.amenityLabel}</span>
                  <div style={s(CHIPWRAP)}>{this.chipRow(R.amenityList)}</div>
                </div>
                {R.isApt && (
                  <div style={s(ROW2)}>
                    <div><span style={s(FLD)}>Maintenance charge (optional)</span><input type="text" inputMode="numeric" placeholder="₹ / month" value={R.vv.maint} onChange={R.h.maint} style={s(NUM)} /></div>
                    <div><span style={s(FLD)}>Builder / developer (optional)</span><input type="text" placeholder="e.g. Prestige Group" value={R.vv.builder} onChange={R.h.builder} style={s(TXT)} /></div>
                  </div>
                )}
                {R.isHV && (
                  <div>
                    <span style={s('display:block;font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:6px;')}>Special location (optional)</span>
                    <span style={s('display:block;font-size:12px;color:var(--text-muted);margin-bottom:10px;')}>Broker-declared. Shown as your description, not verified.</span>
                    <div style={s(CHIPWRAP)}>{this.chipRow(R.viewOpts)}</div>
                  </div>

              </div>
            )}
            {R.isPlot && (

                <div style={s(ROW2)}>
                  <div><span style={s(FLD)}>Ownership type</span><Select options={R.ownershipOpts} value={R.vv.ownership} onChange={R.h.ownership} /></div>
                  <div><span style={s(FLD)}>Conversion status</span><Select options={R.conversionOpts} value={R.vv.conversion} onChange={R.h.conversion} /></div>
                </div>
                <div style={s(ROW2)}>
                  <div><span style={s(FLD)}>Approving authority (optional)</span><input type="text" placeholder="e.g. BDA / DTCP" value={R.vv.ownAuthority} onChange={R.h.ownAuthority} style={s(TXT)} /></div>
                  <div><span style={s(FLD)}>Khata / e-Khata type (optional)</span><input type="text" placeholder="e.g. A Khata" value={R.vv.khata} onChange={R.h.khata} style={s(TXT)} /></div>
                </div>
                <div style={s(ROW2)}>
                  <div><span style={s(FLD)}>Property tax / PID / SAS ref (optional)</span><input type="text" placeholder="Reference number" value={R.vv.taxref} onChange={R.h.taxref} style={s('width:100%;height:44px;padding:0 14px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-strong);')} /></div>
                  <div><span style={s(FLD)}>Survey / plot / authority ref (optional)</span><input type="text" placeholder="Reference number" value={R.vv.surveyref} onChange={R.h.surveyref} style={s('width:100%;height:44px;padding:0 14px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-strong);')} /></div>

                <div style={s('width:50%;padding-right:8px;')}><span style={s(FLD)}>RERA ID (optional)</span><input type="text" placeholder="As registered" value={R.vv.rera} onChange={R.h.rera} style={s('width:100%;height:44px;padding:0 14px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-strong);')} /></div>

            <button key={t.key} type="button" onClick={t.onAdd} style={s(t.emptyStyle)}>+</button>
          ))}
        </div>

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>

        <span style={s(FLD)}>Video link (optional)</span>
        <input type="url" placeholder="Paste a YouTube or Instagram link" value={R.vv.videoUrl} onChange={R.h.videoUrl} style={s(TXT)} />
        <span style={s(HINT)}>Optional: add a YouTube or Instagram video link. Buyers can view it on the listing.</span>
        {R.hasVideo && (
          <div style={s('margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--trust-verified-fg);background:var(--trust-verified-bg);padding:5px 11px;border-radius:8px;')}><Ico inner={I.play} fill="currentColor" stroke="none" size={13}/>Video added · {R.videoHost}</div>
        )}

        <div style={s('height:1px;background:var(--border);margin:22px 0;')}></div>

        <span style={s(FLDt)}>Map pin</span>

          <div style={s('position:absolute;top:38%;left:0;right:0;height:14px;background:rgba(255,255,255,0.6);transform:rotate(-4deg);')}></div>
          <div style={s('position:absolute;top:0;bottom:0;left:58%;width:11px;background:rgba(255,255,255,0.6);transform:rotate(3deg);')}></div>
          {R.pinned && <div style={s('position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);')}><Ico inner={I.pinFill} fill="var(--copper-500)" stroke="#fff" sw={1.5} size={34}/></div>}
          <div style={s('position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:center;')}>
            <button type="button" onClick={R.togglePin} style={s(R.pinBtnStyle)}>{R.pinBtnLabel}</button>
          </div>
        </div>

        {R.pinned && (
          <div style={s('margin-top:18px;background:var(--canvas-100);border:1px solid var(--border);border-radius:12px;padding:16px 18px;')}>
            <div style={s('display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;')}>
              <span style={s('font-size:13px;font-weight:700;color:var(--text-strong);')}>Nearby places</span>
              <button type="button" onClick={R.movePin} style={s('display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy-800);background:var(--paper);border:1px solid var(--border-strong);border-radius:7px;padding:5px 10px;cursor:pointer;')}><Ico inner={I.pin} size={13}/>Move pin</button>
            </div>
            <p style={s('margin:0 0 6px;font-size:12px;color:var(--text-muted);line-height:1.5;')}>Derived from the map after location is pinned. Move the pin if these nearby places look wrong. You can also add a local landmark if buyers commonly ask about it.</p>
            <div>
              {R.nearbyRows.map(n=>(
                <div key={n.key} style={s(n.rowStyle)}>
                  <span style={s('width:28px;height:28px;border-radius:8px;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;flex:none;')}><Ico inner={I.pin} size={15}/></span>
                  <div style={s('flex:1;min-width:0;')}>
                    <div style={s('display:flex;align-items:center;gap:7px;')}><span style={s(n.nameStyle)}>{n.name}</span>{n.manual && <span style={s('font-size:9.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ochre-600);background:var(--ochre-50);padding:1px 6px;border-radius:4px;')}>Broker-added</span>}</div>
                    <div style={s('font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:1px;')}>{n.meta}</div>
                  </div>
                  <button type="button" onClick={n.onToggle} style={s('font-size:12px;font-weight:600;color:var(--text-muted);background:transparent;border:none;cursor:pointer;flex:none;')}>{n.toggleLabel}</button>
                </div>
              ))}
            </div>
            <div style={s('border-top:1px solid var(--border);margin-top:6px;padding-top:14px;')}>
              <span style={s('display:block;font-size:12px;font-weight:600;color:var(--text-strong);margin-bottom:9px;')}>Add a local landmark (optional)</span>
              <div style={s('display:flex;gap:8px;flex-wrap:wrap;align-items:center;')}>
                <input type="text" placeholder="Place name" value={R.poiVals.name} onChange={R.hPoi.name} style={s('flex:2;min-width:140px;height:38px;padding:0 12px;background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-sans);font-size:13px;color:var(--text-strong);')} />
                <div style={s('flex:1.4;min-width:130px;')}><Select options={R.poiCatOpts} value={R.poiVals.cat} onChange={R.hPoi.cat} /></div>
                <input type="text" placeholder="Distance / note" value={R.poiVals.note} onChange={R.hPoi.note} style={s('flex:1;min-width:110px;height:38px;padding:0 12px;background:var(--paper);border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-sans);font-size:13px;color:var(--text-strong);')} />
                <Button variant="outline" size="sm" onClick={R.addPoi}>Add place</Button>
              </div>
              <span style={s('display:block;font-size:11.5px;color:var(--text-muted);margin-top:9px;')}>Manually added places are shown as broker-added, not platform-verified.</span>
            </div>
          </div>
        )}
      </div>

      {/* 7. Description + AI */}
      <div style={s(CARD)}>
        {this.secHead('7','Description')}
        {R.aiIdle && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:26px 24px;text-align:center;background:var(--canvas-100);')}>
            <div style={s('width:38px;height:38px;border-radius:10px;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;')}><Ico inner={I.sparkle} stroke="var(--copper-500)" size={20}/></div>
            <p style={s('margin:0 0 16px;font-size:14px;color:var(--text-body);line-height:1.55;max-width:380px;margin-left:auto;margin-right:auto;')}>Draft a description from the details you've already entered. Every word stays editable — nothing is invented.</p>
            <div style={s('display:flex;gap:10px;justify-content:center;')}>
              <Button variant="accent" onClick={R.doGenerate}>Generate description</Button>
              <Button variant="ghost" onClick={R.editManual}>Write it myself</Button>
            </div>
          </div>
        )}
        {R.aiGenerating && (
          <div style={s('border:1.5px dashed var(--border-strong);border-radius:12px;padding:38px 24px;text-align:center;background:var(--canvas-100);display:flex;flex-direction:column;align-items:center;gap:14px;')}>

          </div>
        )}
        {R.aiReady && (
          <div>
            <textarea value={R.desc} onChange={R.onDesc} placeholder="Write a short, factual description…" style={s('width:100%;min-height:148px;padding:14px 16px;background:var(--input-bg);border:1px solid var(--border-strong);border-radius:10px;font-size:14.5px;line-height:1.6;color:var(--text-strong);resize:vertical;')}></textarea>
            <div style={s('display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;')}>
              <Button variant="outline" size="sm" onClick={R.doRegen}>Regenerate</Button>
              <Button variant="outline" size="sm" onClick={R.doShorter}>Make shorter</Button>
              <Button variant="outline" size="sm" onClick={R.doWarmer}>Make warmer</Button>
              <Button variant="outline" size="sm" onClick={R.doFactual}>More factual</Button>
              <span style={s('flex:1;')}></span>
              <Button variant="primary" size="sm" onClick={R.useDesc}>{R.useDescLabel}</Button>

            <p style={s('margin:12px 0 0;font-size:12px;color:var(--text-muted);line-height:1.5;display:flex;align-items:flex-start;gap:6px;')}><Ico inner={I.check} stroke="var(--evergreen-600)" sw={2.2} size={14} style={{marginTop:'1px'}}/>Generated only from details you entered. ReTrends never invents facts or amenities.</p>
          </div>
        )}
      </div>
    </div>
  ); }

  /* ---------------- edit: preview rail ---------------- */

            <div style={s('font-size:16px;font-weight:700;color:var(--text-strong);line-height:1.3;margin-bottom:4px;')}>{R.previewTitle}</div>
            <div style={s('display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-muted);margin-bottom:12px;')}><Ico inner={I.pin} size={13}/>{R.previewLocText}</div>
            <div style={s('display:flex;align-items:baseline;gap:8px;margin-bottom:14px;')}>
              <span style={s('font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--navy-900);')}>{R.priceDisplay}</span>
              {R.hasPerSqft && <span style={s('font-family:var(--font-mono);font-size:12px;color:var(--text-muted);')}>{R.perSqft}</span>}
            </div>
            {R.hasSpecs && (
              <div style={s('display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--border);')}>

              </div>

            {R.noSpecs && <div style={s('padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted);')}>Add details to fill out the preview.</div>}
          </div>
        </div>
      </div>
      {R.showStrength && (
        <div style={s('background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);')}>

          <div style={s('margin-top:12px;display:flex;flex-direction:column;gap:8px;')}>
            {R.confirmChips.map(c=>(<div key={c.key} style={s('display:flex;align-items:center;gap:8px;')}><span style={s(c.dot)}>{c.check}</span><span style={s('font-size:12.5px;color:'+c.textColor+';')}>{c.label}</span></div>))}
          </div>
        </div>
      )}
      <div style={s('font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:5px;')}><Ico inner={I.info} size={12}/>{R.derivedNote}</div>

  /* ---------------- review: listing-detail style ---------------- */
  reviewView(R){ return (
    <React.Fragment>
      {R.notPublished && (
        <React.Fragment>
          <div style={s('display:flex;align-items:center;gap:10px;background:var(--navy-100);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:18px;')}>
            <Ico inner={I.eye} stroke="var(--navy-700)" size={17}/>
            <span style={s('font-size:13px;color:var(--navy-800);font-weight:500;line-height:1.45;')}>A preview of your public listing — this is how buyers will see it once published. Nothing here is publicly verified; it shows what you entered.</span>
          </div>
          <div style={s('display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:28px;align-items:start;')}>

                    <div style={s('position:absolute;inset:0;background:linear-gradient(160deg,var(--canvas-100),var(--canvas-200));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 24px;')}>

                    </div>
                  )}
                  <div style={s('position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--navy-800);background:rgba(255,255,255,0.92);padding:5px 11px;border-radius:9999px;box-shadow:var(--shadow-xs);')}><Ico inner={I.shield} sw={2.2} size={13}/>Listed by verified broker</div>
                  <button type="button" onClick={R.backToEdit} style={s('position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy-800);background:rgba(255,255,255,0.92);border:none;padding:7px 12px;border-radius:9999px;cursor:pointer;box-shadow:var(--shadow-xs);')}><Ico inner={I.pencil} size={13}/>Edit media</button>
                  {R.hasVideo && <div style={s('position:absolute;bottom:14px;left:16px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;background:rgba(14,22,38,0.6);backdrop-filter:blur(4px);padding:5px 11px;border-radius:9999px;font-weight:600;')}><Ico inner={I.play} fill="#fff" stroke="none" size={12}/>Video · {R.videoHost}</div>}
                  {R.hasPhotos && <div style={s('position:absolute;bottom:14px;right:16px;padding:4px 11px;border-radius:9999px;background:rgba(14,22,38,0.72);color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:500;')}>{R.photoCountLabel}</div>}
                </div>
                {R.hasPhotos && (
                  <div style={s('display:flex;gap:10px;flex-wrap:wrap;')}>
                    {R.reviewThumbs.map(th=>(<div key={th.key} style={s(th.style)}>{th.isCover && <span style={s('position:absolute;bottom:4px;left:4px;font-size:8.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;background:var(--copper-500);color:#fff;padding:1px 5px;border-radius:4px;')}>Cover</span>}</div>))}
                    {R.hasVideo && <div style={s('width:92px;height:66px;flex:none;border-radius:8px;border:1px solid var(--border);background:var(--navy-900);display:flex;align-items:center;justify-content:center;')}><Ico inner={I.play} fill="#fff" stroke="none" size={22}/></div>}
                  </div>

              </div>

              {/* Summary */}
              <div style={s(CARD)}>
                <div style={s('display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;')}>
                  <div style={s('flex:1 1 320px;min-width:0;')}>
                    <div style={s('display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;')}>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--navy-800);background:var(--navy-100);padding:4px 10px;border-radius:9999px;')}>{R.kindLabel}</span>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--copper-600);background:var(--accent-tint);padding:4px 10px;border-radius:9999px;')}>{R.purposeLabel}</span>
                      <span style={s('font-size:11.5px;font-weight:600;color:var(--text-body);background:var(--grey-100);padding:4px 10px;border-radius:9999px;')}>Listed by verified broker</span>

                  <div style={s('flex:none;text-align:right;')}>

                    {R.hasPerSqft && <div style={s('font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:5px;')}>{R.perSqft}</div>}

                {R.noDetails && <p style={s('margin:0;font-size:13.5px;color:var(--text-muted);')}>Add property details and they'll appear here.</p>}

              {/* About */}
              <div style={s(CARD)}>
                {this.sectionTitle(I.fileCheck,'About this property',R)}

              <div style={s(CARD)}>
                {this.sectionTitle(I.pin,'Location & essentials',R)}

                {R.reviewNoNearby && <p style={s('margin:0;font-size:13px;color:var(--text-muted);')}>Pin the location to show nearby schools, transport and essentials.</p>}

                  <span style={s('display:inline-flex;align-items:center;gap:6px;')}><Ico inner={I.users} size={13}/>Listed by verified broker</span>

            {/* Right rail */}
            <div style={s('position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;')}>
              <div style={s('font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;')}>Editor view · only you see this</div>

        for (const s of cs.boxShadow.split(/,(?![^(]*[)])/)) {
          const t = s.trim();
          const m = t.match(/^(rgba?[(][^)]+[)]) (-?[0-9.]+px) (-?[0-9.]+px) ([0-9.]+px) -?[0-9.]+px$/);
          if (m && parseFloat(m[4]) > 0) outs.push('drop-shadow(' + m[2] + ' ' + m[3] + ' ' + m[4] + ' ' + m[1] + ')');
          else kept.push(t);
        }
        if (outs.length) {
          el.style.setProperty('filter', outs.join(' '), 'important');
          el.style.setProperty('box-shadow', kept.join(', ') || 'none', 'important');
        }
      }

      const mask = cs.maskImage && cs.maskImage !== 'none' ? cs.maskImage : cs.webkitMaskImage;
      if (mask && mask !== 'none' && cs.filter === 'none') el.style.setProperty('filter', 'opacity(1)', 'important');
    }
  } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);
})();
</script>
