<!-- @dsCard group="Buyer" viewport="1200x1100" name="Choose listing journey (selector)" subtitle="First screen after 'New listing' — three journey cards routing into the residential / commercial / agricultural forms. Responsive, one CTA per card, lifecycle hint." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReTrends — Create a new listing</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--canvas-100); }
  body { font-family: var(--font-sans); color: var(--text-body); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  .rt-stage { max-width: 1080px; margin: 0 auto; padding: 52px 24px 96px; }
  .rt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
  .rt-lifecycle-steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  @media (max-width: 820px) {
    .rt-stage { padding: 34px 18px 72px; }
    .rt-grid { grid-template-columns: 1fr; gap: 14px; }
  }
  @media (max-width: 620px) {
    .rt-nav-links { display: none !important; }
    .rt-header { padding: 0 18px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
/* ---- Lucide subset (raw SVG paths) ---- */
const I = {
  pin:`<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>`,
  house:`<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>`,
  building:`<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>`,
  sprout:`<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>`,
  arrow:`<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>`,
  info:`<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>`,
  help:`<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>`,
  chevRight:`<path d="m9 18 6-6-6-6"/>`,
};

/* CSS-string -> React style object */
function s(str){ const o={}; (str||'').split(';').forEach(p=>{ const i=p.indexOf(':'); if(i<0) return; const k=p.slice(0,i).trim(); const v=p.slice(i+1).trim(); if(!k) return; o[k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=v; }); return o; }

function Ico({ inner, size=20, stroke='currentColor', fill='none', sw=2, style }){
  return React.createElement('svg', { width:size, height:size, viewBox:'0 0 24 24', fill, stroke, strokeWidth:sw, strokeLinecap:'round', strokeLinejoin:'round', style:Object.assign({flex:'none',display:'block'}, style||{}), dangerouslySetInnerHTML:{ __html: inner } });
}

const JOURNEYS = [
  {
    key:'residential', icon:I.house,
    label:'Residential', tag:'Homes & living space',
    desc:'For homes, flats, villas and residential plots.',
    examples:['Apartment','House','Villa','Residential plot'],
    cta:'Create residential listing',
    href:'create-residential-listing.html',
  },
  {
    key:'commercial', icon:I.building,
    label:'Commercial', tag:'Business & investment',
    desc:'For shops, offices, buildings, warehouses and commercial land.',
    examples:['Shop / Office','Building','Warehouse','Commercial land'],
    cta:'Create commercial listing',
    href:'create-commercial-listing.html',
  },
  {
    key:'agri', icon:I.sprout,
    label:'Agricultural land', tag:'Farmland & plantations',
    desc:'For farmland and agricultural plots.',
    examples:['Farmland','Plantation land','Agricultural plot'],
    cta:'Create agricultural listing',
    href:'create-agricultural-listing.html',
  },
];
const JMAP = Object.fromEntries(JOURNEYS.map(j=>[j.key,j]));
const LS_KEY = 'retrends:lastJourney';

class ChooseJourney extends React.Component {
  constructor(props){
    super(props);
    let last=null; try{ last=localStorage.getItem(LS_KEY); }catch(e){}
    this.state = { hover:null, launching:null, last };
  }

  launch(key){
    try{ localStorage.setItem(LS_KEY, key); }catch(e){}
    this.setState({ launching:key });
    clearTimeout(this._t);
    this._t = setTimeout(()=>{ window.location.href = JMAP[key].href; }, 950);
  }

  header(){
    return (
      <div className="rt-header" style={s('height:64px;background:var(--paper);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;')}>
        <div style={s('display:flex;align-items:center;gap:38px;')}>
          <div style={s('display:flex;align-items:center;gap:10px;')}>
            <span style={s('width:30px;height:30px;border-radius:8px;background:var(--navy-800);display:flex;align-items:center;justify-content:center;')}><Ico inner={I.pin} stroke="var(--copper-400)" sw={2.2} size={17}/></span>
            <div style={s('line-height:1.05;')}>
              <div style={s('font-size:17px;font-weight:800;letter-spacing:-0.02em;')}><span style={s('color:var(--copper-500);')}>Re</span><span style={s('color:var(--navy-800);')}>Trends</span></div>
              <div style={s('font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);font-weight:600;')}>Real estate trends</div>
            </div>
          </div>
          <div className="rt-nav-links" style={s('display:flex;align-items:center;gap:26px;font-size:14px;font-weight:500;color:var(--text-muted);')}>
            <span>Discover</span><span>Schools</span><span>Trends</span><span>Broker dashboard</span>
          </div>
        </div>
        <div style={s('display:flex;align-items:center;gap:14px;')}>
          <span style={s('font-size:14px;font-weight:600;color:var(--navy-800);')}>New listing</span>
          <span style={s('width:34px;height:34px;border-radius:50%;background:var(--navy-100);color:var(--navy-800);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--font-mono);')}>TE</span>
        </div>
      </div>
    );
  }

  card(j){
    const active = this.state.hover===j.key || this.state.focus===j.key;
    const focused = this.state.focus===j.key;
    return (
      <div key={j.key}
        onMouseEnter={()=>this.setState({hover:j.key})}
        onMouseLeave={()=>this.setState({hover:null})}
        onFocus={()=>this.setState({focus:j.key})}
        onBlur={()=>this.setState({focus:null})}
        onClick={()=>this.launch(j.key)}
        role="button" tabIndex={0} aria-label={j.cta}
        onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.launch(j.key);} }}
        style={s('position:relative;display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1.5px solid '+(active?'var(--navy-800)':'var(--border)')+';border-radius:18px;padding:26px 24px;cursor:pointer;outline:none;box-shadow:'+(focused?'0 0 0 3px var(--ring), var(--shadow-lg)':(active?'var(--shadow-lg)':'var(--shadow-sm)'))+';transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s,border-color .18s;transform:'+(active?'translateY(-3px)':'none')+';')}>
        {this.state.last===j.key && (
          <span style={s('position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--copper-600);background:var(--accent-tint);padding:3px 8px;border-radius:6px;')}>Last used</span>
        )}
        <span style={s('width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;transition:all .18s;border:1px solid '+(active?'transparent':'var(--border)')+';background:'+(active?'var(--navy-800)':'var(--navy-100)')+';')}>
          <Ico inner={j.icon} size={26} sw={1.7} stroke={active?'var(--copper-400)':'var(--navy-800)'}/>
        </span>
        <div>
          <div style={s('font-size:12px;letter-spacing:0.05em;text-transform:uppercase;font-weight:700;color:var(--text-muted);margin-bottom:5px;')}>{j.tag}</div>
          <div style={s('font-size:22px;font-weight:700;color:var(--text-strong);line-height:1.15;')}>{j.label}</div>
        </div>
        <p style={s('margin:0;font-size:14px;color:var(--text-body);line-height:1.55;')}>{j.desc}</p>
        <div style={s('margin-top:auto;')}>
          <div style={s('font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:8px;')}>Includes</div>
          <div style={s('display:flex;flex-wrap:wrap;gap:6px;')}>
            {j.examples.map(x=>(
              <span key={x} style={s('font-size:12px;font-weight:500;color:var(--text-body);background:var(--canvas-200);padding:4px 10px;border-radius:9999px;white-space:nowrap;')}>{x}</span>
            ))}
          </div>
        </div>
        <button type="button" onClick={(e)=>{e.stopPropagation();this.launch(j.key);}}
          style={s('display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:600;transition:all .15s;background:'+(active?'var(--navy-800)':'var(--navy-100)')+';color:'+(active?'#fff':'var(--navy-800)')+';')}>
          {j.cta}<Ico inner={I.arrow} size={16} sw={2.2}/>
        </button>
      </div>
    );
  }

  helper(){
    const steps=['Create listing','Save draft','Submit for review','Pending admin approval'];
    return (
      <div style={s('display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--border);padding-top:26px;margin-top:38px;')}>
        <div style={s('display:flex;align-items:flex-start;gap:10px;')}>
          <Ico inner={I.help} size={17} stroke="var(--grey-400)" style={{marginTop:'1px'}}/>
          <p style={s('margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.55;max-width:72ch;')}>
            <strong style={s('color:var(--text-body);')}>Not sure which to pick?</strong> Go by who buys it — a family home is <em style={s('font-style:normal;color:var(--navy-800);font-weight:600;')}>Residential</em>, a shop or office is <em style={s('font-style:normal;color:var(--navy-800);font-weight:600;')}>Commercial</em>, open farmland is <em style={s('font-style:normal;color:var(--navy-800);font-weight:600;')}>Agricultural</em>. You can change it before submitting.
          </p>
        </div>
        <div className="rt-lifecycle-steps">
          <span style={s('font-size:11.5px;font-weight:600;color:var(--text-muted);margin-right:2px;')}>What happens next:</span>
          {steps.map((st,i)=>(
            <React.Fragment key={st}>
              <span style={s('font-size:11.5px;font-weight:600;color:'+(i===0?'var(--navy-800)':'var(--text-muted)')+';background:'+(i===0?'var(--navy-100)':'transparent')+';padding:'+(i===0?'3px 9px':'3px 0')+';border-radius:6px;white-space:nowrap;')}>{st}</span>
              {i<steps.length-1 && <Ico inner={I.chevRight} size={13} stroke="var(--grey-300)"/>}
            </React.Fragment>
          ))}
        </div>
        <p style={s('margin:0;font-size:12px;color:var(--text-muted);line-height:1.5;')}>Listings aren’t published instantly — every listing goes through review before it’s visible to buyers.</p>
      </div>
    );
  }

  overlay(){
    const j=JMAP[this.state.launching]; if(!j) return null;
    return (
      <div style={s('position:fixed;inset:0;z-index:60;background:rgba(246,245,242,0.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease both;')}>
        <div style={s('display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;animation:pop .26s ease both;')}>
          <div style={s('position:relative;width:78px;height:78px;')}>
            <span style={s('position:absolute;inset:0;border:3px solid var(--navy-100);border-top-color:var(--navy-800);border-radius:50%;animation:spin .8s linear infinite;')}></span>
            <span style={s('position:absolute;inset:16px;background:var(--navy-800);border-radius:16px;display:flex;align-items:center;justify-content:center;')}><Ico inner={j.icon} size={24} sw={1.7} stroke="var(--copper-400)"/></span>
          </div>
          <div>
            <div style={s('font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--navy-900);letter-spacing:-0.01em;margin-bottom:4px;')}>Opening the {j.label.toLowerCase()} form…</div>
            <div style={s('font-size:13.5px;color:var(--text-muted);')}>We’ll only ask for {j.label.toLowerCase()} details.</div>
          </div>
        </div>
      </div>
    );
  }

  render(){
    return (
      <div style={s('min-height:100vh;background:var(--canvas-100);font-family:var(--font-sans);color:var(--text-body);')}>
        {this.header()}
        <div className="rt-stage">
          <div style={s('text-align:center;max-width:640px;margin:0 auto 40px;')}>
            <div style={s('font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--copper-500);font-weight:700;margin-bottom:12px;')}>New listing</div>
            <h1 style={s('font-family:var(--font-serif);font-size:clamp(27px,5vw,38px);font-weight:600;letter-spacing:-0.02em;color:var(--navy-900);margin:0 0 12px;line-height:1.12;')}>Create a new listing</h1>
            <p style={s('margin:0;font-size:clamp(14.5px,2.4vw,16px);color:var(--text-muted);line-height:1.55;')}>What kind of property are you listing? Pick a journey to start — we’ll only ask for the details that actually matter for that property.</p>
          </div>

          <div className="rt-grid">
            {JOURNEYS.map(j=>this.card(j))}
          </div>

          {this.helper()}
        </div>
        {this.overlay()}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChooseJourney />);
</script>
</body>
</html>
