<!-- @startingPoint section="Buyer" subtitle="Buyer-facing area intelligence page — full / partial / low-confidence / no-snapshot / error / loading states" viewport="1200x1640" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReTrends — Area Insights</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--text-strong); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }
  a { color: inherit; }

  .rt-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .rt-two     { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .rt-nearby  { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .rt-nearby-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    text-decoration: none; padding: 16px 18px;
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    transition: box-shadow var(--dur-normal) var(--ease-standard), transform var(--dur-normal) var(--ease-standard), border-color var(--dur-fast);
  }
  .rt-nearby-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-strong); }
  @media (max-width: 920px) {
    .rt-metrics { grid-template-columns: repeat(2, 1fr); }
    .rt-nearby  { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .rt-metrics, .rt-two, .rt-nearby { grid-template-columns: 1fr; }
  }

  /* Skeleton shimmer */
  .rt-skel {
    background: linear-gradient(100deg, var(--surface-subtle) 30%, var(--stone-300) 50%, var(--surface-subtle) 70%);
    background-size: 200% 100%;
    animation: rt-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes rt-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Demo state switcher — NOT part of the buyer UI */
  .rt-states {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 4px;
    background: var(--navy-900); border-radius: var(--radius-full);
    padding: 5px; box-shadow: var(--shadow-xl);
  }
  .rt-states .lbl {
    font-size: 10px; font-weight: 700; letter-spacing: var(--tracking-caps);
    text-transform: uppercase; color: rgba(255,255,255,0.45); padding: 0 10px 0 8px;
  }
  .rt-states button {
    font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
    color: rgba(255,255,255,0.7); background: transparent; border: none;
    padding: 7px 13px; border-radius: var(--radius-full); cursor: pointer;
    transition: background var(--dur-fast), color var(--dur-fast); white-space: nowrap;
  }
  .rt-states button:hover { color: #fff; }
  .rt-states button.on { background: var(--paper); color: var(--navy-900); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="BuyerArea.jsx"></script>
<script type="text/babel">
  const STATES = [
    ["full", "Full data"],
    ["partial", "Partial"],
    ["low", "Low confidence"],
    ["empty", "No snapshot"],
    ["error", "API error"],
    ["loading", "Loading"],
  ];

  function App() {
    const [state, setState] = React.useState("full");
    const [nonce, setNonce] = React.useState(0); // lets "Try again" re-trigger a load

    // "Try again" briefly shows the skeleton, then resolves to full data.
    const onRetry = () => {
      setState("loading");
      setTimeout(() => setState("full"), 1100);
    };

    return (
      <div>
        <window.RTBuyerArea key={state + nonce} state={state} onRetry={onRetry} />
        <div className="rt-states">
          <span className="lbl">Mock state</span>
          {STATES.map(([k, label]) => (
            <button key={k} className={state === k ? "on" : ""} onClick={() => { setState(k); setNonce((n) => n + 1); }}>{label}</button>
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
