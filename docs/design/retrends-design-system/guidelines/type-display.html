<!-- @dsCard group="Type" viewport="700x210" name="Fraunces display" subtitle="Editorial serif for hero headlines & big statements" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-serif); background:var(--background); padding:24px; color:var(--text-strong); }
  .spec { font-family:var(--font-sans); font-size:10px; color:var(--text-muted); letter-spacing:var(--tracking-caps); text-transform:uppercase; margin:0 0 2px; }
  .line { margin:0 0 14px; letter-spacing:var(--tracking-tight); line-height:1.1; }
</style>
</head>
<body>
  <p class="spec">Fraunces · 60 / 700</p>
  <p class="line" style="font-size:48px;font-weight:700">Buy with clarity.</p>
  <p class="spec">Fraunces · 36 / 600</p>
  <p class="line" style="font-size:32px;font-weight:600">Trust, mapped to the metre.</p>
  <p class="spec">Fraunces · 24 / 400 italic</p>
  <p class="line" style="font-size:22px;font-weight:400;font-style:italic">India's first real-estate trends portal</p>
</body>
</html>
