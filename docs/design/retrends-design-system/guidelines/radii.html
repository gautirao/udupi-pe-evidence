<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="xs controls → xl hero cards → full pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--background); padding:24px; }
  .row { display:flex; gap:16px; }
  .col { text-align:center; }
  .box { width:74px; height:56px; background:var(--paper); border:1px solid var(--border-strong); box-shadow:var(--shadow-xs); }
  .tok { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="tok">xs · 4</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="tok">md · 8</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="tok">lg · 12</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="tok">xl · 16</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="tok">2xl · 24</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-full)"></div><div class="tok">full</div></div>
  </div>
</body>
</html>
