<!-- @dsCard group="Type" viewport="700x170" name="Geist Mono — data" subtitle="Prices, areas & metrics always set in mono" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-mono); background:var(--background); padding:24px; color:var(--text-strong); }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .stat { background:var(--paper); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 18px; box-shadow:var(--shadow-xs); }
  .k { font-family:var(--font-sans); font-size:11px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:var(--tracking-caps); margin-bottom:6px; }
  .v { font-size:24px; font-weight:600; }
  .up { color:var(--positive); font-size:13px; font-weight:500; }
</style>
</head>
<body>
  <div class="row">
    <div class="stat"><div class="k">Avg. price</div><div class="v">₹1.42 Cr</div></div>
    <div class="stat"><div class="k">Per sq.ft</div><div class="v">₹8,750</div></div>
    <div class="stat"><div class="k">YoY trend</div><div class="v">+12.4% <span class="up">▲</span></div></div>
    <div class="stat"><div class="k">Listings</div><div class="v">428</div></div>
  </div>
</body>
</html>
