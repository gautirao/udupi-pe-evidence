<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Soft shadows on warm paper — rest → hover lift" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--background); padding:30px 24px; }
  .row { display:flex; gap:26px; }
  .col { text-align:center; }
  .box { width:96px; height:64px; background:var(--paper); border-radius:var(--radius-lg); }
  .tok { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="tok">xs</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="tok">sm</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="tok">md</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="tok">lg · hover</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="tok">xl · modal</div></div>
  </div>
</body>
</html>
