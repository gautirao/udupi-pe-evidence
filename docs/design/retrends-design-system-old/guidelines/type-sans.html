<!-- @dsCard group="Type" viewport="700x260" name="Plus Jakarta Sans" subtitle="UI & body scale — headings, labels, paragraphs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--background); padding:24px; color:var(--text-strong); }
  .item { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--border); }
  .spec { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); width:120px; flex:none; }
  .sample { line-height:1.2; }
</style>
</head>
<body>
  <div class="item"><span class="spec">36 / 700</span><span class="sample" style="font-size:30px;font-weight:700;letter-spacing:-0.02em">Find your perfect home</span></div>
  <div class="item"><span class="spec">24 / 600</span><span class="sample" style="font-size:22px;font-weight:600">Trending localities in Bangalore</span></div>
  <div class="item"><span class="spec">18 / 600</span><span class="sample" style="font-size:18px;font-weight:600">3 BHK in Whitefield</span></div>
  <div class="item"><span class="spec">16 / 400</span><span class="sample" style="font-size:16px;font-weight:400;color:var(--text-body)">Explore properties through interactive maps and verified listings.</span></div>
  <div class="item" style="border:none"><span class="spec">14 / 500</span><span class="sample" style="font-size:14px;font-weight:500;color:var(--text-muted)">Avg. price · 42 listings · RERA registered</span></div>
</body>
</html>
