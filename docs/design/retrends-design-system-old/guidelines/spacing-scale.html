<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid — space-1 → space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--background); padding:24px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .col { text-align:center; }
  .box { background:var(--copper-500); border-radius:var(--radius-xs); }
  .tok { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:8px; }
  .px { font-size:10px; color:var(--text-strong); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="width:4px;height:4px"></div><div class="tok">1</div><div class="px">4</div></div>
    <div class="col"><div class="box" style="width:8px;height:8px"></div><div class="tok">2</div><div class="px">8</div></div>
    <div class="col"><div class="box" style="width:12px;height:12px"></div><div class="tok">3</div><div class="px">12</div></div>
    <div class="col"><div class="box" style="width:16px;height:16px"></div><div class="tok">4</div><div class="px">16</div></div>
    <div class="col"><div class="box" style="width:24px;height:24px"></div><div class="tok">6</div><div class="px">24</div></div>
    <div class="col"><div class="box" style="width:32px;height:32px"></div><div class="tok">8</div><div class="px">32</div></div>
    <div class="col"><div class="box" style="width:48px;height:48px"></div><div class="tok">12</div><div class="px">48</div></div>
    <div class="col"><div class="box" style="width:64px;height:64px"></div><div class="tok">16</div><div class="px">64</div></div>
  </div>
</body>
</html>
