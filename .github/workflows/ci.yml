name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flyway migration version order guard (#2686) ─────────────────────────────
  # Runs on every PR against main. Prevents recurrence of the production
  # ordering incident: a branch allocates a migration version against a STALE
  # main, another branch independently lands a migration and advances main
  # first, and the first branch's now-lower version merges afterward — Flyway
  # then refuses to start in production ("Detected resolved migration not
  # applied to database: <N>"). See scripts/db/check-migration-version-order.sh
  # for the full incident writeup and scripts/dev/tests/check-migration-version-order.test.sh
  # for the regression test proving this exact two-lane scenario.
  #
  # fetch-depth: 0 is required — the guard needs full history to read
  # origin/main's migration tree, not just the PR's own commits. This job re-runs
  # on every push to the PR branch (GitHub Actions `pull_request` trigger), so it
  # naturally re-checks against whatever main looked like at that point; branch
  # protection's "Require branches to be up to date before merging" is what
  # forces one final re-run against a truly fresh main immediately before merge
  # is allowed — a repo-settings change, not something this workflow can enforce
  # by itself, and out of scope for this PR (raised separately for review).
  migration-version-guard:
    name: Flyway migration version order guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new migrations are newer than fresh main
        run: bash scripts/db/check-migration-version-order.sh origin/main

  # ── Frontend ────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Needed at Vite build time to embed the Supabase client config.
          # Set these as repository secrets: Settings → Secrets → Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ── Backend ─────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: apps/api
        run: mvn test -B --no-transfer-progress
        env:
          # Placeholder values — unit tests mock all real connections.
          # @WebMvcTest slices exclude OAuth2ResourceServerAutoConfiguration,
          # so the JWT issuer URI is never resolved.
          # @DataJpaTest uses Testcontainers (@ServiceConnection), so no real DB is needed.
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── Backend Integration ──────────────────────────────────────────────────────
  # Runs @Tag("integration") tests (Testcontainers, requires Docker).
  # Docker is available on ubuntu-latest by default — no extra service setup needed.
  backend-integration:
    name: Backend (integration tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        working-directory: apps/api
        run: mvn test -Dgroups=integration -B --no-transfer-progress
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── E2E (legacy, deployed-site smoke) ────────────────────────────────────────
  # Runs auth-free smoke tests against the deployed Cloudflare Pages site.
  # Tests run against the previously-deployed version (before PR merges) —
  # this validates the gate infrastructure and catches regressions in auth-free flows.
  #
  # NOTE (#2187): this job is NOT the authoritative cross-stack merge gate.
  # It proves the deployed frontend renders and admits auth-free navigation
  # against WHATEVER build is currently live — it never exercises the PR's
  # own backend code, and a CORS/env misconfiguration on the deployed site can
  # make this pass or fail independent of the PR's changes. `e2e-canonical`
  # below is the real backend-honest gate. Left running as a secondary,
  # low-cost check on deployed-site reachability; see e2e/README.md.
  playwright-pr:
    name: E2E smoke (Playwright, deployed site — secondary)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run auth-free smoke tests
        run: npx playwright test --project=smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://udupi-property-explorer.pages.dev' }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

  # ── E2E (canonical, real backend) ────────────────────────────────────────────
  # #2187: this is the AUTHORITATIVE cross-stack merge gate. It builds the PR's
  # own frontend + backend, stands up a real local Postgres/PostGIS fixture, and
  # runs e2e/canonical/ (playwright.canonical.config.ts) against them — see
  # e2e/canonical/README.md for the full contract this mirrors (build-sha
  # provenance, CORS probe, rate-limit env overrides, required seed order).
  #
  # Role-gated projects (canonical-user/broker/admin) are ADDITIVE — the
  # canonical config only includes a role's project when that role's
  # credentials are present in the environment (see roleCredentialsPresent()
  # in playwright.canonical.config.ts). This repo's ADMIN_EMAIL/PASSWORD,
  # DEALER_EMAIL/PASSWORD (legacy alias for BROKER_EMAIL/PASSWORD), and
  # SMOKE_USER_EMAIL/PASSWORD secrets already exist (reused from
  # e2e-post-deploy.yml) so all four projects (anon + user + broker + admin)
  # run here. SUPABASE_PROJECT_REF is derived from the VITE_SUPABASE_URL
  # secret's own hostname rather than requiring a separate secret.
  e2e-canonical:
    name: E2E canonical (Playwright, real backend — merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Write local env files required by scripts/dev/local-fixture-backend.sh
        run: |
          set -euo pipefail
          SUPABASE_PROJECT_REF="$(printf '%s' "${VITE_SUPABASE_URL}" | sed -E 's#^https://([^.]+)\.supabase\.co.*#\1#')"
          if [[ -z "$SUPABASE_PROJECT_REF" || "$SUPABASE_PROJECT_REF" == "$VITE_SUPABASE_URL" ]]; then
            echo "ERROR: could not derive SUPABASE_PROJECT_REF from VITE_SUPABASE_URL secret." >&2
            exit 1
          fi
          echo "::add-mask::$SUPABASE_PROJECT_REF"

          cat > .env <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
          EOF

          cat > apps/api/.env <<EOF
          SUPABASE_DB_HOST=unused-local-fixture-overrides-this
          SUPABASE_DB_USER=postgres
          SUPABASE_DB_PASSWORD=unused-local-fixture-overrides-this
          SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF}
          AI_API_KEY=ci-placeholder
          EOF

          cat > .env.e2e <<EOF
          PLAYWRIGHT_BASE_URL=http://localhost:5251
          BACKEND_BASE_URL=http://localhost:8251
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          BROKER_EMAIL=${DEALER_EMAIL}
          BROKER_PASSWORD=${DEALER_PASSWORD}
          SMOKE_USER_EMAIL=${SMOKE_USER_EMAIL}
          SMOKE_USER_PASSWORD=${SMOKE_USER_PASSWORD}
          EOF
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEALER_EMAIL: ${{ secrets.DEALER_EMAIL }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}

      - name: Start local fixture backend (Postgres/PostGIS + real Spring Boot)
        run: |
          set -euo pipefail
          SERVER_PORT=8251 \
          PG_TEST_PORT=5434 \
          CORS_ALLOWED_ORIGINS="http://localhost:5251" \
          RATE_LIMIT_DISCOVER_ENABLED=false \
          RATE_LIMIT_TRENDS_ENABLED=false \
          nohup bash scripts/dev/local-fixture-backend.sh > /tmp/local-fixture-backend.log 2>&1 &
          echo "$!" > /tmp/local-fixture-backend.pid

          echo "Waiting for backend health at http://localhost:8251/actuator/health ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8251/actuator/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}0s."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: backend did not become healthy in time. Log:"
          cat /tmp/local-fixture-backend.log
          exit 1

      # Fail-closed preflight (PR #2334 review fix): #2187 requires this gate to
      # fail/report when required credentials are unavailable, never to quietly
      # keep running anon-only. playwright.canonical.config.ts's
      # roleCredentialsPresent() is intentionally ADDITIVE for local developer
      # runs (see its own docstring above) — a dev with no role creds exported
      # should still get the anon project. CI is different: this job's whole
      # point is being the authoritative merge gate, so here a missing/blank
      # secret must fail the job outright rather than silently drop that
      # role's coverage. This step checks BEFORE the canonical run, and the
      # next one checks the roster the run actually produced — together they
      # mean a future secret rename or roleCredentialsPresent() alias drift
      # can't silently shrink coverage without CI noticing.
      - name: Verify required role credential secrets are present
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ADMIN_EMAIL:-}" ]] && missing+=("ADMIN_EMAIL")
          [[ -z "${ADMIN_PASSWORD:-}" ]] && missing+=("ADMIN_PASSWORD")
          [[ -z "${DEALER_EMAIL:-}" ]] && missing+=("DEALER_EMAIL (BROKER_EMAIL alias)")
          [[ -z "${DEALER_PASSWORD:-}" ]] && missing+=("DEALER_PASSWORD (BROKER_PASSWORD alias)")
          [[ -z "${SMOKE_USER_EMAIL:-}" ]] && missing+=("SMOKE_USER_EMAIL")
          [[ -z "${SMOKE_USER_PASSWORD:-}" ]] && missing+=("SMOKE_USER_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: this merge gate requires all role credential secrets to be set." >&2
            echo "Missing: ${missing[*]}" >&2
            echo "The canonical config's role-gated projects (canonical-user/broker/admin)" >&2
            echo "are additive-only, so a blank secret here would otherwise make the merge" >&2
            echo "gate go green anon-only while silently losing that role's coverage." >&2
            exit 1
          fi
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEALER_EMAIL: ${{ secrets.DEALER_EMAIL }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}

      # Second half of the fail-closed contract: confirms the projects that
      # actually resolve at config-load time include every expected role, not
      # just that the secrets above were non-empty. This is what catches a
      # future rename/alias drift between this workflow's env var names and
      # roleCredentialsPresent()'s own env var reads in
      # playwright.canonical.config.ts, which the secrets check above cannot
      # see (it would still pass even if the config stopped reading a renamed
      # var). `--list` resolves config + project selection without starting
      # webServer or globalSetup, so it's cheap and needs no backend/frontend
      # up yet. Uses the `json` reporter (not the default `list` text
      # reporter, which only prints a pass/fail/skipped count, no project
      # names) so project selection can be verified programmatically.
      - name: Verify all expected canonical role projects are selected
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.canonical.config.ts --list --reporter=json > /tmp/canonical-list.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/canonical-list.json", "utf8"));
            const found = new Set();
            const titlesByProject = new Map();
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  found.add(t.projectName);
                  if (!titlesByProject.has(t.projectName)) titlesByProject.set(t.projectName, []);
                  titlesByProject.get(t.projectName).push(spec.title);
                }
              }
              for (const sub of suite.suites ?? []) walk(sub);
            };
            for (const suite of data.suites ?? []) walk(suite);
            const expected = ["canonical-anon", "canonical-user", "canonical-broker", "canonical-admin"];
            const missing = expected.filter((p) => !found.has(p));
            console.log("Projects selected:", [...found].sort().join(", "));
            if (missing.length > 0) {
              console.error("ERROR: expected canonical project(s) missing from --list output:", missing.join(", "));
              console.error("All six role credential secrets are present (checked in the prior step),");
              console.error("so every canonical-{user,broker,admin} project should have been selected.");
              console.error("This means playwright.canonical.config.ts roleCredentialsPresent() is no");
              console.error("longer reading the env var name(s) this workflow sets - fix the drift before");
              console.error("merging, since this is the authoritative cross-stack merge gate.");
              process.exit(1);
            }

            // #2434: the project check above is necessary but not sufficient.
            // It asserts the four PROJECTS resolve; it asserts nothing about
            // any TEST inside them. A renamed spec file, a typo-ed
            // [role:<role>] tag, or a filename that stops matching
            // **/*.canonical.ts removes that spec entirely while its project
            // still resolves via the OTHER specs that share it - green run,
            // coverage silently gone.
            //
            // Observed for real while authoring #2434: a single bad import in
            // one new spec took the WHOLE suite to zero collected tests across
            // all seven projects. That total wipe the check above does catch
            // (no tests means no projects found). The partial case - one file
            // dropping out while its project survives - it does not.
            //
            // Each entry names a journey that must exist, not an exact title,
            // so ordinary rewording does not break the gate but deletion does.
            // ENTRIES MUST STAY ALPHANUMERIC. Each `match` is interpolated
            // into new RegExp("\\b" + match + "\\b") below, so a value
            // containing regex syntax — "C16/C17", "CC1+", "T13." — would
            // silently change the meaning of the pattern, or throw at gate time.
            // Every current entry is alphanumeric and therefore safe; this is
            // the obvious place a later journey gets added, and whoever adds
            // it will not be thinking about escaping.
            //
            // NO APOSTROPHES ANYWHERE IN THIS SCRIPT — NOT EVEN IN A COMMENT.
            // This whole block is ONE single-quoted shell argument to node -e.
            // An apostrophe closes that string, and everything up to the next
            // one is then parsed as bare shell — which here means the array
            // literal below, with its braces, brackets, semicolons and a
            // literal "#". The step dies with a bash syntax error before node
            // ever starts, so BOTH this check and the project check above stop
            // running. It fails closed rather than green, but the gate is
            // inert either way. Two apostrophes in these comments did exactly
            // that and were caught in review, not by CI (Actions billing is
            // blocked) and not by replaying this script from a file — running
            // it as a file bypasses the shell quoting that breaks it.
            // Verify with: bash -n on the extracted run: body, never by
            // executing the JavaScript on its own.
            //
            // COUPLED TO T15_ENABLED. listing-lifecycle.canonical.ts carries a
            // const T15_ENABLED flag, documented there as the sanctioned way to
            // descope a journey honestly (never test.skip / test.fixme).
            // Flipping it to false de-registers T15, which then collects ZERO
            // tests and fails the check below — so a legitimate descope must
            // remove the matching entry here in the SAME change. Stated at the
            // point of failure, because that is where whoever descopes will be
            // standing. T14 has no such flag, so only T15 is exposed.
            const requiredTests = [
              { project: "canonical-broker", match: "T13",  journey: "Residential lifecycle: broker create/submit" },
              { project: "canonical-broker", match: "T14",  journey: "Residential lifecycle: admin approve" },
              { project: "canonical-broker", match: "T15",  journey: "Residential lifecycle: anon views LIVE" },
              { project: "canonical-broker", match: "CC1",  journey: "Commercial lifecycle: broker create/submit (#2434)" },
              { project: "canonical-broker", match: "CC1b", journey: "Commercial lifecycle: second listing for C16 parity (#2434)" },
              { project: "canonical-broker", match: "CC1c", journey: "Commercial lifecycle: OFFICE row making CC4 subtype narrowing falsifiable (#2434)" },
              { project: "canonical-broker", match: "CC2",  journey: "Commercial lifecycle: admin approve (#2434)" },
              { project: "canonical-broker", match: "CC4",  journey: "Commercial lifecycle: Discover membership C13/C16/C17 (#2434)" },
              { project: "canonical-broker", match: "CC3",  journey: "Commercial lifecycle: anon teaser gating (#2434)" },
            ];
            // WORD-BOUNDARY match, not substring. `t.includes("CC1")` is
            // satisfied by the CC1b title, so deleting CC1 left the gate
            // green for as long as CC1b survived — the entry was listed and
            // unguarded at the same time. \b before and after the id fixes
            // that: "CC1b" does not satisfy /\bCC1\b/, because the boundary
            // after "1" requires a non-word character and "b" is one.
            //
            // CC4 was missing from this list entirely, which meant the gate
            // could not catch deletion of the test carrying C13/C16/C17 —
            // the whole Discover-membership substance of #2434. A gate that
            // omits its principal deliverable reports success by doing
            // nothing, which is the failure family this step exists to close.
            const absent = requiredTests.filter(
              (r) => !(titlesByProject.get(r.project) ?? []).some(
                (t) => new RegExp("\\b" + r.match + "\\b").test(t),
              ),
            );
            for (const [p, titles] of [...titlesByProject].sort()) {
              console.log("  " + p + ": " + titles.length + " tests");
            }
            if (absent.length > 0) {
              console.error("ERROR: required canonical journey(s) collected ZERO tests:");
              for (const a of absent) {
                console.error("  - [" + a.project + "] " + a.match + " - " + a.journey);
              }
              console.error("The project itself still resolved, so the prior check passed. That is the");
              console.error("exact false-green this assertion exists to close: the journey is gone while");
              console.error("the roster looks intact. Check for a renamed file, a typo-ed [role:] tag, or");
              console.error("a filename no longer matching **/*.canonical.ts.");
              process.exit(1);
            }
          '
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5251
          BACKEND_BASE_URL: http://localhost:8251
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          BROKER_EMAIL: ${{ secrets.DEALER_EMAIL }}
          BROKER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Run canonical E2E suite (npm run test:e2e:canonical)
        run: npm run test:e2e:canonical
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5251
          BACKEND_BASE_URL: http://localhost:8251
          VITE_API_BASE_URL: http://localhost:8251
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          BROKER_EMAIL: ${{ secrets.DEALER_EMAIL }}
          BROKER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/local-fixture-backend.log || true

      - name: Upload Playwright canonical report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-canonical-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/canonical/
          retention-days: 14
