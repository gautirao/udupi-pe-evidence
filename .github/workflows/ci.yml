name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Needed at Vite build time to embed the Supabase client config.
          # Set these as repository secrets: Settings → Secrets → Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ── Backend ─────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: backend
        run: mvn test -B --no-transfer-progress
        env:
          # Placeholder values — unit tests mock all real connections.
          # @WebMvcTest slices exclude OAuth2ResourceServerAutoConfiguration,
          # so the JWT issuer URI is never resolved.
          # @DataJpaTest uses Testcontainers (@ServiceConnection), so no real DB is needed.
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── Backend Integration ──────────────────────────────────────────────────────
  # Runs @Tag("integration") tests (Testcontainers, requires Docker).
  # Docker is available on ubuntu-latest by default — no extra service setup needed.
  backend-integration:
    name: Backend (integration tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        working-directory: backend
        run: mvn test -Dgroups=integration -B --no-transfer-progress
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── E2E ─────────────────────────────────────────────────────────────────────
  # E2E tests are NOT run in CI because the deployment URLs (Cloudflare Pages,
  # Render) are only live after the merge completes — running e2e here would
  # test the previous deployed version, not the new code.
  #
  # E2E gate: the pre-push hook (.githooks/pre-push) runs Playwright locally
  # against a locally-started backend + frontend before each push.
  # Setup: npm run prepare  (sets hooksPath once per clone)
  # Run:   npm run test:e2e:local  (or just git push — hook triggers automatically)
