name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flyway migration version order guard (#2686) ─────────────────────────────
  # Runs on every PR against main. Prevents recurrence of the production
  # ordering incident: a branch allocates a migration version against a STALE
  # main, another branch independently lands a migration and advances main
  # first, and the first branch's now-lower version merges afterward — Flyway
  # then refuses to start in production ("Detected resolved migration not
  # applied to database: <N>"). See scripts/db/check-migration-version-order.sh
  # for the full incident writeup and scripts/dev/tests/check-migration-version-order.test.sh
  # for the regression test proving this exact two-lane scenario.
  #
  # fetch-depth: 0 is required — the guard needs full history to read
  # origin/main's migration tree, not just the PR's own commits. This job re-runs
  # on every push to the PR branch (GitHub Actions `pull_request` trigger), so it
  # naturally re-checks against whatever main looked like at that point; branch
  # protection's "Require branches to be up to date before merging" is what
  # forces one final re-run against a truly fresh main immediately before merge
  # is allowed — a repo-settings change, not something this workflow can enforce
  # by itself, and out of scope for this PR (raised separately for review).
  migration-version-guard:
    name: Flyway migration version order guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new migrations are newer than fresh main
        run: bash scripts/db/check-migration-version-order.sh origin/main

  # ── Frontend ────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # #2750: the E2E estate/gate guards are plain node scripts and shell tests with no stack
      # requirement, so they run on every PR here (cheapest job that has node). The same scripts run
      # in the pre-push hook and in the local gate (scripts/run-e2e-gate.sh), so a local pass
      # validates the code CI runs. scripts/e2e/ci-drift.test.mjs pins this wiring.
      - name: E2E estate guard + canonical journey static check
        run: npm run test:e2e:guard

      - name: E2E guard unit tests (node --test scripts/e2e)
        run: node --test scripts/e2e/*.test.mjs

      - name: Pre-push hook classification test
        run: bash scripts/dev/tests/pre-push-classify.test.sh

      - name: Build
        run: npm run build
        env:
          # Needed at Vite build time to embed the Supabase client config.
          # Set these as repository secrets: Settings → Secrets → Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ── Backend ─────────────────────────────────────────────────────────────────
  # Runs on every PR and push to main.
  # Required check for branch protection.
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: apps/api
        run: mvn test -B --no-transfer-progress
        env:
          # Placeholder values — unit tests mock all real connections.
          # @WebMvcTest slices exclude OAuth2ResourceServerAutoConfiguration,
          # so the JWT issuer URI is never resolved.
          # @DataJpaTest uses Testcontainers (@ServiceConnection), so no real DB is needed.
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── Backend Integration ──────────────────────────────────────────────────────
  # Runs @Tag("integration") tests (Testcontainers, requires Docker).
  # Docker is available on ubuntu-latest by default — no extra service setup needed.
  backend-integration:
    name: Backend (integration tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        working-directory: apps/api
        run: mvn test -Dgroups=integration -B --no-transfer-progress
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_PROJECT_REF: ci-placeholder
          AI_API_KEY: ci-placeholder

  # ── E2E (legacy, deployed-site smoke) ────────────────────────────────────────
  # Runs auth-free smoke tests against the deployed Cloudflare Pages site.
  # Tests run against the previously-deployed version (before PR merges) —
  # this validates the gate infrastructure and catches regressions in auth-free flows.
  #
  # NOTE (#2187): this job is NOT the authoritative cross-stack merge gate.
  # It proves the deployed frontend renders and admits auth-free navigation
  # against WHATEVER build is currently live — it never exercises the PR's
  # own backend code, and a CORS/env misconfiguration on the deployed site can
  # make this pass or fail independent of the PR's changes. `e2e-canonical`
  # below is the real backend-honest gate. Left running as a secondary,
  # low-cost check on deployed-site reachability; see e2e/README.md.
  playwright-pr:
    name: E2E smoke (Playwright, deployed site — secondary)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run auth-free smoke tests
        run: npx playwright test --project=smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://udupi-property-explorer.pages.dev' }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

  # ── E2E (canonical, real backend) ────────────────────────────────────────────
  # #2187: this is the AUTHORITATIVE cross-stack merge gate. It builds the PR's
  # own frontend + backend, stands up a real local Postgres/PostGIS fixture, and
  # runs e2e/canonical/ (playwright.canonical.config.ts) against them — see
  # e2e/canonical/README.md for the full contract this mirrors (build-sha
  # provenance, CORS probe, rate-limit env overrides, required seed order).
  #
  # Role-gated projects (canonical-user/broker/admin) are ADDITIVE in the canonical config (a role's project is added
  # only when its credentials are present); the gate script generates all three role users per run in the local
  # GoTrue and the results phase fails closed if any project or journey is missing, so coverage cannot shrink silently.
  # AUTH IS LOCAL (#2750 amendment 1): no hosted Supabase secret is read, no project ref is derived, and the backend's
  # issuer is overridden through the process env of the gate's backend subshell only (application.yml is untouched).
  e2e-canonical:
    name: E2E canonical (Playwright, real backend — merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # #2750 (FC-15, K6): CANONICAL_SKIP_SHA_PROVENANCE disables the build-sha provenance
      # assertion ("is the served build the code under review?"). It exists for local harness
      # debugging only and must never be set on this merge gate, whether by a repository variable,
      # a workflow-level env or a step env. The list and results phases of
      # scripts/e2e/check-canonical-journeys.mjs refuse it too; this step fails fast and loudly.
      - name: Refuse the SHA-provenance opt-out (CANONICAL_SKIP_SHA_PROVENANCE)
        run: |
          # Check BOTH the value inherited from the runner/workflow env and the repository variable.
          # The variable is read under a different name on purpose: a step-level env entry named
          # CANONICAL_SKIP_SHA_PROVENANCE would shadow (and so hide) an inherited value.
          if [ -n "${CANONICAL_SKIP_SHA_PROVENANCE:-}" ] || [ -n "${CANONICAL_SKIP_SHA_PROVENANCE_REPO_VAR:-}" ]; then
            echo "ERROR: CANONICAL_SKIP_SHA_PROVENANCE is set (inherited env or repository variable). This is the merge gate; the opt-out is refused (NOT A GATE RUN)." >&2
            exit 1
          fi
        env:
          CANONICAL_SKIP_SHA_PROVENANCE_REPO_VAR: ${{ vars.CANONICAL_SKIP_SHA_PROVENANCE }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # #2750 amendment 1 (local auth): hosted Supabase Auth is no longer a dependency of this gate. The job pulls the
      # pinned (by digest) GoTrue / PostgREST / nginx images and then runs THE SAME script a developer runs
      # (scripts/run-e2e-gate.sh), so CI and the local gate cannot drift: static guards, FC-26, fixture restore + grants
      # overlay, local role users with generated passwords, FC-27 live probes (a)(b)(c), FC-28 bundle check, the
      # collected-journey list phase, the suite, the K3 credential scan and the fail-closed results phase all live in
      # that script and in scripts/e2e/*.mjs. No secret is needed or passed: the role credentials are generated per run.
      - name: Pull the pinned local-auth images (digest-pinned, scripts/e2e/auth-stack/images.lock)
        run: bash scripts/e2e/auth-stack/pull-images.sh

      - name: Run the canonical E2E gate (scripts/run-e2e-gate.sh, local auth)
        id: canonical_gate
        run: bash scripts/run-e2e-gate.sh

      # K3 is performed INSIDE the gate, before it prints anything from run.log and before this job uploads anything:
      # it scans test-results/, playwright-report/ and the backend log (inflating traces and the HTML report's base64
      # zip), treats an artefact it cannot scan as a hit, and purges all three on a hit. The gate writes
      # test-results/gate/k3-scan.ok ONLY after a clean scan. This step turns that marker into a step outcome that the
      # upload steps below require (steps.canonical_scan.outcome == 'success'), so a leaked or unscannable artefact is
      # never uploaded, even when the gate step itself failed.
      - name: Credential scan (K3) outcome gates every upload
        id: canonical_scan
        if: always()
        run: |
          if [ ! -f test-results/gate/k3-scan.ok ]; then
            echo "ERROR: the gate did not complete a clean K3 credential scan; run artefacts are NOT uploaded." >&2
            exit 1
          fi

      - name: Dump backend log on failure
        if: failure() && steps.canonical_scan.outcome == 'success'
        run: tail -n 300 test-results/gate/backend.log || true

      - name: Upload canonical results.json
        uses: actions/upload-artifact@v4
        if: always() && steps.canonical_scan.outcome == 'success'
        with:
          name: playwright-canonical-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/canonical/results.json
          retention-days: 14
          if-no-files-found: warn

      # No HTML report is uploaded (#2750 Q0): the gate and CI run with the list + json reporters only, because the HTML
      # reporter records the sign-in fill() values (the role email and password) verbatim. playwright.canonical.config.ts
      # turns it off whenever E2E_CANONICAL_GATE=1 or CI is set; results.json above is the only run artefact uploaded.
