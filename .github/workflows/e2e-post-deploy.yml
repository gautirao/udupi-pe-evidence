name: Post-Deploy Smoke

# Runs after every merge to main.
# Cloudflare Pages deploys in ~3 min; Render backend is polled until healthy.
# This tests the LIVE production deployment, not the CI build.
on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

jobs:
  smoke:
    name: Production smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Cloudflare Pages deployment
        run: |
          echo "Waiting 3 minutes for Cloudflare Pages to finish deploying..."
          sleep 180
          echo "Cloudflare wait complete."

      - name: Wait for Render backend
        run: |
          echo "Polling Render backend at $BACKEND_BASE_URL ..."
          for i in $(seq 1 10); do
            if curl -sf "$BACKEND_BASE_URL/actuator/health" --max-time 30 -o /dev/null; then
              echo "Backend ready."
              exit 0
            fi
            echo "Attempt $i/10: not ready, retrying in 30s..."
            sleep 30
          done
          echo "Backend did not respond after 5 minutes — proceeding anyway."
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL || 'https://udupi-property-explorer.onrender.com' }}

      - name: Run production smoke tests
        run: npm run test:e2e:full
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://udupi-property-explorer.pages.dev' }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL || 'https://udupi-property-explorer.onrender.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          DEALER_EMAIL: ${{ secrets.DEALER_EMAIL }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
