# Global test shield for DiscoverRateLimitFilter (#1671).
#
# WHY THIS FILE EXISTS: DiscoverRateLimitFilter is a @Component OncePerRequestFilter, so
# @WebMvcTest slices auto-include it module-wide regardless of `controllers =`/`@Import` scoping
# (same precedent as IngestionApiKeyFilter — see IngestionControllerIntegrationTest's
# excludeFilters). Without a global default, every slice/IT that boots the filter shares ONE
# 127.0.0.1 bucket at enabled=true/120 req-per-min, which is latent cross-test 429 flakiness.
#
# WHY .properties AND NOT .yml: a prior attempt created
# src/test/resources/application.yml as this shield. That SHADOWED
# src/main/resources/application.yml on the test classpath — same resource name wins outright, so
# the entire main YAML config (not just this one key) silently failed to load, breaking ~19
# unrelated tests (e.g. InsightsControllerTest `$.page` serialization, RbacSmokeIT context errors).
# `application.properties` is a DIFFERENT resource name than `application.yml`, so Spring Boot
# loads this file IN ADDITION to (not instead of) the main YAML, with normal per-property
# precedence — no shadowing.
#
# Do NOT add other keys here without checking they don't already exist in
# src/main/resources/application.yml with a value tests depend on.
#
# Precedence note: any test class using @TestPropertySource(properties = {"app.ratelimit.discover.enabled=..."})
# (e.g. DiscoverRateLimitFilterTest) still wins over this file — @TestPropertySource has the
# highest property-source precedence in a Spring test context, above classpath
# application.properties/yml. So this default only affects tests that don't explicitly configure
# app.ratelimit.discover.* themselves.
app.ratelimit.discover.enabled=false
