spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/${SUPABASE_DB_NAME:postgres}?prepareThreshold=0
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      pool-name: udupi-pool
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        ssl: true
        sslmode: require

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
        serialization-mode: via_dto

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1

app:
  ai:
    api-url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    api-key: ${AI_API_KEY}
    model: ${AI_MODEL:gemini-2.0-flash}

  ingestion:
    batch-size: ${INGESTION_BATCH_SIZE:10}
    poll-interval-ms: ${INGESTION_POLL_INTERVAL_MS:30000}
    api-key: ${INGESTION_API_KEY:changeme-local-dev-only}

  email:
    resend-api-key: ${RESEND_API_KEY:disabled}
    from-address: ${RESEND_FROM_ADDRESS:alerts@udupi-properties.com}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name:udupi-property-explorer}
  info:
    env:
      enabled: false

server:
  port: ${SERVER_PORT:8085}
  tomcat:
    max-http-post-size: 6291456
  error:
    include-message: never
    include-stack-trace: never
    include-exception: false
    include-binding-errors: never

logging:
  level:
    com.example.realestate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [requestId=%X{requestId:-none}] %logger{36} - %msg%n"

# CORS Configuration (SEC-2 remediation)
# Production: set CORS_ALLOWED_ORIGINS=https://your-domain.pages.dev in Render env vars
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Supabase Storage — used by SupabaseStorageService for server-side object deletion.
# Set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in Render env vars before enabling.
# Defaults to disabled so the app starts cleanly when keys are absent.
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    enabled: ${SUPABASE_STORAGE_ENABLED:false}
    bucket: ${SUPABASE_STORAGE_BUCKET:listing-images}

# Sentry error monitoring
# DSN must be set in Render env vars: SENTRY_DSN=https://...@sentry.io/...
# When SENTRY_DSN is absent (empty default), Sentry initializes in no-op mode — no crash.
# SECURITY: send-default-pii MUST remain false. Do NOT set to true under any circumstances.
#   This prevents Authorization headers, JWT payloads, and user PII from being sent to Sentry.
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  environment: ${RENDER_SERVICE_NAME:local}
  traces-sample-rate: 0

# Trust ranking score configuration (RE-150).
# tierBase: base score per tier letter. weights: multipliers for each score component.
trust:
  ranking:
    tier-base:
      A: 1000
      B: 750
      C: 500
      D: 0
    weights:
      freshness: 200
      profile: 100
      listing: 100

# Proximity duplicate batch job — nightly backfill scan.
# Cron uses Spring 6-field format: seconds minutes hours day-of-month month day-of-week.
# Default: 02:00 UTC. Override via PROXIMITY_BATCH_CRON env var (e.g. "0/5 * * * * *" for dev).
proximity:
  batch:
    cron: ${PROXIMITY_BATCH_CRON:0 0 2 * * *}
