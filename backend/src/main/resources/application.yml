spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${SUPABASE_PROJECT_REF:localhost}.supabase.co/auth/v1

app:
  ai:
    api-url: ${AI_API_URL:https://ai.gateway.lovable.dev/v1/chat/completions}
    api-key: ${LOVABLE_API_KEY:}
    model: ${AI_MODEL:google/gemini-3-flash-preview}
  ingestion:
    batch-size: ${INGESTION_BATCH_SIZE:10}
    poll-interval-ms: ${INGESTION_POLL_INTERVAL_MS:30000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.example.realestate: DEBUG
