sonar.projectKey=udupi
sonar.projectName=udupi

sonar.sources=apps/api/src/main,apps/web/src,tests
sonar.tests=apps/api/src/test

# Frontend tests are colocated inside sonar.sources (apps/web/src/**/*.test.tsx, tests/**/*.spec.ts);
# sonar.test.inclusions below tells the scanner which files under sonar.sources are tests.

sonar.java.binaries=apps/api/target/classes

sonar.coverage.jacoco.xmlReportPaths=apps/api/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/coverage/**,**/ui_kits/**,**/_ds_bundle.js
sonar.test.inclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.coverage.exclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/main.tsx,**/vite-env.d.ts
