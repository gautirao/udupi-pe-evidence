# TEMPLATE — .claude/templates/approved-execution-handoff.toml
#
# Purpose: Main Agent (lead) → mode3-orchestrator teammate (Agent Teams).
# Authorises the Sonnet Orchestrator to execute the approved plan within a
# fixed BOUNDARY. The Orchestrator decides the per-call specialist sequence
# inside this boundary per Route-and-Run policy and logs every routing
# decision; Main Agent verifies the routing log before WORKDONE_REVIEW.
#
# Created ONLY after ChatGPT PLAN_REVIEW verdict = "APPROVED" AND per-issue
# approved-plan.toml has been materialised.
#
# Internal-only artefact. NEVER submitted to ChatGPT. NEVER passed to
# openai_gate.py. Orchestrator is hard-blocked from those channels.
#
# Agent Teams is the runtime transport. Route-and-Run defines the choreography.
# The Orchestrator follows Route-and-Run (.claude/skills/ROUTE_AND_RUN.md);
# it does NOT redefine it. The Orchestrator may ADD mandatory gates discovered
# at runtime (e.g. late-detected Gate F triggers); it may NEVER REMOVE them.
#
# Schema v2 (post-#1098): replaces `executor.allowed_specialists` with the
# richer [executor.specialist_policy] block. Adds top-level risk_tier and
# issue_type. Adds [escalation_rules].
#
# Copy this file to:
#   .claude/handoffs/issue-<N>/approved-execution-handoff.toml
# Fill in the placeholders. The [authority] block MUST remain locked as shown.

schema_version = "2"
gate = "APPROVED_EXECUTION_HANDOFF"
issue = 0
created_at = "YYYY-MM-DDTHH:MM:SSZ"

# Risk tier per ROUTE_AND_RUN.md Step 1B + tier table at ROUTE_AND_RUN.md:64.
# Drives the high-risk minimum specialist set (qa-fast + engineer +
# code-reviewer(opus) + security-reviewer + qa verification).
risk_tier = "normal"  # trivial | normal | high-risk | doc-only

# Issue type per ROUTE_AND_RUN.md Step 1. Used by the Orchestrator together
# with risk_tier to map to the appropriate engineer specialist via
# ROUTE_AND_RUN_TABLES.md sections A-I.
issue_type = "feature"  # bugfix | small-change | feature | refactor | perf | security | incident | ui

[plan]
approved_plan_path = ".claude/handoffs/issue-<N>/approved-plan.toml"
approved_plan_sha256 = "<hex digest of approved_plan_path at materialisation>"
plan_review_verdict = "APPROVED"
plan_review_evidence = ".claude/openai-gates/issue-<N>/<timestamp>-PLAN_REVIEW/verdict.toml"
# The implementation plan was AUTHORED by the Team Lead (mode3-orchestrator),
# not the Main Agent. team-lead-plan.toml was the PLAN_REVIEW input packet.
team_lead_plan_path = ".claude/handoffs/issue-<N>/team-lead-plan.toml"

# --- OPENAI PLAN_REVIEW ACCEPTANCE CONTRACT ---------------------------------
# Transcribed VERBATIM from the OpenAI PLAN_REVIEW verdict (eval_checklist /
# required_evidence / scope). Under the current gate-schema limitation
# (openai_gate.py VERDICT_SCHEMA is additionalProperties:false), the Main Agent
# transcribes the verdict's required_changes + approved_scope + blocking_issues
# into these fields. These are NOT Main-Agent-invented criteria. The Team Lead
# executes against [eval_checklist] and self-checks against it before writing
# workdone-candidate.toml (which must carry the matching [eval_checklist_result]).
[eval_checklist]
items = [
  # "Acceptance item the Team Lead must satisfy, with evidence, before workdone."
]

[required_evidence]
must_provide = [
  # "Evidence the WORKDONE_CANDIDATE must include (build / unit / e2e / browser / review)."
]

[plan_scope]
allowed_changes = []    # from OpenAI [scope].allowed_changes
forbidden_changes = []  # from OpenAI [scope].forbidden_changes

# --- VALIDATION MATRIX (risk-triggered evidence packet) ----------------------
# Carried forward VERBATIM from team-lead-plan.toml as validated by PLAN_REVIEW.
# level = NOT_REQUIRED | COMPACT | FULL. Hard-trigger categories require FULL;
# trivial changes may use NOT_REQUIRED (one-line reason); normal bounded work
# may use COMPACT. The Team Lead authors the matrix at required_artifact during
# execution for COMPACT/FULL; WORKDONE_REVIEW checks presence/verdict; PR_REVIEW
# consumes it. Full policy + decision table + templates:
#   .claude/mode3/contracts/validation-matrix.md
[validation_matrix]
level = "COMPACT"   # NOT_REQUIRED | COMPACT | FULL
reason = "<one line — mandatory for NOT_REQUIRED; recommended otherwise>"
required_artifact = ".claude/handoffs/issue-<N>/validation-matrix.md"  # empty for NOT_REQUIRED

[executor]
# MVP default model = "sonnet" for the first 3 dry-runs.
# After 3 successful Sonnet runs, a separate cost-optimisation issue evaluates
# Haiku. NO silent model escalation.
model = "sonnet"
allowed_file_globs = [
  # From approved plan files.likely_change.
]
forbidden_globs = [
  # From approved plan forbidden.
  "**/.env*",
  "**/secrets/**",
]
max_specialist_invocations = 12
max_minutes = 45

# --- SPECIALIST POLICY (Option C — Hybrid) ----------------------------------
# Main Agent declares the BOUNDARY (this block).
# Orchestrator decides the SEQUENCE within the boundary per Route-and-Run.
# Main Agent verifies the routing log against this boundary before
# WORKDONE_REVIEW.

[executor.specialist_policy]

# Broad categories the Orchestrator may pick from. Replaces the old exact
# allowed_specialists list. The Orchestrator picks specifically WHICH engineer
# (frontend vs backend vs supabase) based on issue_type + allowed_file_globs.
category_allowlist = { engineers = ["frontend-engineer", "backend-engineer", "supabase-engineer"], reviewers = ["code-reviewer", "security-reviewer"], qa = ["qa-fast", "qa"], design = [] }
# Add to design = ["architect"] when architecture gate triggers, or
# ["ui-designer"] when UI design gate triggers, or both. Empty by default.

# Specialists the Orchestrator MUST invoke. Derived from risk_tier and
# Gate F triggers. The Orchestrator MAY ADD entries (e.g. late-detected
# Gate F → add "security-reviewer"); it MAY NEVER REMOVE entries.
mandatory_gates = [
  "qa-fast",          # ROUTE_AND_RUN.md:352 — mandatory unless Lean-mode skip
  "code-reviewer",    # ROUTE_AND_RUN.md:471 — mandatory unless single-file low-risk
  "qa-verification",  # ROUTE_AND_RUN.md:495 — mandatory for Normal/High-risk
  # Add "security-reviewer" for Gate F triggers
  # Add "architect" if architecture gate triggers
]

# Always-forbidden agent types — Orchestrator refuses to invoke any of these.
always_forbidden = ["general-purpose", "Plan", "Explore", "explorer-planner", "spec-enricher", "chatgpt-gatekeeper"]

# Specialists with conditional triggers. Orchestrator adds them when the
# trigger fires; otherwise they are not invoked.
[[executor.specialist_policy.conditional_gates]]
name = "ui-designer"
trigger = "ui_design_gate (visible UI redesign or new screen)"

[[executor.specialist_policy.conditional_gates]]
name = "architect"
trigger = "architecture_gate (new schema, contract, or unresolved design decision)"

[[executor.specialist_policy.conditional_gates]]
name = "qa-e2e-authoring"
trigger = "qa-fast recommends 'E2E authoring recommended: YES'"

# Verbatim Route-and-Run citations for when a mandatory_gate may be skipped.
# Lifted directly from the policy docs; do NOT reword.
[executor.specialist_policy.skip_authority]
qa_fast = "Lean-mode only — ALL conditions at ROUTE_AND_RUN.md:357-369 must hold; skip log entry MUST cite that section and include replacement_evidence (e.g. doc-only diff)."
code_reviewer = "Risk=low AND single-file AND no logic/behaviour change (ROUTE_AND_RUN.md:472). Skip log entry MUST cite this and replacement_evidence MAY be NONE."
security_reviewer = "NO skip authority when Gate F triggers (auth/JWT/secrets/PII/payments/CORS/CSP/RLS) per ROUTE_AND_RUN_TABLES.md:68-72."
qa_verification = "NO skip authority for Normal/High-risk. May be skipped only for trivial/doc-only changes documented in the approved plan."

# --- AUTHORITY BLOCK — LOCKED ------------------------------------------------
# These values are non-negotiable for the Orchestrator. Do not change.
[authority]
openai_gates = false
chatgpt_contact = false
pr_creation = false
merge = false
scope_change = false
# -----------------------------------------------------------------------------

[contract]
must_write = [
  ".claude/handoffs/issue-<N>/team-lead-execution-log.md",
  # Plus exactly ONE of:
  #   .claude/handoffs/issue-<N>/workdone-candidate.toml  (success path)
  #   .claude/handoffs/issue-<N>/blocked.toml             (failure / safe halt)
]
must_not_touch = [
  "**/.env*",
  "**/secrets/**",
  # Plus all forbidden_globs above.
]

[qa_requirements]
# From approved plan. unit_tests / e2e_tests are required for Normal and
# High-risk changes per Route-and-Run policy.
unit_tests_required = true
unit_tests_not_required_justification = ""  # required if unit_tests_required = false
e2e_tests_required = true
e2e_tests_not_required_justification = ""  # required if e2e_tests_required = false

[indexing]
# Recorded by Main Agent during /mode3-run Phase 0.1.
index_command = "mcp__jcodemunch__index_folder { path: '.', incremental: true }"
index_result_summary = "<files_indexed=N; symbols=N; duration=Ns>"
indexed_at = "YYYY-MM-DDTHH:MM:SSZ"
index_authority_note = "Optimisation only; direct file content + git state win on conflict."

[choreography]
# Source-of-truth pointer. Orchestrator MUST follow this; MUST NOT redefine it.
source = ".claude/skills/ROUTE_AND_RUN.md"
table = ".claude/skills/ROUTE_AND_RUN_TABLES.md"
binding_statement = "Agent Teams is transport; Route-and-Run defines choreography."
expected_normal_sequence = [
  "qa-fast (pre-implementation, mandatory unless Lean-mode ALL skip conditions)",
  "engineer specialist (frontend-engineer | backend-engineer | supabase-engineer; architect/ui-designer first if gate triggers)",
  "code-reviewer (sonnet default; opus for high-risk auth/payments/migrations/data-integrity)",
  "security-reviewer (mandatory when Gate F triggers: auth/JWT/secrets/PII/payments/CORS/CSP/RLS)",
  "qa E2E authoring (conditional; only when qa-fast recommends YES)",
  "qa verification (mandatory for Normal/High-risk before commit/push/PR; prompt prefix 'Mode: verification')",
]
high_risk_minimum_set = [
  "qa-fast",
  "engineer",
  "code-reviewer (opus override)",
  "security-reviewer",
  "qa (verification)",
]
reroute_cycle_limit = 2  # per ROUTE_AND_RUN.md:473-474 (2-cycle reroute rule, Failure Routing Protocol in .claude/skills/ROUTE_AND_RUN.md)

[escalation_rules]
# What the Orchestrator does on common runtime escalations.
gate_f_discovered_late = "ADD security-reviewer to the remaining sequence; log the discovery + trigger in team-lead-execution-log.md as a 'ROUTING DECISION (REVISED)' entry citing the file:line that triggered Gate F. Continue execution. Do NOT halt unless adding security-reviewer is structurally impossible."
scope_expansion_needed = "Halt immediately. Write blocked.toml(reason_code=SCOPE_EXPANSION_REQUIRED) with detail naming the required path/scope. Main Agent decides whether to re-plan."
lean_mode_skip_eligible = "Orchestrator MAY skip qa-fast under Lean-mode only if ALL conditions at ROUTE_AND_RUN.md:357-369 hold. The skip MUST be recorded in team-lead-execution-log.md with all four AC26 fields (specialist_skipped, reason, rule_citation, replacement_evidence)."
ambiguous_plan = "Halt. Write blocked.toml(reason_code=AMBIGUOUS_PLAN) with detail quoting the contradictory or incomplete section of approved-plan.toml. Main Agent routes back to Planner."
model_routing_failure = "Halt. Write blocked.toml(reason_code=UNKNOWN, detail='model_routing_failure: <description>'). NO silent model switch. User decides retry on same model, escalation to Sonnet/Opus, or rollback."
specialist_unavailable = "Halt. Write blocked.toml(reason_code=SPECIALIST_FAILURE | SPECIALIST_NOT_ALLOWED) per the cause."

[stop_conditions]
# Orchestrator MUST halt and write blocked.toml on any of these.
items = [
  "unapproved file needed (write blocked.toml(OUT_OF_SCOPE) or (SCOPE_EXPANSION_REQUIRED))",
  "approved approach is wrong (AMBIGUOUS_PLAN)",
  "new dependency needed (SCOPE_EXPANSION_REQUIRED)",
  "backend/schema/auth change needed but not approved (OUT_OF_SCOPE)",
  "test requires changing acceptance criteria (AMBIGUOUS_PLAN)",
  "security finding outside approved scope (SECURITY_FAILED)",
  "specialist recommends scope expansion (SCOPE_EXPANSION_REQUIRED)",
  "code-reviewer terminal REQUEST_CHANGES (REVIEW_FAILED)",
  "code-reviewer cycle limit exceeded (REROUTE_LIMIT_EXCEEDED)",
  "qa verification FAIL (QA_FAILED) — no fix attempt; qa is read-only",
  "rate limit hit (RATE_LIMITED)",
  "timebox exceeded (TIMEBOX_EXCEEDED)",
  "Task tool not callable on Orchestrator (TOOL_UNAVAILABLE)",
  "approved_plan_sha256 mismatch at start of execution (AMBIGUOUS_PLAN)",
  "specialist not in category_allowlist or in always_forbidden (SPECIALIST_NOT_ALLOWED)",
]

[references]
route_and_run = ".claude/skills/ROUTE_AND_RUN.md"
route_and_run_tables = ".claude/skills/ROUTE_AND_RUN_TABLES.md"
skill_doc = ".claude/skills/route-and-run/SKILL.md"
mode3_run_command = ".claude/commands/mode3-run.md"
mode3_orchestrator_agent = ".claude/agents/mode3-orchestrator.md"
behavioural_evidence = ".claude/handoffs/agent-team-probe/at01-evidence.txt"
hardening_report = ".claude/hardening/team-lead-orchestration-stability-report.md"
design_validation = ".claude/hardening/mode3-routing-authority-design-validation.md"
