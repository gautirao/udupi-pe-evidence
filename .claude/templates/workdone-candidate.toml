# TEMPLATE — .claude/templates/workdone-candidate.toml
#
# Purpose: Executor teammate → Main Agent (lead). Written by the executor on
# SUCCESS only, after all Route-and-Run gates have passed.
#
# Internal-only packet; this is NOT the ChatGPT WORKDONE_REVIEW. Main Agent
# runs the 8-point intake checklist (sha256 verify, scope-lock diff, QA/E2E
# evidence verify) before assembling workdone-review-request.toml for ChatGPT.
#
# Preconditions (executor MUST NOT write this unless ALL hold):
#   (a) unit_tests in {PASS, NOT_REQUIRED} with justification when NOT_REQUIRED
#   (b) e2e_tests in {PASS, NOT_REQUIRED} with justification when NOT_REQUIRED
#   (c) scope_lock_self_check (advisory) computed and shows no violation
#   (d) sha256(approved-plan.toml) still matches approved-execution-handoff.toml
# Otherwise executor writes blocked.toml instead.
#
# Copy this file to:
#   .claude/handoffs/issue-<N>/workdone-candidate.toml

schema_version = "2"
gate = "WORKDONE_CANDIDATE"
issue = 0
branch = "feat/<N>-short-name"
# MANDATORY — populate with the actual sha256 of approved-execution-handoff.toml
# at completion time (e.g. `shasum -a 256 .claude/handoffs/issue-<N>/approved-execution-handoff.toml`).
# This is the integrity anchor the Main Agent checks in WORKDONE_REVIEW step 1(a)
# (`sha256(handoff on disk) == workdone-candidate.handoff_sha256`). Do NOT leave it as
# a placeholder and do NOT substitute a custom `[plan_chain]`/`approved_plan_sha256`-only
# block in its place — the top-level `handoff_sha256` field must be present and correct so
# the handoff→candidate integrity chain is verifiable directly from this field.
handoff_sha256 = "<hex digest of approved-execution-handoff.toml at completion time>"
executor_model = "sonnet"
started_at = "YYYY-MM-DDTHH:MM:SSZ"
finished_at = "YYYY-MM-DDTHH:MM:SSZ"

# Path E convention (post-#1096, Agent Teams MVP): the executor teammate is a
# top-level CC session and writes this file directly. Main Agent reads from
# disk; plain pane output is NOT authoritative.
materialised_by = "executor-teammate"

[summary]
description = "One-paragraph summary of the actual work done."
specialists_invoked = 0  # count of distinct specialist calls (excluding sentinel probe)
specialist_call_log = ".claude/handoffs/issue-<N>/team-lead-execution-log.md"

# --- ACCEPTANCE-CRITERION MAPPING -------------------------------------------
# Every AC from approved-plan.toml MUST appear.
[[ac_mapping]]
ac = "AC1 short text"
status = "done"  # done | partial | deferred
evidence = "path/to/File.tsx:L10-L40"

# --- SCOPE-LOCK FIELDS (advisory) -------------------------------------------
# Executor's self-check is ADVISORY. Main Agent runs authoritative scope-lock
# via `git diff --name-status origin/main...HEAD` during WORKDONE_REVIEW intake.
[evidence]
scope_lock_self_check = "PASS"  # PASS | VIOLATION_DETECTED
scope_lock_authoritative_note = "Main Agent runs `git diff --name-status` as the authoritative check."

# --- QA / E2E EVIDENCE (HARD GATE) ------------------------------------------
# ready_for = "WORKDONE_REVIEW" is only permitted when:
#   unit_tests in {PASS, NOT_REQUIRED} AND
#   e2e_tests in {PASS, NOT_REQUIRED} AND
#   every NOT_REQUIRED has a non-empty justification traceable to the approved plan.
unit_tests = "PASS"  # PASS | FAIL | NOT_REQUIRED
unit_tests_justification = ""  # required when NOT_REQUIRED
unit_tests_evidence_path = "path/to/test-output.txt"
e2e_tests = "PASS"  # PASS | FAIL | NOT_REQUIRED
e2e_tests_justification = ""  # required when NOT_REQUIRED
e2e_tests_evidence_path = "path/to/e2e-output.txt"

# Indexed-first navigation usage summary (AC15-AC19, AC29)
# Aggregated from the specialists' compact [jcm] blocks (see AGENTS.md § Specialist Code Navigation).
index_usage_summary = "<count of indexed lookups; count of direct-read fallbacks; fallback reasons logged in team-lead-execution-log.md>"

# --- TEST RUN DETAILS -------------------------------------------------------
[[tests.run]]
command = "<verbatim>"
owner = "qa"  # specialist that ran it
result = "PASS"  # PASS | FAIL | SKIPPED
timestamp = "YYYY-MM-DDTHH:MM:SSZ"
output_excerpt = "<short>"
known_skips_or_flakes = ""
e2e_sentinel = ""

[[tests.not_run]]
name = ""
reason = ""

# --- FILES CHANGED ----------------------------------------------------------
[files_changed]
paths = [
  # Should equal: git diff --name-only origin/main...HEAD
  # Each entry MUST match executor.allowed_file_globs from the handoff.
]

# --- REVIEWER VERDICTS ------------------------------------------------------
[review_verdicts]
code_reviewer = "APPROVE"  # APPROVE | REQUEST_CHANGES | N/A
security_reviewer = "N/A"  # APPROVE | REQUEST_CHANGES | N/A
qa = "PASS"                # PASS | FAIL | SKIPPED

# Skip-with-justification entries — one per specialist skipped (AC26).
# Empty list when no skips. Every entry MUST have all four fields.
[[skip_log]]
specialist_skipped = ""
reason = ""
rule_citation = ""  # e.g. "ROUTE_AND_RUN.md:369 Lean-mode"
replacement_evidence = ""  # path or "NONE"

# --- ROUTING DECISION LOG (NEW in #1098, schema v2) -------------------------
# Summarises the routing decision the Orchestrator made BEFORE invoking the
# first specialist. Main Agent WORKDONE_REVIEW intake verifies this section
# matches the ROUTING DECISION entry in team-lead-execution-log.md and that
# all selected specialists fall within the handoff's category_allowlist and
# all mandatory_gates appear in selected_sequence. Missing or empty section
# → WORKDONE_REVIEW fails.

[routing_decision_log]
risk_tier = ""          # mirror from handoff
issue_type = ""         # mirror from handoff
selected_sequence = [
  # Ordered list of specialists invoked. Format: "specialist-name — rule citation".
  # Example: "qa-fast — ROUTE_AND_RUN.md:352 (pre-implementation mandatory)"
]
gate_f_triggers_detected = []  # e.g. ["auth/JWT changes in src/auth/**"] or empty
expected_evidence = []         # e.g. ["qa-fast: risk register", "code-reviewer: APPROVE verdict"]
routing_log_entry_ref = ".claude/handoffs/issue-<N>/team-lead-execution-log.md ROUTING DECISION at <ISO-8601>"
notes = ""

# --- EVAL-CHECKLIST SATISFACTION MATRIX (Team Lead self-check) ---------------
# One entry per [eval_checklist].items entry in approved-execution-handoff.toml.
# Every item MUST be "PASS - <evidence>". Any "FAIL - ..." or "BLOCKED - ..."
# means the work is NOT done — the Team Lead writes blocked.toml instead of
# presenting it as complete. Main Agent WORKDONE_REVIEW intake verifies this
# matrix covers every handoff eval_checklist item and that all are PASS.
[eval_checklist_result]
# "Original eval-checklist item 1" = "PASS - evidence..."
# "Original eval-checklist item 2" = "FAIL - explanation..."  ← halts; not done

# --- BUG-ONLY: reproduction + fix-verification + bug eval matrix -------------
# Present ONLY when issue_type = bugfix. Omit entirely for non-bug issues.
[bug_reproduction]
status = ""   # REPRODUCED | NOT_REPRODUCED | PARTIALLY_REPRODUCED | ENVIRONMENT_OR_DATA_DEPENDENT
evidence = ""

[bug_fix_verification]
status = ""   # FIX_VERIFIED
same_scenario_retested = false   # MUST be true before WORKDONE_REVIEW for a bug
evidence = ""

[regression_test]
added_or_updated = false
test_name = ""

[bug_eval_checklist_result]
# "Original bug was reproduced or valid exception approved" = "PASS - evidence..."
# "Root cause is explained using evidence" = "PASS - evidence..."
# "Fix addresses the reproduced/supported behaviour" = "PASS - evidence..."
# "Regression test fails before fix or directly covers the bug condition" = "PASS - evidence..."
# "No unrelated behaviour changed" = "PASS - evidence..."
# "Post-fix evidence shows the bug no longer occurs" = "PASS - evidence..."

[deviations]
items = []

[risks]
items = []

[handoff_back]
ready_for = "WORKDONE_REVIEW"  # only set when ALL preconditions above are satisfied
reason = "All Route-and-Run gates passed; scope clean; AC fully mapped; QA/E2E evidence verified."

# Path E no-bypass invariant:
# This file does NOT authorise skipping any downstream gate. PLAN_REVIEW,
# scope-lock, code-reviewer, security-reviewer, QA, WORKDONE_REVIEW, PR_REVIEW,
# and Main Agent's 8-point intake checklist remain mandatory.
