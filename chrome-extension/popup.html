<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Udupi Property Tracker</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f23;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #4f46e5;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: #0f0f23;
      border-radius: 6px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4f46e5;
    }
    .stat-value.recent {
      color: #10b981;
    }
    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #444;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .btn-danger:hover {
      opacity: 0.9;
    }
    .btn-smart {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      color: white;
    }
    .btn-smart:hover {
      opacity: 0.9;
    }
    #smartResult {
      font-size: 12px;
      color: #10b981;
      margin-top: 4px;
      min-height: 16px;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.success {
      background: #065f46;
      color: #6ee7b7;
    }
    .status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .status.info {
      background: #1e3a5f;
      color: #7dd3fc;
    }
    .not-on-group {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .not-on-group-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .tip {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>🏠 Udupi Property Tracker</h1>
  
  <div class="section">
    <div class="section-title">API Configuration</div>
    <input type="text" id="apiUrl" placeholder="API Endpoint URL">
    <input type="text" id="apiKey" placeholder="API Key (anon key)">
    <button class="btn btn-secondary" id="saveConfig">Save Configuration</button>
  </div>

  <div id="notOnGroup" class="not-on-group" style="display: none;">
    <div class="not-on-group-icon">📍</div>
    <div>Navigate to a Facebook group to extract posts</div>
  </div>

  <div id="mainContent">
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="postsFound">0</div>
        <div class="stat-label">Posts Found</div>
      </div>
      <div class="stat">
        <div class="stat-value recent" id="recentPosts">0</div>
        <div class="stat-label">Last 2 Days</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="postsSelected">0</div>
        <div class="stat-label">Selected</div>
      </div>
    </div>

    <button class="btn btn-success" id="extractRecentBtn">
      🚀 Extract Last 2 Days
    </button>
    
    <button class="btn btn-secondary" id="autoScrollBtn">📜 Load More Posts (Auto-Scroll)</button>
    <button class="btn btn-danger hidden" id="stopScrollBtn">⏹️ Stop Scrolling</button>
    <button class="btn btn-secondary" id="selectAllBtn">Select All Posts</button>
    <button class="btn btn-smart" id="smartSelectBtn">✨ Smart Select</button>
    <div id="smartResult"></div>
    <button class="btn btn-primary" id="extractBtn" disabled>Extract Selected</button>
    
    <p class="tip">💡 Click "Load More Posts" to auto-scroll and load ~100+ posts</p>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
