<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .config-section {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }
    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
    }
    .stat-label {
      font-size: 10px;
      color: #64748b;
    }
    .warning {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #92400e;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>🏠 Udupi Property Tracker</h1>
  <p class="subtitle">Extract posts from Facebook groups</p>

  <div class="config-section">
    <label for="apiUrl">API Endpoint</label>
    <input type="text" id="apiUrl" placeholder="https://your-project.supabase.co/functions/v1/ingest-posts">
    
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="Your Supabase anon key">
    
    <button class="btn btn-secondary" id="saveConfig">Save Configuration</button>
  </div>

  <div class="warning" id="notOnGroup" style="display: none;">
    ⚠️ Navigate to a Facebook group page to extract posts
  </div>

  <div class="stats" id="stats" style="display: none;">
    <div class="stat">
      <div class="stat-value" id="postsFound">0</div>
      <div class="stat-label">Posts Found</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="postsSelected">0</div>
      <div class="stat-label">Selected</div>
    </div>
  </div>

  <button class="btn btn-primary" id="extractBtn" disabled>Extract Selected Posts</button>
  <button class="btn btn-secondary" id="selectAllBtn" style="display: none;">Select All Posts</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
