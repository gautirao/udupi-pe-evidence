events {}
http {
  # Local canonical auth gateway (#2750). Container network aliases are fixed by the gate:
  #   e2e-auth-gotrue (GoTrue :9999), e2e-auth-rest (PostgREST :3000).
  # Hosts are resolved at request time so a restart of an upstream does not wedge the gateway.
  resolver 127.0.0.11 valid=5s;

  # CORS lives HERE, like Kong on hosted Supabase: GoTrue does not emit CORS headers for the app's `apikey` request
  # header (found by the S7 sign-in) and PostgREST's own are replaced so the browser never sees a duplicate ACAO.
  # Only loopback browser origins are echoed - this gateway is loopback-bound and must never become a general proxy.
  map $http_origin $cors_origin {
    default "";
    "~^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$" $http_origin;
  }

  server {
    listen 8000;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, x-supabase-api-version, accept-profile, content-profile, prefer, range, accept" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Location, X-Supabase-Api-Version" always;
    add_header Vary "Origin" always;

    location /auth/v1/ {
      if ($request_method = OPTIONS) { return 204; }
      set $gotrue http://e2e-auth-gotrue:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $gotrue;
      proxy_set_header Host $http_host;
    }
    location /rest/v1/ {
      if ($request_method = OPTIONS) { return 204; }
      set $rest http://e2e-auth-rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest;
      proxy_set_header Host $http_host;
    }
  }
}
